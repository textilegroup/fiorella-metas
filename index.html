function parseNum(s) {
  if (typeof s === 'number') return s;
  s = String(s == null ? '' : s).trim().replace(/R\$\s?/i, '').replace(/\s/g, '');
  if (!s) return null;
  const temV = s.includes(','), temP = s.includes('.');
  if (temV && temP) s = s.lastIndexOf(',') > s.lastIndexOf('.') ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
  else if (temV) s = (LANG === 'en' && /^\d{1,3}(,\d{3})+$/.test(s)) ? s.replace(/,/g, '') : s.replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s) && LANG !== 'en') s = s.replace(/\./g, '');

/* Regras:
   - Meta em branco (nula) = ainda não lançada. A meta do trimestre só existe quando os 3 meses têm meta;
     a meta do ano só existe quando os 12 meses têm meta. Antes disso: "Aguardando dados".
   - Prêmio do mês = prêmio-base × multiplicador da faixa (padrão ≥90% 0,5× · ≥100% 1× · ≥105% 2×).
   - Recuperação trimestral (mar/jun/set/dez): o atingimento do trimestre (realizado ÷ meta do trimestre) é enquadrado
     nas mesmas faixas (90% / 100% / 105% ou as cadastradas). Cada mês do trimestre passa a ter direito a
     prêmio-base × faixa do trimestre; paga-se só a diferença sobre o que o mês já recebeu (nunca negativo,
     nada é estornado).
   - Recuperação anual (dez): mesma lógica com o atingimento do ano, descontando o já pago no mês e na
     recuperação trimestral. */
function faixasOrd(tb) {
  return ((tb && tb.faixas) || []).map(f => ({ min: Number(f.min), mult: Number(f.mult) }))
    .filter(f => isFinite(f.min) && isFinite(f.mult)).sort((a, b) => a.min - b.min);
}
function multDe(tb, ating) {
  if (ating == null || !isFinite(ating)) return 0;
  let m = 0;
  for (const f of faixasOrd(tb)) if (ating * 100 >= f.min - 1e-9) m = f.mult;
  return m;
}

  let s = 0;
  for (let i = de; i <= ate; i++) { const v = valorMeta(metas && metas[i - 1]); if (v == null) return null; s += v; }
  return s;
}
function calcular(tb, metas, premios, real, ate) {
  const meses = [];
  for (let i = 0; i < 12; i++) {
    const meta = valorMeta(metas && metas[i]), base = Number(premios && premios[i]) || 0;
    const r = real[i] == null ? null : Number(real[i]);
    const apurado = i + 1 <= ate && r != null && meta != null;
    const ating = meta != null && meta > 0 && r != null ? r / meta : null;
    const mult = apurado ? multDe(tb, ating) : 0;
    meses.push({ mes: i + 1, meta, base, real: r, apurado, ating, mult, premio: base * mult,
                 recTri: 0, recAno: 0, pagoTri: 0, pagoAno: 0, total: 0 });
  }
  const tri = [];
  for (let qd = 0; qd < 4; qd++) {
    const ms = meses.slice(qd * 3, qd * 3 + 3), fim = qd * 3 + 3;
    const metaQ = somaMetas(metas, qd * 3 + 1, fim);
    const realCompleto = ms.every(m => m.real != null);
    const realQ = sum(ms.map(m => m.real || 0));
    const atingQ = metaQ != null && metaQ > 0 && realCompleto ? realQ / metaQ : null;
    const apurado = ate >= fim && realCompleto && metaQ != null;
    // faixa atingida no trimestre: cada mês passa a valer prêmio-base × essa faixa, descontado o que já recebeu
    const multQ = (tb && tb.recup_tri) && apurado ? multDe(tb, atingQ) : 0;
    if (multQ > 0) ms.forEach(m => { m.recTri = Math.max(0, m.base * multQ - m.premio); });
    const valor = sum(ms.map(m => m.recTri));
    meses[fim - 1].pagoTri = valor;
    tri.push({ q: qd + 1, metaQ, realQ: realCompleto ? realQ : null, realParcial: realQ, atingQ, apurado, multQ, recuperou: multQ > 0, valor, premio: sum(ms.map(m => m.premio)) });
  }
  const metaA = somaMetas(metas, 1, 12);
  const realCompA = meses.every(m => m.real != null);
  const realA = sum(meses.map(m => m.real || 0));
  const atingA = metaA != null && metaA > 0 && realCompA ? realA / metaA : null;
  const anoApurado = ate >= 12 && realCompA && metaA != null;
  const multA = (tb && tb.recup_anual) && anoApurado ? multDe(tb, atingA) : 0;
  const recA = multA > 0;
  if (recA) meses.forEach(m => { m.recAno = Math.max(0, m.base * multA - m.premio - m.recTri); });
  meses[11].pagoAno = sum(meses.map(m => m.recAno));
  meses.forEach(m => { m.total = m.premio + m.pagoTri + m.pagoAno; });
  const noAcum = m => m.meta != null && (m.mes < ate || (m.mes === ate && m.real != null));
  const realAte = sum(meses.filter(noAcum).map(m => m.real || 0));
  const metaAte = sum(meses.filter(noAcum).map(m => m.meta));
  return {
    meses, tri,
    ano: { metaA, realA: realCompA ? realA : null, realParcial: realA, atingA, apurado: anoApurado, multA, recuperou: recA, valor: meses[11].pagoAno },
    ate, metaAte, realAte, atingAte: metaAte > 0 ? realAte / metaAte : null,
    totalAte: sum(meses.filter(m => m.mes <= ate).map(m => m.total)),
    premioBaseAno: sum(meses.map(m => m.base))
  };
}
function comissaoEquiv(tb, meta, base) {
  return faixasOrd(tb).map(f => ({ min: f.min, mult: f.mult,
    venda: meta == null ? null : meta * f.min / 100, premio: base * f.mult,
    pct: meta != null && meta > 0 && f.min > 0 ? (base * f.mult) / (meta * f.min / 100) : null }));
}
function classeMult(m) { return m >= 2 ? 'mt-m3' : m >= 1 ? 'mt-m2' : m > 0 ? 'mt-m1' : 'mt-m0'; }
window.MetasCalc = { calcular, multDe, comissaoEquiv, somaMetas, parseNum };

/* ------------------------- acesso aos dados ------------------------- */
function realDe(moduloId, vendedorId) {
  const arr = Array(12).fill(null);
  S.realizado.forEach(r => { if (r.modulo_id === moduloId && r.vendedor_id === vendedorId) arr[r.mes - 1] = Number(r.valor); });
  return arr;
}
function fechadosDe(moduloId) { const s = new Set(); S.fechamentos.forEach(f => { if (f.modulo_id === moduloId) s.add(f.mes); }); return s; }
function ultimoFechado(moduloId) { let u = 0; fechadosDe(moduloId).forEach(m => { if (m > u) u = m; }); return u; }
function vincDe(moduloId) {
  return S.mv.filter(x => x.modulo_id === moduloId)
    .map(x => ({ ...x, metas: (x.metas || Array(12).fill(null)).map(valorMeta), premios: (x.premios || Array(12).fill(0)), v: byId(S.vendedores, x.vendedor_id) }))
    .filter(x => x.v)
    .sort((a, b) => a.v.nome.localeCompare(b.v.nome, 'pt-BR'));
}
function calcVinc(mod, x, ate) { return calcular(byId(S.tabelas, mod.tabela_id), x.metas, x.premios, realDe(mod.id, x.vendedor_id), ate); }
function meusVendedores() { return S.vendedores.filter(v => v.email === S.email); }

async function carregar() {
  const sb = S.sb;
  const [reg, ven, tab, mod, mv, rea, fec] = await Promise.all([
    q(sb.from('met_regioes').select('*').order('nome')),
    q(sb.from('met_vendedores').select('*').order('nome')),
    q(sb.from('met_tabelas').select('*').order('nome')),
    q(sb.from('met_modulos').select('*').order('ano', { ascending: false }).order('nome')),
    q(sb.from('met_modulo_vendedores').select('*')),
    q(sb.from('met_realizado').select('*')),
    q(sb.from('met_fechamentos').select('*'))
  ]);
  Object.assign(S, { regioes: reg || [], vendedores: ven || [], tabelas: tab || [], modulos: mod || [],
                     mv: mv || [], realizado: rea || [], fechamentos: fec || [] });
  if (S.admin) { try { S.contas = await q(sb.rpc('met_contas_central')); } catch (_) { S.contas = null; } }
}

/* ------------------------------ modal ------------------------------ */
function modal({ titulo, corpo, botoes, largura }) {
  const el = document.createElement('div');
  el.className = 'mt-modal';
  el.innerHTML = `<section class="mt-modal__panel" role="dialog" aria-modal="true" style="${largura ? 'width:min(' + largura + 'px,100%)' : ''}">
    <div class="mt-modal__head"><span>${esc(titulo)}</span><span class="mt-sp"></span>
      <button class="fi-icon-btn" data-x aria-label="${t('Fechar')}">✕</button></div>
    <div class="mt-modal__body">${corpo}</div>
    <div class="mt-modal__foot"></div></section>`;
  const foot = $('.mt-modal__foot', el);
  const fechar = () => el.remove();
  (botoes || []).forEach(b => {
    const bt = document.createElement('button');
    bt.className = 'fi-btn' + (b.primario ? ' fi-btn--primary' : '') + (b.perigo ? ' fi-btn--danger' : '');
    bt.textContent = b.texto;
    if (b.esquerda) bt.style.marginRight = 'auto';
    bt.addEventListener('click', async () => {
      if (!b.acao) return fechar();
      bt.disabled = true;
      try { const r = await b.acao(el); if (r !== false) fechar(); }
      catch (e) { notify(erroMsg(e), 'danger'); }
      finally { bt.disabled = false; }
    });
    foot.appendChild(bt);
  });
  $('[data-x]', el).addEventListener('click', fechar);
  el.addEventListener('keydown', e => { if (e.key === 'Escape') fechar(); });
  $('#modal-root').appendChild(el);
  const f = $('input,select,textarea', el); if (f) f.focus();
  return el;
}

/* ------------------------------ rotas ------------------------------ */
function setHead(eyebrow, titulo, sub, acoesHtml) {
  $('#eyebrow').textContent = eyebrow;
  const tt = $('#titulo'), ver = tt.querySelector('.fi-ui-version');
  tt.textContent = titulo; if (ver) tt.appendChild(ver);
  $('#subtitulo').textContent = sub || '';
  $('#head-acoes').innerHTML = acoesHtml || '';
}
function navAtivo(r) {
  $$('#nav a').forEach(a => {
    const on = a.dataset.r === r;
    a.classList.toggle('fi-active', on);
    if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
}
function aplicarIdioma() {
  document.documentElement.lang = LANG === 'en' ? 'en' : 'pt-BR';
  document.title = t('Metas e Premiação') + ' · Fiorella';
  $$('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
  $$('[data-lang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === LANG)));
}
function trocarIdioma(l) {
  if (l === LANG) return;
  if ($('.mt-in.mt-dirty') && !window.confirm(t('Há alterações não salvas. Descartar?'))) return;
  LANG = l;
  try { localStorage.setItem('fiorella-metas-lang', l); } catch (_) {}
  $('#modal-root').innerHTML = '';
  aplicarIdioma(); rota();
}
function rota() {
  const h = (location.hash || '#/inicio').replace(/^#\/?/, '').split('/');
  const nome = h[0] || 'inicio';
  $('#nav').classList.remove('fi-open');
  try {
    if (nome === 'modulo' && h[1]) { navAtivo('inicio'); return vModulo(h[1]); }
    if (nome === 'painel') { navAtivo('painel'); return vPainel(); }
    if (nome === 'estrategia') { navAtivo('estrategia'); return vEstrategia(); }
    if (nome === 'adm' && S.admin) { navAtivo('adm'); if (h[1]) S.admTab = h[1]; return vAdm(); }
    navAtivo('inicio'); return vInicio();
  } catch (e) { console.error(e); $('#view').innerHTML = `<div class="fi-alert fi-alert--danger">${esc(erroMsg(e))}</div>`; }
}

/* ============================== INÍCIO ============================== */

      <p class="mt-small">${S.admin ? t('Crie o primeiro em Administração › Módulos de metas.') :
        (meusVendedores().length ? t('Assim que a gestão liberar a visualização, ele aparece aqui.') : esc(t('Seu e-mail ({e}) ainda não está cadastrado como vendedor.', { e: S.email })))}</p></div></div></div>`;
    return;
  }

    mods.filter(m => m.ano === ano).forEach(m => {
      const vinc = vincDe(m.id).filter(x => S.veTudo || x.v.email === S.email);
      const ate = Math.max(ultimoFechado(m.id), mesPadrao(m.ano));
      let meta = 0, real = 0, premio = 0;
      vinc.forEach(x => { const c = calcVinc(m, x, ate); meta += c.metaAte; real += c.realAte; premio += c.totalAte; });
      const at = meta > 0 ? real / meta : null;
      const tb = byId(S.tabelas, m.tabela_id), reg = byId(S.regioes, m.regiao_id), fech = ultimoFechado(m.id);
      html += `<article class="fi-card mt-modcard" data-mod="${m.id}" tabindex="0">
        <div class="fi-card__head"><div><div class="fi-card__title">${esc(m.nome)}</div>
          <div class="fi-card__note">${esc(tb ? tb.nome : '—')}${reg ? ' · ' + esc(reg.nome) : ''}</div></div>
          <div class="mt-row">${S.veTudo ? (m.visivel ? `<span class="fi-badge fi-badge--success">${t('Liberado')}</span>` : `<span class="fi-badge">${t('Oculto')}</span>`) : ''}
          ${!m.ativo ? `<span class="fi-badge fi-badge--warning">${t('Inativo')}</span>` : ''}</div></div>
        <div class="fi-card__body">
          <div class="mt-kv">
            <div><span>${t('Meta até {m}', { m: MES(ate - 1) })}</span><b>${meta ? brl0(meta) : WAIT()}</b></div>
            <div><span>${t('Realizado')}</span><b>${brl0(real)}</b></div>
            <div><span>${t('Atingido')}</span><b>${pct(at)}</b></div>
          </div>
          <div class="mt-bar" title="${t('Atingimento acumulado')}"><span style="width:${Math.min(100, (at || 0) / 1.1 * 100)}%"></span><i style="left:${90 / 1.1}%"></i><i style="left:${100 / 1.1}%"></i></div>
          <div class="mt-row mt-small mt-muted"><span>${t(vinc.length === 1 ? '{n} vendedor' : '{n} vendedores', { n: vinc.length })}</span><span class="mt-sp"></span>
            <span>${t('Premiação acumulada')} <b class="mt-strong" style="color:var(--fi-text)">${brl(premio)}</b></span></div>
          <div class="mt-small mt-muted">${fech ? t('Fechado até {m}', { m: MESL(fech - 1) }) : t('Nenhum mês fechado')}</div>
        </div></article>`;
    });
    html += `</div>`;
  });
  $('#view').innerHTML = html;
  $$('[data-mod]').forEach(c => {
    const go = () => { location.hash = '#/modulo/' + c.dataset.mod; };
    c.addEventListener('click', go);
    c.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  });
}

/* ========================== DETALHE DO MÓDULO ========================== */
function vModulo(id, mesSel, regSel) {
  const m = byId(S.modulos, id);
  if (!m) { location.hash = '#/inicio'; return; }
  const tb = byId(S.tabelas, m.tabela_id), fech = fechadosDe(m.id);
  const mes = mesSel || Math.max(ultimoFechado(m.id), mesPadrao(m.ano));
  let vinc = vincDe(m.id).filter(x => S.veTudo || x.v.email === S.email);
  if (regSel) vinc = vinc.filter(x => x.v.regiao_id === regSel);
  setHead(m.ano + (byId(S.regioes, m.regiao_id) ? ' · ' + byId(S.regioes, m.regiao_id).nome : ''), m.nome,
    (tb ? tb.nome : '') + (m.descricao ? ' — ' + m.descricao : ''),
    `<button class="fi-btn" id="bt-voltar">${t('← Módulos')}</button>
     <button class="fi-btn" id="bt-xls">${t('Exportar Excel')}</button>
     ${S.admin ? `<button class="fi-btn fi-btn--primary" id="bt-fechar">${t('Fechamento')}</button>` : ''}`);

  const linhas = vinc.map(x => ({ x, c: calcVinc(m, x, mes) }));
  const tot = { meta: 0, metaOk: true, real: 0, premio: 0, rec: 0, total: 0, metaAte: 0, realAte: 0, totalAte: 0 };
  linhas.forEach(({ c }) => {
    const mm = c.meses[mes - 1];
    if (mm.meta == null) tot.metaOk = false; else tot.meta += mm.meta;
    tot.real += mm.real || 0; tot.premio += mm.premio; tot.rec += mm.pagoTri + mm.pagoAno; tot.total += mm.total;
    tot.metaAte += c.metaAte; tot.realAte += c.realAte; tot.totalAte += c.totalAte;
  });
  const metaMes = tot.metaOk && linhas.length ? tot.meta : null;
  const regsDoMod = [...new Set(vincDe(m.id).map(x => x.v.regiao_id).filter(Boolean))];
  const mesesOpt = Array.from({ length: 12 }, (_, i) => `<option value="${i + 1}" ${i + 1 === mes ? 'selected' : ''}>${MESL(i)}${fech.has(i + 1) ? ' · ' + t('fechado') : ''}</option>`).join('');

  let html = `
  <div class="fi-card mt-noprint"><div class="fi-card__body fi-filters">
    <label class="fi-field"><span class="fi-label">${t('Mês de referência')}</span><select class="fi-select" id="f-mes">${mesesOpt}</select></label>
    ${S.veTudo && regsDoMod.length > 1 ? `<label class="fi-field"><span class="fi-label">${t('Região')}</span><select class="fi-select" id="f-reg">
      <option value="">${t('Todas')}</option>${regsDoMod.map(r => `<option value="${r}" ${r === regSel ? 'selected' : ''}>${esc((byId(S.regioes, r) || {}).nome)}</option>`).join('')}</select></label>` : ''}
    <div class="mt-sp"></div>
    <div class="mt-small mt-muted">${fech.has(mes) ? t('🔒 Mês fechado — valores congelados') : t('Mês aberto — valores ainda podem mudar')}</div>
  </div></div>

  <div class="fi-grid fi-grid--4 mt-mt">
    <div class="fi-card fi-metric fi-metric--brand"><div class="fi-metric__top"><span>${t('Meta {m}', { m: MES(mes - 1) })}</span></div><div class="fi-metric__value">${metaMes == null ? WAIT() : brl0(metaMes)}</div><div class="fi-metric__foot">${t('Realizado {v}', { v: brl0(tot.real) })}</div></div>
    <div class="fi-card fi-metric"><div class="fi-metric__top"><span>${t('Atingido no mês')}</span></div><div class="fi-metric__value">${pct(metaMes ? tot.real / metaMes : null)}</div><div class="fi-progress"><span style="width:${Math.min(100, metaMes ? tot.real / metaMes * 100 : 0)}%"></span></div></div>
    <div class="fi-card fi-metric"><div class="fi-metric__top"><span>${t('Acumulado até {m}', { m: MES(mes - 1) })}</span></div><div class="fi-metric__value">${pct(tot.metaAte ? tot.realAte / tot.metaAte : null)}</div><div class="fi-metric__foot">${t('{a} de {b}', { a: brl0(tot.realAte), b: brl0(tot.metaAte) })}</div></div>
    <div class="fi-card fi-metric"><div class="fi-metric__top"><span>${t('Premiação do mês')}</span></div><div class="fi-metric__value">${brl0(tot.total)}</div><div class="fi-metric__foot">${t('acumulado {v}', { v: brl0(tot.totalAte) })}</div></div>
  </div>`;

  html += `<section class="fi-card mt-mt2"><div class="fi-card__head"><div><div class="fi-card__title">${t('Vendedores — {m}/{a}', { m: MESL(mes - 1), a: m.ano })}</div>
    <div class="fi-card__note">${t('Prêmio = prêmio-base × % da faixa. Recuperações são pagas no fechamento de Mar/Jun/Set/Dez (trimestre) e Dez (ano).')}</div></div></div>
    <div class="fi-table-wrap" style="border:0;border-radius:0"><table class="fi-table" id="tb-mod"><thead><tr>
      <th>${t('Vendedor')}</th><th>${t('Região')}</th><th class="mt-num">${t('Meta')}</th><th class="mt-num">${t('Realizado')}</th><th class="mt-num">${t('Atingido')}</th><th>${t('Faixa')}</th>
      <th class="mt-num">${t('Prêmio-base')}</th><th class="mt-num">${t('Prêmio mês')}</th><th class="mt-num">${t('Recuperação')}</th><th class="mt-num">${t('Total mês')}</th>
      <th class="mt-num">${t('Acum. %')}</th><th class="mt-num">${t('Acum. prêmio')}</th><th class="mt-num">${t('Comissão equiv.')}</th></tr></thead><tbody>`;
  if (!linhas.length) html += `<tr><td colspan="13"><div class="fi-empty">${regSel ? t('Nenhum vendedor atrelado nesta região.') : t('Nenhum vendedor atrelado.')}</div></td></tr>`;
  linhas.forEach(({ x, c }) => {
    const mm = c.meses[mes - 1];
    const eq = mm.real && mm.total ? mm.total / mm.real : null;
    html += `<tr data-vend="${x.vendedor_id}" style="cursor:pointer">
      <td class="mt-strong">${esc(x.v.nome)}</td><td>${esc((byId(S.regioes, x.v.regiao_id) || {}).nome || '—')}</td>
      <td class="mt-num">${brlOuWait(mm.meta)}</td><td class="mt-num">${mm.real == null ? '<span class="mt-muted">—</span>' : brl(mm.real)}</td>
      <td class="mt-num">${pct(mm.ating)}</td><td><span class="mt-pill ${classeMult(mm.mult)}">${mm.apurado ? multTxt(mm.mult) : '—'}</span></td>
      <td class="mt-num">${brl(mm.base)}</td><td class="mt-num">${brl(mm.premio)}</td>
      <td class="mt-num ${mm.pagoTri + mm.pagoAno ? 'mt-pos mt-strong' : ''}">${brl(mm.pagoTri + mm.pagoAno)}</td>
      <td class="mt-num mt-strong">${brl(mm.total)}</td>
      <td class="mt-num">${pct(c.atingAte)}</td><td class="mt-num">${brl(c.totalAte)}</td>
      <td class="mt-num">${pct(eq, 2)}</td></tr>`;
  });
  html += `</tbody>${linhas.length > 1 ? `<tfoot><tr><td colspan="2">${t('Total')}</td><td class="mt-num">${brlOuWait(metaMes)}</td><td class="mt-num">${brl(tot.real)}</td>
    <td class="mt-num">${pct(metaMes ? tot.real / metaMes : null)}</td><td></td><td></td><td class="mt-num">${brl(tot.premio)}</td>
    <td class="mt-num">${brl(tot.rec)}</td><td class="mt-num">${brl(tot.total)}</td><td class="mt-num">${pct(tot.metaAte ? tot.realAte / tot.metaAte : null)}</td>
    <td class="mt-num">${brl(tot.totalAte)}</td><td></td></tr></tfoot>` : ''}</table></div>
    <div class="fi-card__foot">${t('Clique num vendedor para ver os 12 meses, os trimestres e a faixa de comissão equivalente.')}</div></section>`;

  html += regraHtml(tb);
  $('#view').innerHTML = html;

  $('#f-mes').addEventListener('change', e => vModulo(id, Number(e.target.value), regSel));
  const fr = $('#f-reg'); if (fr) fr.addEventListener('change', e => vModulo(id, mes, e.target.value || null));
  $('#bt-voltar').addEventListener('click', () => { location.hash = '#/inicio'; });
  $('#bt-xls').addEventListener('click', () => exportarModulo(m, mes, linhas));
  const bf = $('#bt-fechar'); if (bf) bf.addEventListener('click', () => { S.fechModulo = m.id; S.fechMes = mes; location.hash = '#/adm/fechamentos'; });
  $$('#tb-mod tr[data-vend]').forEach(tr => tr.addEventListener('click', () => {
    modalVendedorAno(m, vincDe(m.id).find(v => v.vendedor_id === tr.dataset.vend), mes);
  }));
}

function multPct(x) { return multTxt(x.mult); }
function regraHtml(tb) {
  if (!tb) return '';
  const f = faixasOrd(tb);

}

function tabelaAnoHtml(m, x, c) {
  const fech = fechadosDe(m.id);
  let h = `<div class="fi-table-wrap"><table class="fi-table"><thead><tr><th>${t('Mês')}</th><th class="mt-num">${t('Meta')}</th><th class="mt-num">${t('Realizado')}</th>
    <th class="mt-num">${t('Atingido')}</th><th>${t('Faixa')}</th><th class="mt-num">${t('Prêmio-base')}</th><th class="mt-num">${t('Prêmio')}</th>
    <th class="mt-num">${t('Rec. trimestre')}</th><th class="mt-num">${t('Rec. ano')}</th><th class="mt-num">${t('Total pago')}</th></tr></thead><tbody>`;
  c.meses.forEach(mm => {
    h += `<tr><td>${MES(mm.mes - 1)}${fech.has(mm.mes) ? `<span class="mt-lock" title="${t('Mês fechado')}">🔒</span>` : ''}</td>
      <td class="mt-num">${brlOuWait(mm.meta)}</td><td class="mt-num">${mm.real == null ? '<span class="mt-muted">—</span>' : brl(mm.real)}</td>
      <td class="mt-num">${pct(mm.ating)}</td><td><span class="mt-pill ${classeMult(mm.mult)}">${mm.apurado ? multTxt(mm.mult) : '—'}</span>${mm.recTri ? ` <span class="mt-small mt-pos" title="${t('Recuperado no trimestre')}">↺T</span>` : ''}${mm.recAno ? ` <span class="mt-small mt-pos" title="${t('Recuperado no ano')}">↺A</span>` : ''}</td>
      <td class="mt-num">${brl(mm.base)}</td><td class="mt-num">${brl(mm.premio)}</td>
      <td class="mt-num">${mm.pagoTri ? brl(mm.pagoTri) : ''}</td><td class="mt-num">${mm.pagoAno ? brl(mm.pagoAno) : ''}</td>
      <td class="mt-num mt-strong">${brl(mm.total)}</td></tr>`;
    if (mm.mes % 3 === 0) {
      const tq = c.tri[mm.mes / 3 - 1];
      h += `<tr class="mt-sub"><td>${t('{q}º tri', { q: tq.q })}</td><td class="mt-num">${brlOuWait(tq.metaQ)}</td><td class="mt-num">${brlOuWait(tq.realQ)}</td>
        <td class="mt-num">${tq.atingQ == null ? WAIT() : pct(tq.atingQ)}</td><td colspan="6">${tq.metaQ == null || tq.realQ == null ? WAIT() :
          !tq.apurado ? `<span class="mt-muted">${t('trimestre em andamento')}</span>` :
          tq.recuperou ? (tq.valor ? `<span class="mt-pos">${t('Faixa do trimestre {f} — recuperou {v}', { f: multTxt(tq.multQ), v: brl(tq.valor) })}</span>` : `<span class="mt-pos">${t('Faixa do trimestre {f} (nada a recuperar)', { f: multTxt(tq.multQ) })}</span>`)
          : `<span class="mt-muted">${t('Não bateu a meta do trimestre')}</span>`}</td></tr>`;
    }
  });
  h += `</tbody><tfoot><tr><td>${t('Ano')}</td><td class="mt-num">${brlOuWait(c.ano.metaA)}</td><td class="mt-num">${brlOuWait(c.ano.realA)}</td><td class="mt-num">${c.ano.atingA == null ? WAIT() : pct(c.ano.atingA)}</td>
    <td colspan="2">${c.ano.metaA == null || c.ano.realA == null ? WAIT() : c.ano.apurado ? (c.ano.recuperou ? `<span class="mt-pos">${t('Faixa do ano {f}', { f: multTxt(c.ano.multA) })}</span>` : t('Não bateu o ano')) : `<span class="mt-muted">${t('ano em andamento')}</span>`}</td>
    <td class="mt-num">${brl(sum(c.meses.map(z => z.premio)))}</td><td class="mt-num">${brl(sum(c.tri.map(z => z.valor)))}</td>
    <td class="mt-num">${brl(c.ano.valor)}</td><td class="mt-num">${brl(sum(c.meses.map(z => z.total)))}</td></tr></tfoot></table></div>`;
  return h;
}
function comissaoHtml(m, x, mes) {
  const tb = byId(S.tabelas, m.tabela_id);
  const meta = x.metas[mes - 1], base = Number(x.premios[mes - 1]) || 0;
  if (meta == null) return `<div class="fi-alert fi-alert--info">${t('Meta do mês não lançada')} — ${WAIT()}</div>`;
  const r = realDe(m.id, x.vendedor_id)[mes - 1] || 0;
  return `<div class="mt-falta">${comissaoEquiv(tb, meta, base).map(e => `<div><span>${t('{p} da meta · paga {m}', { p: num(e.min, 0) + '%', m: multTxt(e.mult) })}</span>
      <b>${brl0(e.venda)}</b><div class="mt-small mt-muted">${t('prêmio {v} · comissão equiv. {p}', { v: brl(e.premio), p: '<b>' + pct(e.pct, 2) + '</b>' })}</div>
      ${r < e.venda ? `<div class="mt-small mt-warn">${t('faltam {v}', { v: brl0(e.venda - r) })}</div>` : `<div class="mt-small mt-pos">${t('✓ atingido')}</div>`}</div>`).join('')}</div>`;
}
function modalVendedorAno(m, x, mes) {
  const c = calcVinc(m, x, Math.max(mes, ultimoFechado(m.id)));
  modal({ titulo: x.v.nome + ' — ' + m.nome, largura: 1040,
    corpo: `<div class="mt-small mt-muted">${t('Faixas de {m}: venda necessária, prêmio e o percentual de comissão que ele representa.', { m: MESL(mes - 1) })}</div>
      ${comissaoHtml(m, x, mes)}${tabelaAnoHtml(m, x, c)}`,
    botoes: [{ texto: t('Fechar'), primario: true }] });
}

function vPainel() {

          <div class="fi-metric__value">${mm.meta == null ? WAIT() : pct(mm.ating)}</div><div class="fi-metric__foot">${mm.meta == null ? '' : t('{a} de {b}', { a: brl0(mm.real || 0), b: brl0(mm.meta) })}</div></div>

        <div class="fi-card fi-metric"><div class="fi-metric__top"><span>${t('Acumulado no ano')}</span></div><div class="fi-metric__value">${pct(c.atingAte)}</div><div class="fi-metric__foot">${t('{a} de {b}', { a: brl0(c.realAte), b: brl0(c.metaAte) })}</div></div>

}

function formRegiao(r) {
  r = r || { nome: '', descricao: '', ativo: true };
  modal({ titulo: r.id ? t('Editar região') : t('Nova região'),
    corpo: `<div class="mt-form">
      <label class="fi-field mt-full"><span class="fi-label">${t('Nome *')}</span><input class="fi-input" id="r-nome" value="${esc(r.nome)}" placeholder="${t('Ex.: SP Capital, Sul, Nordeste')}"></label>
      <label class="fi-field mt-full"><span class="fi-label">${t('Descrição / cidades / estados')}</span><textarea class="fi-textarea" id="r-desc">${esc(r.descricao || '')}</textarea></label>
      <label class="mt-check"><input type="checkbox" id="r-ativo" ${r.ativo ? 'checked' : ''}> ${t('Ativa')}</label></div>`,
    botoes: [
      ...(r.id ? [{ texto: t('Excluir'), perigo: true, esquerda: true, acao: async () => {
        if (!await confirmar({ title: t('Excluir região'), message: t('Os vendedores desta região ficarão sem região.'), confirmText: t('Excluir'), danger: true })) return false;
        await q(S.sb.from('met_regioes').delete().eq('id', r.id)); await recarregar(t('Região excluída')); } }] : []),
      { texto: t('Cancelar') },
      { texto: t('Salvar'), primario: true, acao: async () => {
        const d = { nome: $('#r-nome').value.trim(), descricao: $('#r-desc').value.trim() || null, ativo: $('#r-ativo').checked };
        if (!d.nome) { notify(t('Informe o nome da região.'), 'warning'); return false; }
        if (r.id) await q(S.sb.from('met_regioes').update(d).eq('id', r.id)); else await q(S.sb.from('met_regioes').insert(d));
        await recarregar(t('Região salva'));

function contaStatus(email) {
  if (!S.contas) return '<span class="mt-muted mt-small">—</span>';
  const c = S.contas.find(x => x.email === email);
  if (!c) return `<span class="fi-badge fi-badge--warning" title="${t('Crie a conta deste e-mail na Central de Acesso')}">${t('Sem conta')}</span>`;
  if (!c.ativo) return `<span class="fi-badge fi-badge--warning">${t('Conta inativa')}</span>`;
  return `<span class="fi-badge fi-badge--success" title="${esc(t('Nível {n}', { n: c.nivel }))}">${t('Conta ativa')}</span>`;

function formTabela(tb) {
  tb = tb || { nome: '', faixas: [{ min: 90, mult: 0.5 }, { min: 100, mult: 1 }, { min: 105, mult: 2 }], recup_tri: true, recup_anual: true, observacao: '' };
  const emUso = tb.id && S.modulos.some(m => m.tabela_id === tb.id);
  const linhaFaixa = f => `<div class="mt-faixa" data-faixa>
      <label class="fi-field"><span class="fi-label">${t('Atingimento mínimo (%)')}</span><input class="fi-input" data-min value="${num(f.min, f.min % 1 ? 1 : 0)}"></label>
      <label class="fi-field"><span class="fi-label">${t('Paga do prêmio-base (%)')}</span><input class="fi-input" data-mult value="${num(f.mult * 100, 0)}"></label>
      <div class="fi-field"><span class="fi-label">${t('Equivale a')}</span><div class="mt-small mt-muted" data-eq style="min-height:38px;display:flex;align-items:center"></div></div>
      <button class="fi-icon-btn" data-rm title="${t('Remover faixa')}">✕</button></div>`;
  const el = modal({ titulo: tb.id ? t('Editar tabela de premiação') : t('Nova tabela de premiação'), largura: 720,
    corpo: `<label class="fi-field"><span class="fi-label">${t('Nome *')}</span><input class="fi-input" id="t-nome" value="${esc(tb.nome)}"></label>
      ${emUso ? `<div class="fi-alert fi-alert--warning">${t('Tabela em uso: mudanças valem para os meses ainda não fechados dos módulos que a usam.')}</div>` : ''}
      <div id="t-faixas" style="display:grid;gap:8px">${faixasOrd(tb).map(linhaFaixa).join('')}</div>
      <div><button class="fi-btn" id="t-add">${t('+ Faixa')}</button></div>
      <label class="mt-check"><input type="checkbox" id="t-tri" ${tb.recup_tri ? 'checked' : ''}> ${t('Recuperação trimestral — a faixa atingida no trimestre vale para os 3 meses, descontando o que cada mês já recebeu')}</label>
      <label class="mt-check"><input type="checkbox" id="t-ano" ${tb.recup_anual ? 'checked' : ''}> ${t('Recuperação anual — a faixa atingida no ano vale para os 12 meses, descontando o que cada mês já recebeu')}</label>
      <label class="fi-field"><span class="fi-label">${t('Observação')}</span><textarea class="fi-textarea" id="t-obs">${esc(tb.observacao || '')}</textarea></label>
      <div class="mt-help">${t('Exemplo de leitura: meta R$ 100.000 e prêmio-base R$ 1.000 → a faixa de 100% (paga 100%) paga R$ 1.000 sobre R$ 100.000 vendidos = 1,00% de comissão; a de 90% (paga 50%) paga R$ 500 sobre R$ 90.000 = 0,56%; a de 105% (paga 200%) paga R$ 2.000 sobre R$ 105.000 = 1,90%.')}</div>`,
    botoes: [
      ...(tb.id && !emUso ? [{ texto: t('Excluir'), perigo: true, esquerda: true, acao: async () => {
        if (!await confirmar({ title: t('Excluir tabela'), message: t('Excluir esta tabela de premiação?'), confirmText: t('Excluir'), danger: true })) return false;
        await q(S.sb.from('met_tabelas').delete().eq('id', tb.id)); await recarregar(t('Tabela excluída')); } }] : []),
      { texto: t('Cancelar') },
      { texto: t('Salvar'), primario: true, acao: async () => {
        const faixas = $$('[data-faixa]', el).map(r => ({ min: parseNum($('[data-min]', r).value), mult: (parseNum($('[data-mult]', r).value) || 0) / 100 }))
          .filter(f => f.min != null).sort((a, b) => a.min - b.min);
        const d = { nome: $('#t-nome').value.trim(), faixas, recup_tri: $('#t-tri').checked, recup_anual: $('#t-ano').checked, observacao: $('#t-obs').value.trim() || null };
        if (!d.nome) { notify(t('Informe o nome da tabela.'), 'warning'); return false; }
        if (!faixas.length) { notify(t('Inclua ao menos uma faixa.'), 'warning'); return false; }
        if (tb.id) await q(S.sb.from('met_tabelas').update(d).eq('id', tb.id)); else await q(S.sb.from('met_tabelas').insert(d));
        await recarregar(t('Tabela salva'));
      } }] });
  const atualizaEq = () => $$('[data-faixa]', el).forEach(r => {
    const mi = parseNum($('[data-min]', r).value), mu = (parseNum($('[data-mult]', r).value) || 0) / 100;
    $('[data-eq]', r).textContent = mi ? t('paga {m} do prêmio-base', { m: multTxt(mu) }) : '';
  });
  const liga = () => { $$('[data-rm]', el).forEach(b => b.onclick = () => { b.closest('[data-faixa]').remove(); }); $$('input', $('#t-faixas', el)).forEach(i => i.oninput = atualizaEq); atualizaEq(); };
  $('#t-add', el).onclick = () => { $('#t-faixas', el).insertAdjacentHTML('beforeend', linhaFaixa({ min: 110, mult: 2 })); liga(); };
  liga();
}

function editorVinculos(m) {
  const tb = byId(S.tabelas, m.tabela_id), fech = fechadosDe(m.id), atuais = vincDe(m.id);
  const candidatos = S.vendedores.filter(v => v.ativo && !atuais.some(x => x.vendedor_id === v.id) && (!m.regiao_id || v.regiao_id === m.regiao_id));
  const outros = S.vendedores.filter(v => v.ativo && !atuais.some(x => x.vendedor_id === v.id) && m.regiao_id && v.regiao_id !== m.regiao_id);
  const linha = x => {
    const metaA = somaMetas(x.metas, 1, 12);
    const eq100 = comissaoEquiv(tb, metaA, sum(x.premios)).find(e => e.mult === 1);
    return `<tr><td class="mt-strong">${esc(x.v.nome)}</td><td>${esc((byId(S.regioes, x.v.regiao_id) || {}).nome || '—')}</td>
      <td class="mt-num">${metaA == null ? WAIT() : brl0(metaA)}</td><td class="mt-num">${brl0(sum(x.premios))}</td><td class="mt-num">${pct(eq100 ? eq100.pct : null, 2)}</td>
      <td class="mt-num" style="white-space:nowrap"><button class="fi-btn" data-mm="${x.vendedor_id}">${t('Metas e prêmios')}</button>
      <button class="fi-icon-btn" data-rmv="${x.vendedor_id}" title="${t('Remover do módulo')}">✕</button></td></tr>`;
  };
  const el = modal({ titulo: t('Vendedores e metas — {n} ({a})', { n: m.nome, a: m.ano }), largura: 900,
    corpo: `<div class="mt-row"><select class="fi-select" id="vv-add" style="max-width:340px"><option value="">${t('Atrelar vendedor…')}</option>
        ${candidatos.map(v => `<option value="${v.id}">${esc(v.nome)}</option>`).join('')}
        ${outros.length ? `<optgroup label="${t('Outras regiões')}">${outros.map(v => `<option value="${v.id}">${esc(v.nome)}</option>`).join('')}</optgroup>` : ''}</select>
        <button class="fi-btn fi-btn--primary" id="vv-bt">${t('Atrelar')}</button>
        ${candidatos.length > 1 ? `<button class="fi-btn" id="vv-todos">${t(m.regiao_id ? 'Atrelar todos da região ({n})' : 'Atrelar todos ({n})', { n: candidatos.length })}</button>` : ''}</div>
      <div class="fi-table-wrap"><table class="fi-table"><thead><tr><th>${t('Vendedor')}</th><th>${t('Região')}</th><th class="mt-num">${t('Meta anual')}</th><th class="mt-num">${t('Prêmio-base anual')}</th><th class="mt-num">${t('Comissão equiv. 100%')}</th><th></th></tr></thead>
      <tbody>${atuais.map(linha).join('') || `<tr><td colspan="6"><div class="fi-empty">${t('Nenhum vendedor atrelado.')}</div></td></tr>`}</tbody></table></div>
      ${fech.size ? `<div class="fi-alert fi-alert--warning">${t('Meses já fechados ({m}) ficam travados na edição de metas.', { m: [...fech].sort((a, b) => a - b).map(i => MES(i - 1)).join(', ') })}</div>` : ''}`,
    botoes: [{ texto: t('Concluir'), primario: true }] });
  const vincular = async ids => {
    await q(S.sb.from('met_modulo_vendedores').insert(ids.map(id => ({ modulo_id: m.id, vendedor_id: id }))));
    await carregar(); el.remove(); editorVinculos(byId(S.modulos, m.id));

const nomeArq = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w]+/g, '_');

function mesDe(v) {

  if (/^\d{1,2}$/.test(s)) { const n = Number(s); return n >= 1 && n <= 12 ? n : null; }
  let mm = s.match(/^(\d{4})[-/](\d{1,2})/); if (mm) return Number(mm[2]);
  mm = s.match(/^(\d{1,2})[-/](\d{4})$/); if (mm) return Number(mm[1]);
  mm = s.match(/^\d{1,2}\/(\d{1,2})\/\d{2,4}$/); if (mm) return Number(mm[1]);

  let i = pt.findIndex(p => s.startsWith(p)); if (i < 0) i = en.findIndex(p => s.startsWith(p));
  return i >= 0 ? i + 1 : null;
}

    const mes = mesDe(r.mes != null && r.mes !== '' ? r.mes : (r.month || r.data || r.periodo || r.competencia));
    const valor = bruto === '' || bruto == null ? null : (typeof bruto === 'number' ? bruto : parseNum(bruto));
    if (!x) return erros.push(t('Linha {l}: vendedor “{v}” não está neste módulo', { l: lin, v: em || nm }));
    if (!mes) return erros.push(t('Linha {l}: mês inválido', { l: lin }));
    if (valor == null) return erros.push(t('Linha {l}: valor vazio ou inválido', { l: lin }));
    if (fech.has(mes)) return erros.push(t('Linha {l}: {m} já está fechado', { l: lin, m: MES(mes - 1) }));
    const k = x.vendedor_id + '|' + mes;
    soma.set(k, (soma.get(k) || 0) + valor);
  });
  soma.forEach((v, k) => { const [vid, mes] = k.split('|'); ok.push({ vendedor_id: vid, mes: Number(mes), valor: v }); });
  const nomeV = id => (byId(S.vendedores, id) || {}).nome;
  modal({ titulo: t('Prévia da importação — {f}', { f: file.name }), largura: 760,
    corpo: `<div class="mt-small">${t('{n} lançamento(s) válidos', { n: ok.length })}${erros.length ? `, <b class="mt-neg">${t('{n} linha(s) ignorada(s)', { n: erros.length })}</b>` : ''}. ${t('Linhas do mesmo vendedor e mês são somadas. Os valores importados substituem o que estiver lançado.')}</div>
      ${erros.length ? `<div class="fi-alert fi-alert--warning" style="display:block;max-height:120px;overflow:auto">${erros.slice(0, 50).map(esc).join('<br>')}</div>` : ''}
      <div class="fi-table-wrap" style="max-height:320px;overflow:auto"><table class="fi-table"><thead><tr><th>${t('Vendedor')}</th><th>${t('Mês')}</th><th class="mt-num">${t('Atual')}</th><th class="mt-num">${t('Importado')}</th></tr></thead><tbody>
      ${ok.sort((a, b) => nomeV(a.vendedor_id).localeCompare(nomeV(b.vendedor_id)) || a.mes - b.mes).map(o => {
        const at = realDe(m.id, o.vendedor_id)[o.mes - 1];
        return `<tr><td>${esc(nomeV(o.vendedor_id))}</td><td>${MES(o.mes - 1)}</td><td class="mt-num mt-muted">${at == null ? '—' : brl(at)}</td><td class="mt-num mt-strong">${brl(o.valor)}</td></tr>`; }).join('')}
      </tbody></table></div>`,
    botoes: [{ texto: t('Cancelar') }, ...(ok.length ? [{ texto: t('Gravar {n} lançamento(s)', { n: ok.length }), primario: true, acao: async () => { await gravarRealizado(m, ok); await recarregar(t('Importação gravada')); } }] : [])] });
}

/* ------------------------------ Fechamentos ------------------------------ */
function aFechamentos() {
  if (!S.modulos.length) { $('#adm-body').innerHTML = `<div class="fi-card"><div class="fi-empty">${t('Crie um módulo de metas primeiro.')}</div></div>`; return; }
  if (!byId(S.modulos, S.fechModulo)) S.fechModulo = S.modulos[0].id;
  const m = byId(S.modulos, S.fechModulo), tb = byId(S.tabelas, m.tabela_id), fech = fechadosDe(m.id), uf = ultimoFechado(m.id);
  if (!S.fechMes) S.fechMes = Math.min(12, uf + 1);
  const mes = S.fechMes, fechado = fech.has(mes), vinc = vincDe(m.id), ehTri = mes % 3 === 0;
  const linhas = vinc.map(x => {
    if (fechado) { const f = S.fechamentos.find(z => z.modulo_id === m.id && z.mes === mes && z.vendedor_id === x.vendedor_id); return { x, d: f ? f.dados : null, f }; }
    const real = realDe(m.id, x.vendedor_id).map((v, i) => (i + 1 <= mes && v == null ? 0 : v));
    const c = calcular(tb, x.metas, x.premios, real, mes), mm = c.meses[mes - 1];
    return { x, semLanc: realDe(m.id, x.vendedor_id)[mes - 1] == null, d: snapshot(m, tb, x, c, mm) };
  });
  const tot = k => sum(linhas.map(l => l.d ? l.d[k] : 0));
  const semLanc = linhas.filter(l => l.semLanc).length;
  const fe = linhas.find(l => l.f);
  const quando = fe ? { d: new Date(fe.f.fechado_em).toLocaleString(LOC()), p: esc(fe.f.fechado_por || '') } : null;
  const pctOuWait = v => v == null ? WAIT() : pct(v);
  let html = `<div class="mt-printhead"><img data-fi-logo style="width:120px"><h2 style="margin:6px 0 0">${esc(t('Fechamento {m}/{a} — {n}', { m: MESL(mes - 1), a: m.ano, n: m.nome }))}</h2>
      <div class="mt-small">${esc(t('Tabela: {n}', { n: tb ? tb.nome : '' }))} · ${fechado && quando ? t('Fechado em {d} por {p}', quando) : t('PRÉVIA — mês não fechado')}</div></div>
    <section class="fi-card mt-noprint"><div class="fi-card__body" style="display:grid;gap:10px">
      <div class="mt-row">${seletorModulo(m.id, 'f-mod')}<span class="mt-sp"></span>
        <button class="fi-btn" id="f-print">${t('Imprimir / PDF')}</button><button class="fi-btn" id="f-xls">${t('Exportar Excel')}</button>
        ${fechado ? `<button class="fi-btn fi-btn--danger" id="f-reabrir" ${mes !== uf ? `disabled title="${t('Reabra primeiro os meses posteriores')}"` : ''}>${t('Reabrir {m}', { m: MES(mes - 1) })}</button>`
                  : `<button class="fi-btn fi-btn--primary" id="f-fechar" ${mes !== uf + 1 || !vinc.length ? 'disabled' : ''}>${t('Fechar {m}', { m: MESL(mes - 1) })}</button>`}</div>
      <div class="mt-tabs" style="margin:0">${Array.from({ length: 12 }, (_, i) => `<button class="mt-tab" data-fm="${i + 1}" aria-selected="${i + 1 === mes}">${MES(i)}${fech.has(i + 1) ? ' 🔒' : ''}</button>`).join('')}</div>
      ${!fechado && mes !== uf + 1 ? `<div class="fi-alert fi-alert--info">${t('Os meses são fechados em sequência. Próximo a fechar: {m}.', { m: '<b>' + (uf < 12 ? MESL(uf) : '—') + '</b>' })}</div>` : ''}
      ${!fechado && semLanc ? `<div class="fi-alert fi-alert--warning">${t('{n} vendedor(es) sem lançamento em {m} — no fechamento serão considerados R$ 0,00.', { n: semLanc, m: MES(mes - 1) })}</div>` : ''}
      ${ehTri ? `<div class="fi-alert fi-alert--info">${t(mes === 12 ? 'Fim do {q}º trimestre: este fechamento inclui a recuperação trimestral e a recuperação anual.' : 'Fim do {q}º trimestre: este fechamento inclui a recuperação trimestral.', { q: mes / 3 })}</div>` : ''}
    </div></section>
    <section class="fi-card mt-mt"><div class="fi-card__head"><div><div class="fi-card__title">${fechado ? t('Fechamento') : t('Prévia do fechamento')} — ${MESL(mes - 1)}/${m.ano}</div>
      <div class="fi-card__note">${fechado && quando ? t('Fechado em {d} por {p} — valores congelados.', quando) : t('Valores calculados com os lançamentos atuais.')}</div></div>
      ${fechado ? `<span class="fi-badge fi-badge--success">${t('Fechado')}</span>` : `<span class="fi-badge fi-badge--warning">${t('Aberto')}</span>`}</div>
    <div class="fi-table-wrap" style="border:0"><table class="fi-table" id="tb-fech"><thead><tr><th>${t('Vendedor')}</th><th class="mt-num">${t('Meta')}</th><th class="mt-num">${t('Realizado')}</th><th class="mt-num">${t('Atingido')}</th>
      <th>${t('Faixa')}</th><th class="mt-num">${t('Prêmio-base')}</th><th class="mt-num">${t('Prêmio mês')}</th>${ehTri ? `<th class="mt-num">${t('Trim. %')}</th><th class="mt-num">${t('Rec. trimestre')}</th>` : ''}
      ${mes === 12 ? `<th class="mt-num">${t('Ano %')}</th><th class="mt-num">${t('Rec. ano')}</th>` : ''}<th class="mt-num">${t('Total a pagar')}</th><th class="mt-num">${t('Comissão efetiva')}</th></tr></thead><tbody>
      ${linhas.map(({ x, d, semLanc: sl }) => !d ? `<tr><td>${esc(x.v.nome)}</td><td colspan="12" class="mt-muted">${t('Sem registro neste fechamento (atrelado depois).')}</td></tr>` :
        `<tr><td class="mt-strong">${esc(d.vendedor || x.v.nome)}${sl ? ` <span class="fi-badge fi-badge--warning">${t('sem lançamento')}</span>` : ''}</td>
        <td class="mt-num">${brlOuWait(d.meta)}</td><td class="mt-num">${brl(d.realizado)}</td><td class="mt-num">${pct(d.atingimento)}</td>
        <td><span class="mt-pill ${classeMult(d.multiplicador)}">${multTxt(d.multiplicador)}</span></td><td class="mt-num">${brl(d.premio_base)}</td>
        <td class="mt-num">${brl(d.premio_mes)}</td>
        ${ehTri ? `<td class="mt-num">${pctOuWait(d.trimestre_atingimento)}</td><td class="mt-num ${d.recuperacao_tri ? 'mt-pos mt-strong' : ''}">${brl(d.recuperacao_tri)}</td>` : ''}
        ${mes === 12 ? `<td class="mt-num">${pctOuWait(d.ano_atingimento)}</td><td class="mt-num ${d.recuperacao_ano ? 'mt-pos mt-strong' : ''}">${brl(d.recuperacao_ano)}</td>` : ''}
        <td class="mt-num mt-strong">${brl(d.total)}</td><td class="mt-num">${pct(d.realizado ? d.total / d.realizado : null, 2)}</td></tr>`).join('') ||
        `<tr><td colspan="13"><div class="fi-empty">${t('Nenhum vendedor atrelado.')}</div></td></tr>`}
      </tbody>${linhas.length ? `<tfoot><tr><td>${t('Total')}</td><td class="mt-num">${linhas.some(l => l.d && l.d.meta == null) ? WAIT() : brl(tot('meta'))}</td><td class="mt-num">${brl(tot('realizado'))}</td>
        <td class="mt-num">${pct(tot('meta') ? tot('realizado') / tot('meta') : null)}</td><td></td><td class="mt-num">${brl(tot('premio_base'))}</td><td class="mt-num">${brl(tot('premio_mes'))}</td>
        ${ehTri ? `<td></td><td class="mt-num">${brl(tot('recuperacao_tri'))}</td>` : ''}${mes === 12 ? `<td></td><td class="mt-num">${brl(tot('recuperacao_ano'))}</td>` : ''}
        <td class="mt-num">${brl(tot('total'))}</td><td class="mt-num">${pct(tot('realizado') ? tot('total') / tot('realizado') : null, 2)}</td></tr></tfoot>` : ''}</table></div>
    <div class="fi-card__foot">${t('Comissão efetiva = total a pagar ÷ realizado do mês.')}</div></section>
    ${regraHtml(tb)}`;
  $('#adm-body').innerHTML = html;
  if (UI()) UI().init($('#adm-body'));
  $('#f-mod').onchange = e => { S.fechModulo = e.target.value; S.fechMes = null; aFechamentos(); };
  $$('[data-fm]').forEach(b => b.onclick = () => { S.fechMes = Number(b.dataset.fm); aFechamentos(); });
  $('#f-print').onclick = () => window.print();
  $('#f-xls').onclick = () => exportarFechamento(m, mes, linhas, fechado, ehTri);
  const bf = $('#f-fechar');
  if (bf) bf.onclick = async () => {
    if (!await confirmar({ title: t('Fechar {m}/{a}', { m: MESL(mes - 1), a: m.ano }), message: t('Congela os valores de {n} vendedor(es) — total a pagar {v}. Os lançamentos deste mês ficam travados.', { n: linhas.length, v: brl(tot('total')) }), confirmText: t('Fechar mês') })) return;
    bf.disabled = true;
    try {
      const quem = S.nome || S.email;
      await q(S.sb.from('met_fechamentos').insert(linhas.filter(l => l.d).map(l => ({ modulo_id: m.id, mes, vendedor_id: l.x.vendedor_id, dados: l.d, fechado_por: quem }))));
      S.fechMes = Math.min(12, mes + 1);
      await recarregar(t('{m} fechado', { m: MESL(mes - 1) }));
    } catch (e) { notify(erroMsg(e), 'danger'); bf.disabled = false; }
  };
  const br = $('#f-reabrir');
  if (br) br.onclick = async () => {
    if (!await confirmar({ title: t('Reabrir {m}', { m: MESL(mes - 1) }), message: t('Apaga o fechamento congelado deste mês e libera os lançamentos para correção.'), confirmText: t('Reabrir'), danger: true })) return;
    try { await q(S.sb.from('met_fechamentos').delete().eq('modulo_id', m.id).eq('mes', mes)); await recarregar(t('{m} reaberto', { m: MESL(mes - 1) })); }
    catch (e) { notify(erroMsg(e), 'danger'); }
  };
}
function snapshot(m, tb, x, c, mm) {
  const tq = c.tri[Math.ceil(mm.mes / 3) - 1];
  return {
    vendedor: x.v.nome, email: x.v.email, regiao: (byId(S.regioes, x.v.regiao_id) || {}).nome || null,
    meta: mm.meta, realizado: mm.real || 0, atingimento: mm.ating, multiplicador: mm.mult,
    premio_base: mm.base, premio_mes: mm.premio,
    trimestre_meta: mm.mes % 3 === 0 ? tq.metaQ : null, trimestre_faixa: mm.mes % 3 === 0 ? tq.multQ : null, trimestre_atingimento: mm.mes % 3 === 0 ? tq.atingQ : null, recuperacao_tri: mm.pagoTri,
    meses_recuperados_tri: mm.mes % 3 === 0 ? c.meses.slice(mm.mes - 3, mm.mes).filter(z => z.recTri).map(z => z.mes) : [],
    ano_meta: mm.mes === 12 ? c.ano.metaA : null, ano_faixa: mm.mes === 12 ? c.ano.multA : null, ano_atingimento: mm.mes === 12 ? c.ano.atingA : null, recuperacao_ano: mm.pagoAno,
    meses_recuperados_ano: mm.mes === 12 ? c.meses.filter(z => z.recAno).map(z => z.mes) : [],
    total: mm.total, acumulado_ano: c.totalAte,
    tabela: tb ? { nome: tb.nome, faixas: faixasOrd(tb), recup_tri: tb.recup_tri, recup_anual: tb.recup_anual } : null
  };
}
function exportarFechamento(m, mes, linhas, fechado, ehTri) {
  if (!window.XLSX) { notify(t('Biblioteca de Excel ainda carregando, tente de novo.'), 'warning'); return; }
  const p100 = v => v == null ? t('Aguardando dados') : +(v * 100).toFixed(2);
  const rows = linhas.filter(l => l.d).map(({ d }) => {
    const r = { [t('Vendedor')]: d.vendedor, [t('E-mail')]: d.email, [t('Região')]: d.regiao || '', [t('Meta')]: d.meta == null ? t('Aguardando dados') : d.meta, [t('Realizado')]: d.realizado,
      [t('Atingido %')]: d.atingimento == null ? '' : p100(d.atingimento), [t('Faixa (% do prêmio)')]: p100(d.multiplicador), [t('Prêmio-base')]: d.premio_base, [t('Prêmio mês')]: d.premio_mes };
    if (ehTri) { r[t('Trimestre %')] = p100(d.trimestre_atingimento); r[t('Recuperação trimestre')] = d.recuperacao_tri; }
    if (mes === 12) { r[t('Ano %')] = p100(d.ano_atingimento); r[t('Recuperação ano')] = d.recuperacao_ano; }
    r[t('Total a pagar')] = d.total; r[t('Acumulado no ano')] = d.acumulado_ano;
    return r;
  });
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), ((fechado ? t('Fechamento ') : t('Previa ')) + MES(mes - 1)).slice(0, 31));
  XLSX.writeFile(wb, `fechamento_${nomeArq(m.nome)}_${m.ano}_${String(mes).padStart(2, '0')}${fechado ? '' : '_previa'}.xlsx`);
}
function exportarModulo(m, mes, linhas) {
  if (!window.XLSX) { notify(t('Biblioteca de Excel ainda carregando, tente de novo.'), 'warning'); return; }
  const rows = [];
  linhas.forEach(({ x, c }) => c.meses.forEach(mm => rows.push({ [t('Vendedor')]: x.v.nome, [t('Mês')]: MES(mm.mes - 1), [t('Meta')]: mm.meta == null ? t('Aguardando dados') : mm.meta, [t('Realizado')]: mm.real == null ? '' : mm.real,
    [t('Atingido %')]: mm.ating == null ? '' : +(mm.ating * 100).toFixed(2), [t('Faixa (% do prêmio)')]: mm.apurado ? +(mm.mult * 100).toFixed(0) : '', [t('Prêmio-base')]: mm.base, [t('Prêmio')]: mm.premio,
    [t('Rec. trimestre')]: mm.pagoTri, [t('Rec. ano')]: mm.pagoAno, [t('Total')]: mm.total })));
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), (t('Metas ') + m.ano).slice(0, 31));
  XLSX.writeFile(wb, `metas_${nomeArq(m.nome)}_${m.ano}_${MES_EN[mes - 1]}.xlsx`);
}

/* ------------------------------ início ------------------------------ */
$$('[data-lang]').forEach(b => b.addEventListener('click', () => trocarIdioma(b.dataset.lang)));
aplicarIdioma();
async function iniciar() {
  try {
    const app = await window.APP.pronto;
    S.sb = app.sb; S.perm = app.permissao; S.admin = app.permissao === 'admin';
    S.veTudo = S.admin || app.permissao === 'editar';
    S.email = String(app.usuario.email || '').toLowerCase(); S.nome = app.usuario.nome || '';
    if (S.admin) $('#nav-adm').classList.remove('mt-hidden');
    await carregar();
    if (!meusVendedores().length && S.veTudo) $('#nav-painel').classList.add('mt-hidden');
    window.addEventListener('hashchange', () => { $('#modal-root').innerHTML = ''; rota(); });
    rota();
  } catch (e) {
    if (typeof e === 'string') return;
    console.error(e);
    $('#view').innerHTML = `<div class="fi-alert fi-alert--danger">${esc(t('Não foi possível carregar os dados: {e}', { e: erroMsg(e) }))}</div>`;
  }
}
if (window.APP && window.APP.pronto) iniciar();
else document.addEventListener('DOMContentLoaded', () => window.APP && window.APP.pronto ? iniciar() : ($('#view').innerHTML = `<div class="fi-alert fi-alert--danger">${t('Login da Central de Acesso não carregou.')}</div>`));
})();
</script>
