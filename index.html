  $('#adm-body').innerHTML = `
  <section class="fi-card"><div class="fi-card__head"><div><div class="fi-card__title">${t('Relatório geral de pagamentos')}${dica(t('Junta todos os módulos escolhidos, pessoa a pessoa, com prêmio ou comissão, recuperações e total a pagar. O PDF é ajustado para caber em uma folha A4. Meses fechados usam os valores congelados; meses abertos entram como prévia (marcados com *).'))}</div>
      <div class="fi-card__note">${t('Para conferência e envio ao financeiro — cabe em uma folha A4.')}</div></div>
      <div class="mt-row"><button class="fi-btn" id="r-xls">${t('Exportar Excel')}</button><button class="fi-btn fi-btn--primary" id="r-pdf">${t('Gerar PDF de pagamentos')}</button></div></div>
    <div class="fi-card__body" style="display:grid;gap:10px">
      <div class="fi-filters">
        <label class="fi-field"><span class="fi-label">${t('Ano')}</span><select class="fi-select" id="r-ano" style="width:auto">${anos.map(a => `<option value="${a}" ${a === ano ? 'selected' : ''}>${a}</option>`).join('')}</select></label>
        <label class="fi-field"><span class="fi-label">${t('Mês de referência')}</span><select class="fi-select" id="r-mes" style="width:auto">${mesOpt}</select></label>
        <div class="fi-field"><span class="fi-label">${t('Período')}</span><div class="mt-tabs" style="margin:0"><button class="mt-tab" data-rmodo="mes" aria-selected="${modo === 'mes'}">${t('Só o mês')}</button><button class="mt-tab" data-rmodo="acum" aria-selected="${modo === 'acum'}">${esc(t('Jan. até {m}', { m: MES(mes - 1).toLowerCase() }))}</button></div></div>
        <label class="mt-check" style="align-self:end"><input type="checkbox" id="r-so" ${S.relSoValor ? 'checked' : ''}> ${t('Só quem tem valor a pagar')}</label>
      </div>
      <div class="mt-row" style="gap:6px 14px">${modsAno.map(m => `<label class="mt-check"><input type="checkbox" data-rm="${m.id}" ${S.relMods.includes(m.id) ? 'checked' : ''}> ${esc(m.nome)}</label>`).join('')}</div>
      ${prev ? `<div class="fi-alert fi-alert--warning">${esc(t('{n} linha(s) com mês ainda não fechado entram como prévia (*).', { n: prev }))}</div>` : ''}
    </div>
    <div class="fi-table-wrap" style="border:0"><table class="fi-table" id="tb-rel"><thead><tr><th>${t('Pessoa')}</th><th>${t('Módulo')}</th><th class="mt-num">${t('Meta')}</th><th class="mt-num">${t('Realizado')}</th><th class="mt-num">${t('Atingido')}</th>${modo === 'mes' ? `<th class="mt-num">${t('Faixa / %')}</th>` : ''}<th class="mt-num">${t('Prêmio / comissão')}</th><th class="mt-num">${t('Rec. tri')}</th><th class="mt-num">${t('Rec. ano')}</th><th class="mt-num">${t('Total a pagar')}</th></tr></thead><tbody>
      ${rows.map(r => `<tr><td class="mt-strong">${esc(r.pessoa)}</td><td>${esc(r.modulo)}${r.fechado ? '' : ' <span class="fi-badge fi-badge--warning">' + t('prévia') + '</span>'}</td><td class="mt-num">${r.meta == null ? '—' : brl(r.meta)}</td><td class="mt-num">${brl(r.real)}</td><td class="mt-num">${pct(r.ating)}</td>${modo === 'mes' ? `<td class="mt-num">${faixaTxt(r.faixa)}</td>` : ''}<td class="mt-num">${brl(r.premio)}</td><td class="mt-num">${r.rtri ? brl(r.rtri) : ''}</td><td class="mt-num">${r.rano ? brl(r.rano) : ''}</td><td class="mt-num mt-strong">${brl(r.total)}</td></tr>`).join('')
        || `<tr><td colspan="10"><div class="fi-empty">${t('Nada a mostrar com esses filtros.')}</div></td></tr>`}</tbody>
      ${rows.length ? `<tfoot><tr><td>${t('Total geral')}</td><td></td><td></td><td></td><td></td>${modo === 'mes' ? '<td></td>' : ''}<td class="mt-num">${brl(sum(rows.map(r => r.premio)))}</td><td class="mt-num">${brl(sum(rows.map(r => r.rtri)))}</td><td class="mt-num">${brl(sum(rows.map(r => r.rano)))}</td><td class="mt-num mt-strong" id="r-total">${brl(sum(rows.map(r => r.total)))}</td></tr></tfoot>` : ''}</table></div></section>

  <section class="fi-card mt-mt2"><div class="fi-card__head"><div><div class="fi-card__title">${t('Fechamento individual')}${dica(t('Uma folha A4 por pessoa (vendedor ou supervisor) com todas as metas dela no mês: valores de cada meta, total a pagar, evolução no ano e regras. Usa o mês de referência escolhido acima.'))}</div>
      <div class="fi-card__note">${esc(t('Por pessoa, com todas as metas — {m}/{a}.', { m: MESL(mes - 1), a: ano }))}</div></div>
      <button class="fi-btn" id="r-ptodos">${t('PDFs individuais (todos)')}</button></div>
    <div class="fi-table-wrap" style="border:0"><table class="fi-table" id="tb-ind"><thead><tr><th>${t('Pessoa')}</th><th>${t('Função')}</th><th>${t('Metas')}</th><th class="mt-num">${t('Total a pagar')}</th><th>${t('Situação')}</th><th></th></tr></thead><tbody>
      ${pessoasComMeta(ano).map(v => { const rp = resumoPessoa(v, ano, mes); return `<tr><td class="mt-strong">${esc(v.nome)}</td><td>${funcaoNome(v)}</td>
        <td style="white-space:normal">${rp.itens.map(o => `<span class="fi-badge" style="margin:1px">${esc(o.m.nome)}</span>`).join(' ')}</td><td class="mt-num mt-strong">${brl(rp.total)}</td>
        <td>${rp.fechado ? `<span class="fi-badge fi-badge--success">${t('Fechado')}</span>` : `<span class="fi-badge fi-badge--warning">${t('Prévia')}</span>`}</td>
        <td class="mt-num"><button class="fi-btn" data-pdfp="${v.id}">${t('PDF individual')}</button></td></tr>`; }).join('') || `<tr><td colspan="6"><div class="fi-empty">${t('Ninguém atrelado a metas neste ano.')}</div></td></tr>`}</tbody></table></div></section>

  <section class="fi-card mt-mt2"><div class="fi-card__head"><div><div class="fi-card__title">${t('Fechamento do módulo')}</div>
      <div class="fi-card__note">${t('PDF do fechamento de um módulo (com anexos por pessoa) e planilha do mês.')}</div></div></div>
    <div class="fi-card__body" style="display:grid;gap:10px">
      <div class="fi-filters">
        <label class="fi-field"><span class="fi-label">${t('Módulo')}</span>${seletorModulo(S.relMod, 'r-mod').replace('<select', '<select data-filtro-ano="' + ano + '"')}</label>
        <span class="mt-small mt-muted" style="align-self:center">${mr ? (fechadosDe(mr.id).has(mes) ? '✓ ' + esc(t('{m} fechado', { m: MESL(mes - 1) })) : esc(t('{m} ainda aberto — sai como prévia', { m: MESL(mes - 1) }))) : ''}</span>
      </div>
      <div class="mt-row">
        <button class="fi-btn" id="r-fpdf">${t('PDF do fechamento do módulo')}</button>
        <button class="fi-btn" id="r-fxls">${t('Excel do fechamento')}</button>
      </div>
    </div></section>`;
  const rel = () => aRelatorios();
  $('#r-ano').onchange = e => { S.relAno = Number(e.target.value); S.relMes = null; S.relMods = null; rel(); };
  $('#r-mes').onchange = e => { S.relMes = Number(e.target.value); rel(); };
  $$('[data-rmodo]').forEach(b => b.onclick = () => { S.relModo = b.dataset.rmodo; rel(); });
  $('#r-so').onchange = e => { S.relSoValor = e.target.checked; rel(); };
  $$('[data-rm]').forEach(c => c.onchange = () => { S.relMods = $$('[data-rm]').filter(z => z.checked).map(z => z.dataset.rm); rel(); });
  $('#r-pdf').onclick = () => { if (!rows.length) { notify(t('Nada a mostrar com esses filtros.'), 'warning'); return; } pdfPagamentos(ano, mes, modo, mods, rows); };
  $('#r-xls').onclick = () => excelPagamentos(ano, mes, modo, rows);
  // módulo
  const selM = $('#r-mod'); $$('option', selM).forEach(o => { const z = byId(S.modulos, o.value); if (!z || z.ano !== ano) o.remove(); });
  selM.onchange = e => { S.relMod = e.target.value; rel(); };
  const linhasMod = () => vincDe(mr.id).map(x => dadosMes(mr, x, mes));
  $('#r-fpdf').onclick = () => { if (!mr) return; const ls = linhasMod(), f0 = ls.find(l => l.f); pdfFechamento(mr, mes, ls, ls.length && ls.every(l => l.fechado), mes % 3 === 0, quandoDe(f0)); };
  $('#r-fxls').onclick = () => { if (!mr) return; const ls = linhasMod(); exportarFechamento(mr, mes, ls, ls.length && ls.every(l => l.fechado), mes % 3 === 0); };
  $('#r-ptodos').onclick = () => pdfPessoas(pessoasComMeta(ano), ano, mes);
  $$('[data-pdfp]').forEach(b => b.onclick = () => { const v = byId(S.vendedores, b.dataset.pdfp); if (v) pdfPessoas([v], ano, mes); });
}

/* ------------------------------ início ------------------------------ */
/* ============================== VISIBILIDADE ============================== */
const SECOES = [['inicio', 'Início'], ['painel', 'Meu painel'], ['estrategia', 'Estratégia'],
  ['adm-distribuicao', 'Distribuição'], ['adm-modulos', 'Módulos de metas'], ['adm-fechamento', 'Lançamentos e fechamento'], ['adm-relatorios', 'Relatórios'],
  ['adm-vendedores', 'Vendedores e supervisores'], ['adm-acessos', 'Acessos']];
const padraoSecoes = admin => admin ? SECOES.map(z => z[0]) : ['inicio', 'painel', 'estrategia'];
function secoesDe(email, admin) {
  const pad = padraoSecoes(admin), row = (S.vis || []).find(v => v.email === email);
  let r = row ? pad.filter(k => (row.secoes || []).includes(k)) : pad;
  if (admin && email === S.email && !r.includes('adm-acessos')) r = r.concat('adm-acessos');   // ninguém se tranca para fora
  return r;
}
const pode = k => secoesDe(S.email, S.admin).includes(k);
const podeAdm = () => SECOES.some(([k]) => k.startsWith('adm-') && pode(k));
function aplicarVisibilidade() {
  $('#nav a[data-r="inicio"]').classList.toggle('mt-hidden', !pode('inicio'));
  $('#nav-painel').classList.toggle('mt-hidden', !pode('painel') || (!meusVendedores().length && S.veTudo));
  $('#nav a[data-r="estrategia"]').classList.toggle('mt-hidden', !pode('estrategia'));
  $('#nav-adm').classList.toggle('mt-hidden', !(S.admin && podeAdm()));
}

/* ======================= EDIÇÃO DE TEXTOS (ADM) =======================
   Como no fiorella-ia: botão "Editar" no canto inferior direito; os textos fixos da tela
   ganham contorno tracejado e podem ser alterados ali mesmo. Salvo em met_textos (por idioma). */
const ED_INLINE = new Set(['B', 'STRONG', 'I', 'EM', 'BR']);
const ED_FORA = 'input,select,textarea,button,a,option,svg,canvas,[data-noed],.fi-table td';
S.edPend = new Map(); S.editando = false;
let edNorm = null, edNormN = -1, edObs = null;
function mapaEditavel() {
  if (edNorm && edNormN === T_KEYS.size) return edNorm;
  edNorm = new Map(); const tp = document.createElement('template');
  T_KEYS.forEach((k, out) => { tp.innerHTML = out; const n = tp.innerHTML.trim(); if (n && !edNorm.has(n)) edNorm.set(n, k); });
  edNormN = T_KEYS.size; return edNorm;
}
function limparHtml(el) {
  const out = document.createElement('div');
  (function walk(src, dst) {
    src.childNodes.forEach(n => {
      if (n.nodeType === 3) dst.appendChild(document.createTextNode(n.textContent));
      else if (n.nodeType === 1) { if (ED_INLINE.has(n.tagName)) { const e = document.createElement(n.tagName.toLowerCase()); dst.appendChild(e); walk(n, e); } else walk(n, dst); }
    });
  })(el, out);
  return out.innerHTML.trim();
}
const valorEd = el => el.dataset.edh === '1' ? limparHtml(el) : el.textContent.replace(/[<>]/g, '').replace(/\s+/g, ' ').trim();
function marcarEditaveis() {
  if (!S.editando) return;
  const mapa = mapaEditavel();
  $$('.fi-page *').forEach(el => {
    if (el.dataset.edk || el.closest(ED_FORA) || (el.parentElement && el.parentElement.closest('[data-edk]'))) return;
    if (![...el.children].every(c => ED_INLINE.has(c.tagName)) || !el.textContent.trim() || el.offsetParent === null) return;
    const k = mapa.get(el.innerHTML.trim()); if (!k) return;
    el.dataset.edk = k; el.dataset.edh = el.children.length ? '1' : '';
    el.dataset.ph = tPadrao(k).replace(/<[^>]+>/g, '');
    if (S.edPend.has(k)) { const v = S.edPend.get(k); if (el.dataset.edh) el.innerHTML = v; else el.textContent = v; el.classList.add('mt-ed-mod'); }
    el.contentEditable = 'true'; el.spellcheck = false; el.classList.add('mt-ed');
  });
}
function desmarcarEditaveis() {
  $$('[data-edk]').forEach(el => { el.removeAttribute('contenteditable'); el.classList.remove('mt-ed', 'mt-ed-mod'); delete el.dataset.edk; delete el.dataset.edh; });
}
function barraEdicao() {
  const bar = $('#mt-edbar'); if (!bar) return;
  bar.classList.toggle('mt-hidden', !S.admin); document.body.classList.toggle('mt-tem-edbar', !!S.admin);
  const bt = $('#ed-botao'), cc = $('#ed-cancelar'), hint = $('#ed-hint'), n = S.edPend.size;
  cc.textContent = t('Cancelar');
  if (S.editando) {
    bt.textContent = n ? t('Salvar textos ({n})', { n }) : t('Concluir edição');
    hint.textContent = t('Clique em um texto com contorno tracejado para alterá-lo. Apague tudo para voltar ao texto original.');
  } else {
    bt.textContent = '✎ ' + t('Editar');
    const u = S.txtUlt;
    bt.title = u ? t('Última edição de textos: {d} por {p}', { d: new Date(u.atualizado_em).toLocaleString(LOC()), p: u.atualizado_por || '—' }) : t('Editar os textos desta tela');
  }
  cc.classList.toggle('mt-hidden', !S.editando); hint.classList.toggle('mt-hidden', !S.editando);
}
function entrarEdicao() {
  S.editando = true; S.edPend = new Map(); document.body.classList.add('mt-editando');
  marcarEditaveis();
  edObs = new MutationObserver(() => { clearTimeout(edObs._t); edObs._t = setTimeout(marcarEditaveis, 60); });
  edObs.observe($('.fi-page'), { childList: true, subtree: true });
  barraEdicao();
}
function sairEdicao() {
  S.editando = false; S.edPend = new Map(); document.body.classList.remove('mt-editando');
  if (edObs) { edObs.disconnect(); edObs = null; }
  desmarcarEditaveis(); barraEdicao();
}
async function salvarTextos() {
  if (!S.edPend.size) { sairEdicao(); return; }
  const ups = [], dels = [], agora = new Date().toISOString();
  S.edPend.forEach((v, k) => { if (!v || v === tPadrao(k)) dels.push(k); else ups.push({ lang: LANG, chave: k, texto: v, atualizado_em: agora, atualizado_por: S.nome || S.email }); });
  const bt = $('#ed-botao'); bt.disabled = true;
  try {
    if (ups.length) await q(S.sb.from('met_textos').upsert(ups));
    for (const k of dels) await q(S.sb.from('met_textos').delete().eq('lang', LANG).eq('chave', k));
    ups.forEach(r => { TXT[LANG + '|' + r.chave] = r.texto; }); dels.forEach(k => { delete TXT[LANG + '|' + k]; });
    if (ups.length) S.txtUlt = ups[0];
    const n = ups.length + dels.length;
    sairEdicao(); aplicarIdioma(); rota();
    notify(t('Textos salvos ({n})', { n }), 'success');
  } catch (e) { notify(erroMsg(e), 'danger'); } finally { bt.disabled = false; }
}
document.addEventListener('input', e => {
  const el = e.target.closest && e.target.closest('[data-edk]'); if (!el || !S.editando) return;
  S.edPend.set(el.dataset.edk, valorEd(el)); el.classList.add('mt-ed-mod');
  $$('[data-edk]').forEach(o => { if (o !== el && o.dataset.edk === el.dataset.edk) { if (o.dataset.edh) o.innerHTML = el.innerHTML; else o.textContent = el.textContent; } });
  barraEdicao();
});
document.addEventListener('keydown', e => { if (S.editando && e.key === 'Enter' && e.target.closest && e.target.closest('[data-edk]')) { e.preventDefault(); e.target.blur(); } });
document.addEventListener('paste', e => {
  const el = e.target.closest && e.target.closest('[data-edk]'); if (!el) return;
  e.preventDefault(); document.execCommand('insertText', false, (e.clipboardData || window.clipboardData).getData('text/plain').replace(/\s+/g, ' '));
});
document.addEventListener('click', e => { if (S.editando && e.target.closest && e.target.closest('[data-edk]')) { e.stopPropagation(); e.preventDefault(); } }, true);
$('#ed-botao').addEventListener('click', () => S.editando ? salvarTextos() : entrarEdicao());
$('#ed-cancelar').addEventListener('click', () => { const tinha = S.edPend.size; sairEdicao(); if (tinha) rota(); });
window.addEventListener('beforeunload', e => { if (S.editando && S.edPend.size) { e.preventDefault(); e.returnValue = ''; } });

$$('[data-lang]').forEach(b => b.addEventListener('click', () => trocarIdioma(b.dataset.lang)));
aplicarIdioma();
async function iniciar() {
  try {
    const app = await window.APP.pronto;
    S.sb = app.sb; S.perm = app.permissao; S.admin = app.permissao === 'admin';
    S.veTudo = S.admin || app.permissao === 'editar';
    S.email = String(app.usuario.email || '').toLowerCase(); S.nome = app.usuario.nome || '';
    await carregar();
    aplicarIdioma(); aplicarVisibilidade(); barraEdicao();
    window.addEventListener('hashchange', () => { $('#modal-root').innerHTML = ''; rota(); });
    rota();
  } catch (e) {
    if (typeof e === 'string') return;
    console.error(e);
    $('#view').innerHTML = `<div class="fi-alert fi-alert--danger">${esc(t('Não foi possível carregar os dados: {e}', { e: erroMsg(e) }))}</div>`;
  }
}
if (window.APP && window.APP.pronto) iniciar();
else document.addEventListener('DOMContentLoaded', () => window.APP && window.APP.pronto ? iniciar() : ($('#view').innerHTML = `<div class="fi-alert fi-alert--danger">${t('Login da Central de Acesso não carregou.')}</div>`));
})();
</script>
