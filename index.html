/* ======================= MOTOR DE CÁLCULO ======================= */
/* Regras:
   - Meta em branco (nula) = ainda não lançada. A meta do trimestre só existe quando os 3 meses têm meta;
     a meta do ano só existe quando os 12 meses têm meta. Antes disso: "Aguardando dados".
   - Prêmio do mês = prêmio-base × multiplicador da faixa (padrão ≥90% 0,5× · ≥100% 1× · ≥105% 2×).
   - Recuperação trimestral (mar/jun/set/dez): o atingimento do trimestre (realizado ÷ meta do trimestre) é enquadrado
     nas mesmas faixas (90% / 100% / 105% ou as cadastradas). Cada mês do trimestre passa a ter direito a
     prêmio-base × faixa do trimestre; paga-se só a diferença sobre o que o mês já recebeu (nunca negativo,
     nada é estornado).
   - Recuperação anual (dez): mesma lógica com o atingimento do ano, descontando o já pago no mês e na
     recuperação trimestral. */
function faixasOrd(tb) {
  return ((tb && tb.faixas) || []).map(f => ({ min: Number(f.min), mult: Number(f.mult) }))
    .filter(f => isFinite(f.min) && isFinite(f.mult)).sort((a, b) => a.min - b.min);
}
function multDe(tb, ating) {
  if (ating == null || !isFinite(ating)) return 0;
  let m = 0;
  for (const f of faixasOrd(tb)) if (ating * 100 >= f.min - 1e-9) m = f.mult;
  return m;
}
function somaMetas(metas, de, ate) {          // soma de/ate (1..12); null se faltar algum mês
  let s = 0;
  for (let i = de; i <= ate; i++) { const v = valorMeta(metas && metas[i - 1]); if (v == null) return null; s += v; }
  return s;
}
function calcular(tb, metas, premios, real, ate) {
  const meses = [];
  for (let i = 0; i < 12; i++) {
    const meta = valorMeta(metas && metas[i]), base = Number(premios && premios[i]) || 0;
    const r = real[i] == null ? null : Number(real[i]);
    const apurado = i + 1 <= ate && r != null && meta != null;
    const ating = meta != null && meta > 0 && r != null ? r / meta : null;
    const mult = apurado ? multDe(tb, ating) : 0;
    meses.push({ mes: i + 1, meta, base, real: r, apurado, ating, mult, premio: base * mult,
                 recTri: 0, recAno: 0, pagoTri: 0, pagoAno: 0, total: 0 });
  }
  const tri = [];
  for (let qd = 0; qd < 4; qd++) {
    const ms = meses.slice(qd * 3, qd * 3 + 3), fim = qd * 3 + 3;
    const metaQ = somaMetas(metas, qd * 3 + 1, fim);
    const realCompleto = ms.every(m => m.real != null);
    const realQ = sum(ms.map(m => m.real || 0));
    const atingQ = metaQ != null && metaQ > 0 && realCompleto ? realQ / metaQ : null;
    const apurado = ate >= fim && realCompleto && metaQ != null;
    // faixa atingida no trimestre: cada mês passa a valer prêmio-base × essa faixa, descontado o que já recebeu
    const multQ = (tb && tb.recup_tri) && apurado ? multDe(tb, atingQ) : 0;
    if (multQ > 0) ms.forEach(m => { m.recTri = Math.max(0, m.base * multQ - m.premio); });
    const valor = sum(ms.map(m => m.recTri));
    meses[fim - 1].pagoTri = valor;
    tri.push({ q: qd + 1, metaQ, realQ: realCompleto ? realQ : null, realParcial: realQ, atingQ, apurado, multQ, recuperou: multQ > 0, valor, premio: sum(ms.map(m => m.premio)) });
  }
  const metaA = somaMetas(metas, 1, 12);
  const realCompA = meses.every(m => m.real != null);
  const realA = sum(meses.map(m => m.real || 0));
  const atingA = metaA != null && metaA > 0 && realCompA ? realA / metaA : null;
  const anoApurado = ate >= 12 && realCompA && metaA != null;
  const multA = (tb && tb.recup_anual) && anoApurado ? multDe(tb, atingA) : 0;
  const recA = multA > 0;
  if (recA) meses.forEach(m => { m.recAno = Math.max(0, m.base * multA - m.premio - m.recTri); });
  meses[11].pagoAno = sum(meses.map(m => m.recAno));
  meses.forEach(m => { m.total = m.premio + m.pagoTri + m.pagoAno; });
  const noAcum = m => m.meta != null && (m.mes < ate || (m.mes === ate && m.real != null));
  const realAte = sum(meses.filter(noAcum).map(m => m.real || 0));
  const metaAte = sum(meses.filter(noAcum).map(m => m.meta));
  return {
    meses, tri,
    ano: { metaA, realA: realCompA ? realA : null, realParcial: realA, atingA, apurado: anoApurado, multA, recuperou: recA, valor: meses[11].pagoAno },
    ate, metaAte, realAte, atingAte: metaAte > 0 ? realAte / metaAte : null,
    totalAte: sum(meses.filter(m => m.mes <= ate).map(m => m.total)),
    premioBaseAno: sum(meses.map(m => m.base))
  };
}

}

/* ------------------------- acesso aos dados ------------------------- */
function realDe(moduloId, vendedorId) {
  const arr = Array(12).fill(null);
  S.realizado.forEach(r => { if (r.modulo_id === moduloId && r.vendedor_id === vendedorId) arr[r.mes - 1] = Number(r.valor); });
  return arr;
}
function fechadosDe(moduloId) { const s = new Set(); S.fechamentos.forEach(f => { if (f.modulo_id === moduloId) s.add(f.mes); }); return s; }
function ultimoFechado(moduloId) { let u = 0; fechadosDe(moduloId).forEach(m => { if (m > u) u = m; }); return u; }
const ehSup = m => !!m && m.tipo === 'supervisao';
const tipoBadge = m => ehSup(m) ? `<span class="fi-badge fi-badge--info">${t('Meta de supervisão')}</span>` : `<span class="fi-badge">${t('Meta de vendedor')}</span>`;
function vincDe(moduloId) {
  const mod = byId(S.modulos, moduloId);
  const lista = S.mv.filter(x => x.modulo_id === moduloId)
    .map(x => ({ ...x, equipe: x.equipe || [], metas: (x.metas || Array(12).fill(null)).map(valorMeta), premios: (x.premios || Array(12).fill(0)), v: byId(S.vendedores, x.vendedor_id) }))
    .filter(x => x.v)
    .sort((a, b) => a.v.nome.localeCompare(b.v.nome, 'pt-BR'));
  if (ehSup(mod)) lista.forEach(x => Object.assign(x, consolidar(mod, x)));
  return lista;
}
/* Supervisão: meta e realizado de cada mês = soma da equipe no módulo base de vendedores.
   Mês com meta ou realizado faltando em algum vendedor da equipe fica nulo ("Aguardando dados"). */
function consolidar(mod, x) {
  const base = byId(S.modulos, mod.base_modulo_id);
  const eq = base && !ehSup(base) ? vincDe(base.id).filter(z => x.equipe.includes(z.vendedor_id)) : [];
  const metas = [], real = [];
  for (let i = 0; i < 12; i++) {
    if (!eq.length) { metas.push(null); real.push(null); continue; }
    const ms = eq.map(z => z.metas[i]);
    metas.push(ms.some(v => v == null) ? null : sum(ms));
    const rs = eq.map(z => realDe(base.id, z.vendedor_id)[i]);
    real.push(rs.some(v => v == null) ? null : sum(rs));
  }
  return { metas, realSup: real, equipeV: eq, baseMod: base };
}
function realPart(m, x) { return ehSup(m) ? (x.realSup || Array(12).fill(null)) : realDe(m.id, x.vendedor_id); }

async function carregar() {
  const sb = S.sb;
  const [reg, ven, tab, mod, mv, rea, fec] = await Promise.all([

    q(sb.from('met_modulos').select('*').order('ano', { ascending: false }).order('nome')),

  Object.assign(S, { regioes: reg || [], vendedores: ven || [], tabelas: tab || [], modulos: mod || [],

function modal({ titulo, corpo, botoes, largura }) {
  const el = document.createElement('div');
  el.className = 'mt-modal';
  el.innerHTML = `<section class="mt-modal__panel" role="dialog" aria-modal="true" style="${largura ? 'width:min(' + largura + 'px,100%)' : ''}">
    <div class="mt-modal__head"><span>${esc(titulo)}</span><span class="mt-sp"></span>
      <button class="fi-icon-btn" data-x aria-label="${t('Fechar')}">✕</button></div>
    <div class="mt-modal__body">${corpo}</div>
    <div class="mt-modal__foot"></div></section>`;
  const foot = $('.mt-modal__foot', el);
  const fechar = () => el.remove();
  (botoes || []).forEach(b => {
    const bt = document.createElement('button');
    bt.className = 'fi-btn' + (b.primario ? ' fi-btn--primary' : '') + (b.perigo ? ' fi-btn--danger' : '');
    bt.textContent = b.texto;
    if (b.esquerda) bt.style.marginRight = 'auto';
    bt.addEventListener('click', async () => {
      if (!b.acao) return fechar();
      bt.disabled = true;
      try { const r = await b.acao(el); if (r !== false) fechar(); }
      catch (e) { notify(erroMsg(e), 'danger'); }
      finally { bt.disabled = false; }
    });
    foot.appendChild(bt);
  });
  $('[data-x]', el).addEventListener('click', fechar);
  el.addEventListener('keydown', e => { if (e.key === 'Escape') fechar(); });
  $('#modal-root').appendChild(el);
  const f = $('input,select,textarea', el); if (f) f.focus();
  return el;
}

      const vinc = vincDe(m.id).filter(x => S.veTudo || x.v.email === S.email);
      const ate = Math.max(ultimoFechado(m.id), mesPadrao(m.ano));
      let meta = 0, real = 0, premio = 0;
      vinc.forEach(x => { const c = calcVinc(m, x, ate); meta += c.metaAte; real += c.realAte; premio += c.totalAte; });
      const at = meta > 0 ? real / meta : null;
      const tb = byId(S.tabelas, m.tabela_id), reg = byId(S.regioes, m.regiao_id), fech = ultimoFechado(m.id);
      html += `<article class="fi-card mt-modcard" data-mod="${m.id}" tabindex="0">
        <div class="fi-card__head"><div><div class="fi-card__title">${esc(m.nome)}</div>
          <div class="fi-card__note">${esc(tb ? tb.nome : '—')}${reg ? ' · ' + esc(reg.nome) : ''}</div><div style="margin-top:6px">${tipoBadge(m)}</div></div>
          <div class="mt-row">${S.veTudo ? (m.visivel ? `<span class="fi-badge fi-badge--success">${t('Liberado')}</span>` : `<span class="fi-badge">${t('Oculto')}</span>`) : ''}
          ${!m.ativo ? `<span class="fi-badge fi-badge--warning">${t('Inativo')}</span>` : ''}</div></div>
        <div class="fi-card__body">
          <div class="mt-kv">
            <div><span>${t('Meta até {m}', { m: MES(ate - 1) })}</span><b>${meta ? brl0(meta) : WAIT()}</b></div>
            <div><span>${t('Realizado')}</span><b>${brl0(real)}</b></div>
            <div><span>${t('Atingido')}</span><b>${pct(at)}</b></div>
          </div>
          <div class="mt-bar" title="${t('Atingimento acumulado')}"><span style="width:${Math.min(100, (at || 0) / 1.1 * 100)}%"></span><i style="left:${90 / 1.1}%"></i><i style="left:${100 / 1.1}%"></i></div>
          <div class="mt-row mt-small mt-muted"><span>${t(vinc.length === 1 ? '{n} vendedor' : '{n} vendedores', { n: vinc.length })}</span><span class="mt-sp"></span>
            <span>${t('Premiação acumulada')} <b class="mt-strong" style="color:var(--fi-text)">${brl(premio)}</b></span></div>
          <div class="mt-small mt-muted">${fech ? t('Fechado até {m}', { m: MESL(fech - 1) }) : t('Nenhum mês fechado')}</div>
        </div></article>`;
    });
    html += `</div>`;
  });
  $('#view').innerHTML = html;
  $$('[data-mod]').forEach(c => {
    const go = () => { location.hash = '#/modulo/' + c.dataset.mod; };
    c.addEventListener('click', go);
    c.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  });
}

/* ========================== DETALHE DO MÓDULO ========================== */
function vModulo(id, mesSel, regSel) {
  const m = byId(S.modulos, id);
  if (!m) { location.hash = '#/inicio'; return; }
  const tb = byId(S.tabelas, m.tabela_id), fech = fechadosDe(m.id);
  const mes = mesSel || Math.max(ultimoFechado(m.id), mesPadrao(m.ano));
  let vinc = vincDe(m.id).filter(x => S.veTudo || x.v.email === S.email);
  if (regSel) vinc = vinc.filter(x => x.v.regiao_id === regSel);
  setHead(m.ano + ' · ' + (ehSup(m) ? t('Meta de supervisão') : t('Meta de vendedor')) + (byId(S.regioes, m.regiao_id) ? ' · ' + byId(S.regioes, m.regiao_id).nome : ''), m.nome,
    (tb ? tb.nome : '') + (m.descricao ? ' — ' + m.descricao : ''),
    `<button class="fi-btn" id="bt-voltar">${t('← Módulos')}</button>
     <button class="fi-btn" id="bt-xls">${t('Exportar Excel')}</button>
     ${S.admin ? `<button class="fi-btn fi-btn--primary" id="bt-fechar">${t('Fechamento')}</button>` : ''}`);

  const linhas = vinc.map(x => ({ x, c: calcVinc(m, x, mes) }));
  const tot = { meta: 0, metaOk: true, real: 0, premio: 0, rec: 0, total: 0, metaAte: 0, realAte: 0, totalAte: 0 };
  linhas.forEach(({ c }) => {
    const mm = c.meses[mes - 1];
    if (mm.meta == null) tot.metaOk = false; else tot.meta += mm.meta;
    tot.real += mm.real || 0; tot.premio += mm.premio; tot.rec += mm.pagoTri + mm.pagoAno; tot.total += mm.total;
    tot.metaAte += c.metaAte; tot.realAte += c.realAte; tot.totalAte += c.totalAte;
  });
  const metaMes = tot.metaOk && linhas.length ? tot.meta : null;
  const regsDoMod = [...new Set(vincDe(m.id).map(x => x.v.regiao_id).filter(Boolean))];
  const mesesOpt = Array.from({ length: 12 }, (_, i) => `<option value="${i + 1}" ${i + 1 === mes ? 'selected' : ''}>${MESL(i)}${fech.has(i + 1) ? ' · ' + t('fechado') : ''}</option>`).join('');

  let html = `
  <div class="fi-card mt-noprint"><div class="fi-card__body fi-filters">
    <label class="fi-field"><span class="fi-label">${t('Mês de referência')}</span><select class="fi-select" id="f-mes">${mesesOpt}</select></label>
    ${S.veTudo && regsDoMod.length > 1 ? `<label class="fi-field"><span class="fi-label">${t('Região')}</span><select class="fi-select" id="f-reg">
      <option value="">${t('Todas')}</option>${regsDoMod.map(r => `<option value="${r}" ${r === regSel ? 'selected' : ''}>${esc((byId(S.regioes, r) || {}).nome)}</option>`).join('')}</select></label>` : ''}
    <div class="mt-sp"></div>
    <div class="mt-small mt-muted">${fech.has(mes) ? t('🔒 Mês fechado — valores congelados') : t('Mês aberto — valores ainda podem mudar')}</div>
  </div></div>

  <div class="fi-grid fi-grid--4 mt-mt">
    <div class="fi-card fi-metric fi-metric--brand"><div class="fi-metric__top"><span>${t('Meta {m}', { m: MES(mes - 1) })}</span></div><div class="fi-metric__value">${metaMes == null ? WAIT() : brl0(metaMes)}</div><div class="fi-metric__foot">${t('Realizado {v}', { v: brl0(tot.real) })}</div></div>
    <div class="fi-card fi-metric"><div class="fi-metric__top"><span>${t('Atingido no mês')}</span></div><div class="fi-metric__value">${pct(metaMes ? tot.real / metaMes : null)}</div><div class="fi-progress"><span style="width:${Math.min(100, metaMes ? tot.real / metaMes * 100 : 0)}%"></span></div></div>
    <div class="fi-card fi-metric"><div class="fi-metric__top"><span>${t('Acumulado até {m}', { m: MES(mes - 1) })}</span></div><div class="fi-metric__value">${pct(tot.metaAte ? tot.realAte / tot.metaAte : null)}</div><div class="fi-metric__foot">${t('{a} de {b}', { a: brl0(tot.realAte), b: brl0(tot.metaAte) })}</div></div>
    <div class="fi-card fi-metric"><div class="fi-metric__top"><span>${t('Premiação do mês')}</span></div><div class="fi-metric__value">${brl0(tot.total)}</div><div class="fi-metric__foot">${t('acumulado {v}', { v: brl0(tot.totalAte) })}</div></div>
  </div>`;

  html += `<section class="fi-card mt-mt2"><div class="fi-card__head"><div><div class="fi-card__title">${t('Vendedores — {m}/{a}', { m: MESL(mes - 1), a: m.ano })}</div>
    <div class="fi-card__note">${t('Prêmio = prêmio-base × % da faixa. Recuperações são pagas no fechamento de Mar/Jun/Set/Dez (trimestre) e Dez (ano).')}</div></div></div>
    <div class="fi-table-wrap" style="border:0;border-radius:0"><table class="fi-table" id="tb-mod"><thead><tr>
      <th>${ehSup(m) ? t('Supervisor') : t('Vendedor')}</th><th>${t('Região')}</th><th class="mt-num">${t('Meta')}</th><th class="mt-num">${t('Realizado')}</th><th class="mt-num">${t('Atingido')}</th><th>${t('Faixa')}</th>
      <th class="mt-num">${t('Prêmio-base')}</th><th class="mt-num">${t('Prêmio mês')}</th><th class="mt-num">${t('Recuperação')}</th><th class="mt-num">${t('Total mês')}</th>
      <th class="mt-num">${t('Acum. %')}</th><th class="mt-num">${t('Acum. prêmio')}</th><th class="mt-num">${t('Comissão equiv.')}</th></tr></thead><tbody>`;
  if (!linhas.length) html += `<tr><td colspan="13"><div class="fi-empty">${regSel ? t('Nenhum vendedor atrelado nesta região.') : t('Nenhum vendedor atrelado.')}</div></td></tr>`;
  linhas.forEach(({ x, c }) => {
    const mm = c.meses[mes - 1];
    const eq = mm.real && mm.total ? mm.total / mm.real : null;
    html += `<tr data-vend="${x.vendedor_id}" style="cursor:pointer">
      <td class="mt-strong">${esc(x.v.nome)}</td><td>${esc((byId(S.regioes, x.v.regiao_id) || {}).nome || '—')}</td>
      <td class="mt-num">${brlOuWait(mm.meta)}</td><td class="mt-num">${mm.real == null ? '<span class="mt-muted">—</span>' : brl(mm.real)}</td>
      <td class="mt-num">${pct(mm.ating)}</td><td><span class="mt-pill ${classeMult(mm.mult)}">${mm.apurado ? multTxt(mm.mult) : '—'}</span></td>
      <td class="mt-num">${brl(mm.base)}</td><td class="mt-num">${brl(mm.premio)}</td>
      <td class="mt-num ${mm.pagoTri + mm.pagoAno ? 'mt-pos mt-strong' : ''}">${brl(mm.pagoTri + mm.pagoAno)}</td>
      <td class="mt-num mt-strong">${brl(mm.total)}</td>
      <td class="mt-num">${pct(c.atingAte)}</td><td class="mt-num">${brl(c.totalAte)}</td>
      <td class="mt-num">${pct(eq, 2)}</td></tr>`;
  });
  html += `</tbody>${linhas.length > 1 ? `<tfoot><tr><td colspan="2">${t('Total')}</td><td class="mt-num">${brlOuWait(metaMes)}</td><td class="mt-num">${brl(tot.real)}</td>
    <td class="mt-num">${pct(metaMes ? tot.real / metaMes : null)}</td><td></td><td></td><td class="mt-num">${brl(tot.premio)}</td>
    <td class="mt-num">${brl(tot.rec)}</td><td class="mt-num">${brl(tot.total)}</td><td class="mt-num">${pct(tot.metaAte ? tot.realAte / tot.metaAte : null)}</td>
    <td class="mt-num">${brl(tot.totalAte)}</td><td></td></tr></tfoot>` : ''}</table></div>
    <div class="fi-card__foot">${t('Clique num vendedor para ver os 12 meses, os trimestres e a faixa de comissão equivalente.')}</div></section>`;

  html += regraHtml(tb);
  $('#view').innerHTML = html;

  $('#f-mes').addEventListener('change', e => vModulo(id, Number(e.target.value), regSel));
  const fr = $('#f-reg'); if (fr) fr.addEventListener('change', e => vModulo(id, mes, e.target.value || null));
  $('#bt-voltar').addEventListener('click', () => { location.hash = '#/inicio'; });
  $('#bt-xls').addEventListener('click', () => exportarModulo(m, mes, linhas));
  const bf = $('#bt-fechar'); if (bf) bf.addEventListener('click', () => { S.fechModulo = m.id; S.fechMes = mes; location.hash = '#/adm/fechamento'; });
  $$('#tb-mod tr[data-vend]').forEach(tr => tr.addEventListener('click', () => {
    modalVendedorAno(m, vincDe(m.id).find(v => v.vendedor_id === tr.dataset.vend), mes);
  }));
}

function multPct(x) { return multTxt(x.mult); }
function regraHtml(tb) {
  if (!tb) return '';
  const f = faixasOrd(tb);
  return `<section class="fi-card mt-mt2"><div class="fi-card__head"><div class="fi-card__title">${esc(t('Regras da tabela “{n}”', { n: tb.nome }))}</div></div>
    <div class="fi-card__body"><div class="mt-rule">
    ${f.map(x => `<div>${t('Atingiu {p} ou mais da meta do mês → recebe {m} do prêmio-base.', { p: '<b>' + num(x.min, x.min % 1 ? 1 : 0) + '%</b>', m: '<b>' + multPct(x) + '</b>' })}</div>`).join('')}
    <div>${t('Abaixo de {p} → sem premiação no mês.', { p: f.length ? num(f[0].min, 0) + '%' : '—' })}</div>
    ${tb.recup_tri ? `<div><b>${t('Recuperação trimestral:')}</b> ${t('o atingimento do trimestre (realizado ÷ meta do trimestre) é enquadrado nas mesmas faixas. Cada mês do trimestre passa a ter direito a prêmio-base × faixa do trimestre, e é paga só a diferença sobre o que o mês já recebeu (pago no fechamento do último mês do trimestre).')}</div>` : ''}
    ${tb.recup_anual ? `<div><b>${t('Recuperação anual:')}</b> ${t('mesma lógica com o atingimento do ano — cada mês recebe a diferença entre prêmio-base × faixa do ano e o que já recebeu, inclusive na recuperação trimestral (pago no fechamento de dezembro).')}</div>` : ''}
    ${tb.observacao ? `<div class="mt-muted">${esc(tb.observacao)}</div>` : ''}
    </div></div></section>`;
}

function statusTri(tq, html) {
  const sp = (cls, txt) => html ? `<span class="${cls}">${esc(txt)}</span>` : txt;
  if (tq.metaQ == null || tq.realQ == null) return html ? WAIT() : t('Aguardando dados');
  if (!tq.apurado) return sp('mt-muted', t('trimestre em andamento'));
  if (tq.recuperou) return sp('mt-pos', tq.valor ? t('Faixa do trimestre {f} — recuperou {v}', { f: multTxt(tq.multQ), v: brl(tq.valor) }) : t('Faixa do trimestre {f} (nada a recuperar)', { f: multTxt(tq.multQ) }));
  return sp('mt-muted', t('Não bateu a meta do trimestre'));
}
function tabelaAnoHtml(m, x, c) {
  const fech = fechadosDe(m.id);
  let h = `<div class="fi-table-wrap"><table class="fi-table"><thead><tr><th>${t('Mês')}</th><th class="mt-num">${t('Meta')}</th><th class="mt-num">${t('Realizado')}</th>
    <th class="mt-num">${t('Atingido')}</th><th>${t('Faixa')}</th><th class="mt-num">${t('Prêmio-base')}</th><th class="mt-num">${t('Prêmio')}</th>
    <th class="mt-num">${t('Rec. trimestre')}</th><th class="mt-num">${t('Rec. ano')}</th><th class="mt-num">${t('Total pago')}</th></tr></thead><tbody>`;
  c.meses.forEach(mm => {
    h += `<tr><td>${MES(mm.mes - 1)}${fech.has(mm.mes) ? `<span class="mt-lock" title="${t('Mês fechado')}">🔒</span>` : ''}</td>
      <td class="mt-num">${brlOuWait(mm.meta)}</td><td class="mt-num">${mm.real == null ? '<span class="mt-muted">—</span>' : brl(mm.real)}</td>
      <td class="mt-num">${pct(mm.ating)}</td><td><span class="mt-pill ${classeMult(mm.mult)}">${mm.apurado ? multTxt(mm.mult) : '—'}</span>${mm.recTri ? ` <span class="mt-small mt-pos" title="${t('Recuperado no trimestre')}">↺T</span>` : ''}${mm.recAno ? ` <span class="mt-small mt-pos" title="${t('Recuperado no ano')}">↺A</span>` : ''}</td>
      <td class="mt-num">${brl(mm.base)}</td><td class="mt-num">${brl(mm.premio)}</td>
      <td class="mt-num">${mm.pagoTri ? brl(mm.pagoTri) : ''}</td><td class="mt-num">${mm.pagoAno ? brl(mm.pagoAno) : ''}</td>
      <td class="mt-num mt-strong">${brl(mm.total)}</td></tr>`;
    if (mm.mes % 3 === 0) {
      const tq = c.tri[mm.mes / 3 - 1];
      const totQ = sum(c.meses.slice(mm.mes - 3, mm.mes).map(z => z.total));
      h += `<tr class="mt-sub"><td>${t('{q}º trimestre', { q: tq.q })}</td><td class="mt-num">${brlOuWait(tq.metaQ)}</td><td class="mt-num">${brlOuWait(tq.realQ)}</td>
        <td class="mt-num">${tq.atingQ == null ? WAIT() : pct(tq.atingQ)}</td>
        <td>${tq.recuperou ? `<span class="mt-pill ${classeMult(tq.multQ)}">${multTxt(tq.multQ)}</span>` : ''}</td>
        <td colspan="2">${statusTri(tq, true)}</td>
        <td class="mt-num ${tq.valor ? 'mt-pos' : ''}">${tq.valor ? brl(tq.valor) : ''}</td><td></td><td class="mt-num">${brl(totQ)}</td></tr>`;
    }
  });
  h += `</tbody><tfoot><tr><td>${t('Ano')}</td><td class="mt-num">${brlOuWait(c.ano.metaA)}</td><td class="mt-num">${brlOuWait(c.ano.realA)}</td><td class="mt-num">${c.ano.atingA == null ? WAIT() : pct(c.ano.atingA)}</td>
    <td colspan="2">${c.ano.metaA == null || c.ano.realA == null ? WAIT() : c.ano.apurado ? (c.ano.recuperou ? `<span class="mt-pos">${t('Faixa do ano {f}', { f: multTxt(c.ano.multA) })}</span>` : t('Não bateu o ano')) : `<span class="mt-muted">${t('ano em andamento')}</span>`}</td>
    <td class="mt-num">${brl(sum(c.meses.map(z => z.premio)))}</td><td class="mt-num">${brl(sum(c.tri.map(z => z.valor)))}</td>
    <td class="mt-num">${brl(c.ano.valor)}</td><td class="mt-num">${brl(sum(c.meses.map(z => z.total)))}</td></tr></tfoot></table></div>`;
  return h;
}
function comissaoHtml(m, x, mes) {
  const tb = byId(S.tabelas, m.tabela_id);
  const meta = x.metas[mes - 1], base = Number(x.premios[mes - 1]) || 0;
  if (meta == null) return `<div class="fi-alert fi-alert--info">${t('Meta do mês não lançada')} — ${WAIT()}</div>`;
  const r = realPart(m, x)[mes - 1] || 0;
  return `<div class="mt-falta">${comissaoEquiv(tb, meta, base).map(e => `<div><span>${t('{p} da meta · paga {m}', { p: num(e.min, 0) + '%', m: multTxt(e.mult) })}</span>
      <b>${brl0(e.venda)}</b><div class="mt-small mt-muted">${t('prêmio {v} · comissão equiv. {p}', { v: brl(e.premio), p: '<b>' + pct(e.pct, 2) + '</b>' })}</div>
      ${r < e.venda ? `<div class="mt-small mt-warn">${t('faltam {v}', { v: brl0(e.venda - r) })}</div>` : `<div class="mt-small mt-pos">${t('✓ atingido')}</div>`}</div>`).join('')}</div>`;
}
/* Supervisão: desempenho de cada vendedor da equipe no mês */
function equipeHtml(m, x, mes) {
  if (!ehSup(m) || !x.baseMod) return '';
  const linhas = (x.equipeV || []).map(z => {
    const meta = z.metas[mes - 1], real = realDe(x.baseMod.id, z.vendedor_id)[mes - 1];
    const acM = sum(z.metas.slice(0, mes).map(v => v || 0)), acR = sum(realDe(x.baseMod.id, z.vendedor_id).slice(0, mes).map(v => v || 0));
    return `<tr><td class="mt-strong">${esc(z.v.nome)}</td><td class="mt-num">${brlOuWait(meta)}</td><td class="mt-num">${real == null ? '<span class="mt-muted">—</span>' : brl(real)}</td>
      <td class="mt-num">${meta && real != null ? pct(real / meta) : '—'}</td><td class="mt-num">${acM ? pct(acR / acM) : '—'}</td></tr>`;
  }).join('');
  return `<div class="fi-eyebrow mt-mt2">${t('Equipe em {m}', { m: MESL(mes - 1) })}</div>
    <div class="fi-table-wrap"><table class="fi-table"><thead><tr><th>${t('Vendedor')}</th><th class="mt-num">${t('Meta')}</th><th class="mt-num">${t('Realizado')}</th><th class="mt-num">${t('Atingido')}</th><th class="mt-num">${t('Acum. %')}</th></tr></thead>
    <tbody>${linhas || `<tr><td colspan="5"><div class="fi-empty">${t('Nenhum vendedor na equipe.')}</div></td></tr>`}</tbody></table></div>`;
}
function modalVendedorAno(m, x, mes) {
  const c = calcVinc(m, x, Math.max(mes, ultimoFechado(m.id)));
  modal({ titulo: x.v.nome + ' — ' + m.nome, largura: 1040,
    corpo: `<div class="mt-small mt-muted">${t('Faixas de {m}: venda necessária, prêmio e o percentual de comissão que ele representa.', { m: MESL(mes - 1) })}</div>
      ${comissaoHtml(m, x, mes)}${tabelaAnoHtml(m, x, c)}${equipeHtml(m, x, mes)}`,
    botoes: [{ texto: t('Baixar PDF'), esquerda: true, acao: () => { pdfVendedor(m, x, Math.max(mes, ultimoFechado(m.id))); return false; } }, { texto: t('Fechar'), primario: true }] });
}

/* ============================== MEU PAINEL ============================== */
function vPainel() {
  const meus = meusVendedores();
  setHead(t('Meu painel'), S.nome || t('Meu painel'), t('Suas metas, atingimento e premiação. Você vê apenas os seus dados.'));
  if (!meus.length) {
    $('#view').innerHTML = `<div class="fi-card"><div class="fi-empty"><div><strong>${t('Seu e-mail não está cadastrado como vendedor.')}</strong>
      <p class="mt-small">${esc(t('Conta: {e}.', { e: S.email }))} ${S.admin ? t('Cadastre-se em Administração › Vendedores se também tiver metas.') : t('Peça à gestão comercial para cadastrá-lo com este e-mail.')}</p></div></div></div>`;
    return;
  }
  const ids = new Set(meus.map(v => v.id));
  const mods = S.modulos.filter(m => (m.visivel && m.ativo) || S.veTudo).filter(m => S.mv.some(x => x.modulo_id === m.id && ids.has(x.vendedor_id)));
  if (!mods.length) { $('#view').innerHTML = `<div class="fi-card"><div class="fi-empty"><div><strong>${t('Nenhum módulo de metas liberado para você ainda.')}</strong></div></div></div>`; return; }
  let html = '';
  mods.forEach(m => {
    const x = vincDe(m.id).find(z => ids.has(z.vendedor_id));
    const mes = Math.max(ultimoFechado(m.id), mesPadrao(m.ano));
    const c = calcVinc(m, x, mes), mm = c.meses[mes - 1];
    html += `<section class="fi-card mt-mt2"><div class="fi-card__head"><div><div class="fi-card__title">${esc(m.nome)}${String(m.nome).includes(String(m.ano)) ? '' : ' · ' + m.ano}</div>
      <div class="fi-card__note">${esc((byId(S.tabelas, m.tabela_id) || {}).nome || '')}</div></div>
      <button class="fi-btn mt-noprint" data-pdfv="${m.id}|${x.vendedor_id}|${mes}">${t('Baixar PDF')}</button></div>
      <div class="fi-card__body">

  tb = tb || { nome: '', tipo: 'ambos', faixas: [{ min: 90, mult: 0.5 }, { min: 100, mult: 1 }, { min: 105, mult: 2 }], recup_tri: true, recup_anual: true, observacao: '' };
  const emUso = tb.id && S.modulos.some(m => m.tabela_id === tb.id);
  const linhaFaixa = f => `<div class="mt-faixa" data-faixa>
      <label class="fi-field"><span class="fi-label">${t('Atingimento mínimo (%)')}</span><input class="fi-input" data-min value="${num(f.min, f.min % 1 ? 1 : 0)}"></label>
      <label class="fi-field"><span class="fi-label">${t('Paga do prêmio-base (%)')}</span><input class="fi-input" data-mult value="${num(f.mult * 100, 0)}"></label>
      <div class="fi-field"><span class="fi-label">${t('Equivale a')}</span><div class="mt-small mt-muted" data-eq style="min-height:38px;display:flex;align-items:center"></div></div>
      <button class="fi-icon-btn" data-rm title="${t('Remover faixa')}">✕</button></div>`;
  const el = modal({ titulo: tb.id ? t('Editar tabela de premiação') : t('Nova tabela de premiação'), largura: 720,
    corpo: `<div class="mt-form"><label class="fi-field"><span class="fi-label">${t('Nome *')}</span><input class="fi-input" id="t-nome" value="${esc(tb.nome)}" placeholder="${t('Ex.: Vendedores — premiação reduzida')}"></label>
      <label class="fi-field"><span class="fi-label">${t('Para quem')}</span><select class="fi-select" id="t-tipo">
        ${['vendedor', 'supervisao', 'ambos'].map(k => `<option value="${k}" ${(tb.tipo || 'ambos') === k ? 'selected' : ''}>${t(tipoTabela({ tipo: k }))}</option>`).join('')}</select></label></div>
      ${emUso ? `<div class="fi-alert fi-alert--warning">${t('Tabela em uso: mudanças valem para os meses ainda não fechados dos módulos que a usam.')}</div>` : ''}
      <div id="t-faixas" style="display:grid;gap:8px">${faixasOrd(tb).map(linhaFaixa).join('')}</div>
      <div><button class="fi-btn" id="t-add">${t('+ Faixa')}</button></div>
      <label class="mt-check"><input type="checkbox" id="t-tri" ${tb.recup_tri ? 'checked' : ''}> ${t('Recuperação trimestral — a faixa atingida no trimestre vale para os 3 meses, descontando o que cada mês já recebeu')}</label>
      <label class="mt-check"><input type="checkbox" id="t-ano" ${tb.recup_anual ? 'checked' : ''}> ${t('Recuperação anual — a faixa atingida no ano vale para os 12 meses, descontando o que cada mês já recebeu')}</label>
      <label class="fi-field"><span class="fi-label">${t('Observação')}</span><textarea class="fi-textarea" id="t-obs">${esc(tb.observacao || '')}</textarea></label>
      <div class="mt-help">${t('Exemplo de leitura: meta R$ 100.000 e prêmio-base R$ 1.000 → a faixa de 100% (paga 100%) paga R$ 1.000 sobre R$ 100.000 vendidos = 1,00% de comissão; a de 90% (paga 50%) paga R$ 500 sobre R$ 90.000 = 0,56%; a de 105% (paga 200%) paga R$ 2.000 sobre R$ 105.000 = 1,90%.')}</div>`,
    botoes: [
      ...(tb.id && !emUso ? [{ texto: t('Excluir'), perigo: true, esquerda: true, acao: async () => {
        if (!await confirmar({ title: t('Excluir tabela'), message: t('Excluir esta tabela de premiação?'), confirmText: t('Excluir'), danger: true })) return false;
        await q(S.sb.from('met_tabelas').delete().eq('id', tb.id)); await recarregar(t('Tabela excluída')); } }] : []),
      { texto: t('Cancelar') },
      { texto: t('Salvar'), primario: true, acao: async () => {
        const faixas = $$('[data-faixa]', el).map(r => ({ min: parseNum($('[data-min]', r).value), mult: (parseNum($('[data-mult]', r).value) || 0) / 100 }))
          .filter(f => f.min != null).sort((a, b) => a.min - b.min);
        const d = { nome: $('#t-nome').value.trim(), tipo: $('#t-tipo').value, faixas, recup_tri: $('#t-tri').checked, recup_anual: $('#t-ano').checked, observacao: $('#t-obs').value.trim() || null };
        if (!d.nome) { notify(t('Informe o nome da tabela.'), 'warning'); return false; }
        if (!faixas.length) { notify(t('Inclua ao menos uma faixa.'), 'warning'); return false; }
        if (tb.id) await q(S.sb.from('met_tabelas').update(d).eq('id', tb.id)); else await q(S.sb.from('met_tabelas').insert(d));
        await recarregar(t('Tabela salva'));
      } }] });
  const atualizaEq = () => $$('[data-faixa]', el).forEach(r => {
    const mi = parseNum($('[data-min]', r).value), mu = (parseNum($('[data-mult]', r).value) || 0) / 100;
    $('[data-eq]', r).textContent = mi ? t('paga {m} do prêmio-base', { m: multTxt(mu) }) : '';
  });
  const liga = () => { $$('[data-rm]', el).forEach(b => b.onclick = () => { b.closest('[data-faixa]').remove(); }); $$('input', $('#t-faixas', el)).forEach(i => i.oninput = atualizaEq); atualizaEq(); };
  $('#t-add', el).onclick = () => { $('#t-faixas', el).insertAdjacentHTML('beforeend', linhaFaixa({ min: 110, mult: 2 })); liga(); };
  liga();
}

/* ---------------------------- Distribuição do planejamento anual ---------------------------- */
/* Planejamento = Bordados + Industrial + Subsídio (vendas da diretoria).
   Bordados e Industrial dividem o que sobra do planejamento depois do subsídio:
   mexeu em um, o outro se ajusta para a soma continuar fechando. */
const SETORES = [['bordados', 'Bordados'], ['industrial', 'Industrial']];
function aDistribuicao() {
  const anos = [...new Set([HOJE.getFullYear(), HOJE.getFullYear() + 1, ...S.modulos.map(m => m.ano), ...S.dist.map(d => d.ano)])].sort((a, b) => b - a);
  if (!S.distAno) S.distAno = HOJE.getFullYear() + (HOJE.getMonth() >= 9 ? 1 : 0);
  const ano = S.distAno;
  const salvo = S.dist.find(d => d.ano === ano);
  const st = salvo ? { planejamento: +salvo.planejamento, bordados: +salvo.bordados, industrial: +salvo.industrial, subsidio: +salvo.subsidio,
                       modulo_bordados: salvo.modulo_bordados, modulo_industrial: salvo.modulo_industrial, observacao: salvo.observacao || '' }
                   : { planejamento: 0, bordados: 0, industrial: 0, subsidio: 0, modulo_bordados: null, modulo_industrial: null, observacao: '' };
  const modsAno = S.modulos.filter(m => m.ano === ano && !ehSup(m));
  const campo = (id, rot, help, cls) => `<label class="fi-field ${cls || ''}"><span class="fi-label">${rot}</span>
      <input class="fi-input mt-num" id="${id}" inputmode="decimal" style="font-size:1.05rem;font-weight:750"><span class="fi-field__help" id="${id}-h">${help || ''}</span></label>`;
  $('#adm-body').innerHTML = `
  <section class="fi-card"><div class="fi-card__head"><div><div class="fi-card__title">${t('Distribuição do planejamento anual')}</div>
      <div class="fi-card__note">${t('O planejamento anual é dividido entre os setores Bordados e Industrial. O subsídio (vendas da diretoria) entra para completar a meta. Diminuiu um setor, o outro aumenta — a soma sempre fecha no planejamento.')}</div></div>
      <div class="mt-row"><select class="fi-select" id="d-ano" style="width:auto">${anos.map(a => `<option value="${a}" ${a === ano ? 'selected' : ''}>${a}</option>`).join('')}</select>
      <button class="fi-btn fi-btn--primary" id="d-salvar" disabled>${t('Salvar')}</button></div></div>
    <div class="fi-card__body" style="display:grid;gap:16px">
      <div class="mt-form" style="grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)">
        ${campo('d-plan', t('Planejamento anual (R$) *'), '', '')}
        <div class="fi-field"><span class="fi-label">${t('Situação')}</span><div id="d-status" style="min-height:42px;display:flex;align-items:center"></div></div>
      </div>
      <div><div class="es-dist" id="d-barra"></div>
        <div class="mt-row mt-mt"><span class="mt-small mt-strong">${t('Bordados')}</span>
          <input type="range" id="d-slider" min="0" max="1000" step="1" style="flex:1;accent-color:var(--fi-brand)">
          <span class="mt-small mt-strong">${t('Industrial')}</span></div></div>
      <div class="fi-grid fi-grid--3">
        <div class="fi-card fi-metric fi-metric--brand" style="min-height:0">${campo('d-bordados', t('Bordados — setor de vendas'))}</div>
        <div class="fi-card fi-metric" style="min-height:0;--x:1">${campo('d-industrial', t('Industrial — setor de vendas'))}</div>
        <div class="fi-card fi-metric" style="min-height:0">${campo('d-subsidio', t('Subsídio — vendas da diretoria'), t('Opcional: vendas da diretoria incluídas para bater a meta.'))}</div>
      </div>
      <label class="fi-field"><span class="fi-label">${t('Observação')}</span><textarea class="fi-textarea" id="d-obs" style="min-height:60px">${esc(st.observacao)}</textarea></label>
    </div>
    ${salvo ? `<div class="fi-card__foot">${esc(t('Última alteração: {d} por {p}', { d: new Date(salvo.atualizado_em).toLocaleString(LOC()), p: salvo.atualizado_por || '—' }))}</div>` : ''}
  </section>

  <section class="fi-card mt-mt2"><div class="fi-card__head"><div><div class="fi-card__title">${t('Planejado × metas distribuídas aos vendedores')}</div>
    <div class="fi-card__note">${t('Vincule cada setor ao seu módulo de metas para conferir se a soma das metas dos vendedores fecha com o valor do setor.')}</div></div></div>
    <div class="fi-table-wrap" style="border:0"><table class="fi-table" id="d-conf"><thead><tr><th>${t('Setor')}</th><th>${t('Módulo de metas')}</th><th class="mt-num">${t('Planejado')}</th>
      <th class="mt-num">${t('Metas lançadas')}</th><th class="mt-num">${t('Diferença')}</th><th>${t('Situação')}</th></tr></thead><tbody>
      ${SETORES.map(([k, n]) => `<tr><td class="mt-strong">${t(n)}</td><td><select class="fi-select" id="d-mod-${k}" style="min-width:220px"><option value="">—</option>
        ${modsAno.map(m => `<option value="${m.id}" ${st['modulo_' + k] === m.id ? 'selected' : ''}>${esc(m.nome)}</option>`).join('')}</select></td>
        <td class="mt-num" data-pl="${k}"></td><td class="mt-num" data-ml="${k}"></td><td class="mt-num" data-df="${k}"></td><td data-si="${k}"></td></tr>`).join('')}
    </tbody></table></div>
    ${modsAno.length ? '' : `<div class="fi-card__foot">${t('Nenhum módulo de vendedores neste ano ainda.')}</div>`}</section>`;

  const I = id => $('#' + id);
  const fmt = v => num(v);
  const set = (id, v) => { if (document.activeElement !== I(id)) I(id).value = fmt(v); };
  let sujo = false;
  const marca = () => { sujo = true; I('d-salvar').disabled = false; };
  const resto = () => Math.max(0, st.planejamento - st.subsidio);
  const ratioB = () => { const r = st.bordados + st.industrial; return r > 0 ? st.bordados / r : 0.5; };
  const reparte = (rB) => { const r = resto(); st.bordados = Math.round(r * rB * 100) / 100; st.industrial = Math.round((r - st.bordados) * 100) / 100; };
  const render = () => {
    ['d-plan', 'd-bordados', 'd-industrial', 'd-subsidio'].forEach(id => set(id, st[{ 'd-plan': 'planejamento', 'd-bordados': 'bordados', 'd-industrial': 'industrial', 'd-subsidio': 'subsidio' }[id]]));
    const P = st.planejamento || 0, p = v => P ? pct(v / P) : '—';
    I('d-bordados-h').textContent = t('{p} do planejamento · {m}/mês', { p: p(st.bordados), m: brl0(st.bordados / 12) });
    I('d-industrial-h').textContent = t('{p} do planejamento · {m}/mês', { p: p(st.industrial), m: brl0(st.industrial / 12) });
    I('d-plan-h').textContent = P ? t('equivale a {m}/mês', { m: brl0(P / 12) }) : '';
    const partes = [['bordados', 'Bordados', 'var(--fi-brand)'], ['industrial', 'Industrial', 'var(--fi-info)'], ['subsidio', 'Subsídio', 'var(--fi-warning)']];
    I('d-barra').innerHTML = P ? partes.filter(([k]) => st[k] > 0).map(([k, n, c]) => `<div style="flex:${st[k]};background:${c}" title="${t(n)} ${brl0(st[k])}">
        <b>${t(n)}</b><span>${pct(st[k] / P)} · ${brl0(st[k])}</span></div>`).join('') : `<div style="flex:1;background:var(--fi-surface-alt);color:var(--fi-muted)"><span>${t('Informe o planejamento anual')}</span></div>`;
    I('d-slider').disabled = !resto();
    if (document.activeElement !== I('d-slider')) I('d-slider').value = Math.round((resto() ? st.bordados / resto() : 0.5) * 1000);
    const soma = st.bordados + st.industrial + st.subsidio, dif = Math.round((P - soma) * 100) / 100;
    I('d-status').innerHTML = !P ? `<span class="mt-muted">—</span>` : Math.abs(dif) < 0.01
      ? `<span class="fi-badge fi-badge--success">✓ ${t('Distribuição fecha no planejamento')}</span>`
      : `<span class="fi-badge fi-badge--warning">${dif > 0 ? t('Falta distribuir {v}', { v: brl(dif) }) : t('Excede o planejamento em {v}', { v: brl(-dif) })}</span>`;
    // conferência com os módulos
    SETORES.forEach(([k]) => {
      const mid = I('d-mod-' + k).value, plan = st[k];
      $(`[data-pl="${k}"]`).textContent = brl(plan);
      if (!mid) { [`[data-ml="${k}"]`, `[data-df="${k}"]`].forEach(s => $(s).textContent = '—'); $(`[data-si="${k}"]`).innerHTML = `<span class="mt-muted mt-small">${t('Sem módulo vinculado')}</span>`; return; }
      const v = vincDe(mid);
      const lancado = sum(v.map(x => sum(x.metas.map(z => z || 0))));
      const completo = v.length && v.every(x => somaMetas(x.metas, 1, 12) != null);
      const dif2 = plan - lancado;
      $(`[data-ml="${k}"]`).innerHTML = brl(lancado) + (completo ? '' : `<div class="mt-wait">${t('metas ainda incompletas')}</div>`);
      $(`[data-df="${k}"]`).innerHTML = `<span class="${Math.abs(dif2) < 0.01 ? 'mt-pos' : dif2 > 0 ? 'mt-warn' : 'mt-neg'} mt-strong">${brl(dif2)}</span>`;
      $(`[data-si="${k}"]`).innerHTML = Math.abs(dif2) < 0.01 ? `<span class="fi-badge fi-badge--success">✓ ${t('Fechado')}</span>`
        : dif2 > 0 ? `<span class="fi-badge fi-badge--warning">${t('Falta distribuir aos vendedores')}</span>` : `<span class="fi-badge fi-badge--danger">${t('Metas acima do planejado')}</span>`;
    });
  };
  const ler = id => Math.max(0, parseNum(I(id).value) || 0);
  I('d-plan').addEventListener('input', () => { const rB = ratioB(); st.planejamento = ler('d-plan'); st.subsidio = Math.min(st.subsidio, st.planejamento); reparte(rB); marca(); render(); });
  I('d-subsidio').addEventListener('input', () => { const rB = ratioB(); st.subsidio = Math.min(ler('d-subsidio'), st.planejamento); reparte(rB); marca(); render(); });
  I('d-bordados').addEventListener('input', () => { st.bordados = Math.min(ler('d-bordados'), resto()); st.industrial = Math.round((resto() - st.bordados) * 100) / 100; marca(); render(); });
  I('d-industrial').addEventListener('input', () => { st.industrial = Math.min(ler('d-industrial'), resto()); st.bordados = Math.round((resto() - st.industrial) * 100) / 100; marca(); render(); });
  I('d-slider').addEventListener('input', () => { reparte(Number(I('d-slider').value) / 1000); marca(); render(); });
  ['d-plan', 'd-bordados', 'd-industrial', 'd-subsidio'].forEach(id => I(id).addEventListener('blur', render));
  SETORES.forEach(([k]) => I('d-mod-' + k).addEventListener('change', () => { marca(); render(); }));
  I('d-obs').addEventListener('input', marca);
  I('d-ano').onchange = e => { if (sujo && !window.confirm(t('Há alterações não salvas. Descartar?'))) { e.target.value = ano; return; } S.distAno = Number(e.target.value); aDistribuicao(); };
  I('d-salvar').onclick = async () => {
    const d = { ano, planejamento: st.planejamento, bordados: st.bordados, industrial: st.industrial, subsidio: st.subsidio,
      modulo_bordados: I('d-mod-bordados').value || null, modulo_industrial: I('d-mod-industrial').value || null,
      observacao: I('d-obs').value.trim() || null, atualizado_em: new Date().toISOString(), atualizado_por: S.nome || S.email };
    if (Math.abs(d.planejamento - d.bordados - d.industrial - d.subsidio) > 0.01) { notify(t('A soma dos setores e do subsídio precisa fechar no planejamento.'), 'warning'); return; }
    I('d-salvar').disabled = true;
    try { await q(S.sb.from('met_distribuicao').upsert(d, { onConflict: 'ano' })); await recarregar(t('Distribuição salva')); }
    catch (e) { notify(erroMsg(e), 'danger'); I('d-salvar').disabled = false; }
  };
  render();
}

/* ---------------------------- Módulos de metas (lista → configuração com metas mensais) ---------------------------- */
function aModulos() {
  if (S.modEdit) { const m = byId(S.modulos, S.modEdit); if (m) return aModuloEditor(m); }
  $('#adm-body').innerHTML = `<section class="fi-card"><div class="fi-card__head"><div><div class="fi-card__title">${t('Módulos de metas')}</div>
    <div class="fi-card__note">${t('Abra um módulo para configurar participantes, metas e prêmios de cada mês. Meta de vendedor = individual; meta de supervisão = soma da equipe.')}</div></div>
    <button class="fi-btn fi-btn--primary" id="bt-novo">${t('Novo módulo')}</button></div>
    <div class="fi-table-wrap" style="border:0"><table class="fi-table"><thead><tr><th>${t('Módulo')}</th><th>${t('Tipo')}</th><th class="mt-num">${t('Ano')}</th><th>${t('Tabela')}</th>
      <th class="mt-num">${t('Participantes')}</th><th class="mt-num">${t('Meta anual')}</th><th class="mt-num">${t('Prêmio-base anual')}</th><th class="mt-num">${t('Comissão equiv. (100%)')}</th><th>${t('Fechado até')}</th><th>${t('Visualização')}</th><th></th></tr></thead><tbody>
    ${S.modulos.map(m => {
      const v = vincDe(m.id), metasAno = v.map(x => somaMetas(x.metas, 1, 12));
      const meta = v.length && metasAno.every(z => z != null) ? sum(metasAno) : null;
      const pr = sum(v.map(x => sum(x.premios))), uf = ultimoFechado(m.id);
      return `<tr data-abrir="${m.id}" style="cursor:pointer"><td class="mt-strong">${esc(m.nome)}${m.ativo ? '' : ` <span class="fi-badge fi-badge--warning">${t('Inativo')}</span>`}</td>
      <td>${tipoBadge(m)}</td><td class="mt-num">${m.ano}</td><td>${esc((byId(S.tabelas, m.tabela_id) || {}).nome || '—')}</td>
      <td class="mt-num">${v.length}</td><td class="mt-num">${meta == null ? WAIT() : brl0(meta)}</td><td class="mt-num">${brl0(pr)}</td><td class="mt-num">${pct(meta ? pr / meta : null, 2)}</td>
      <td>${uf ? MES(uf - 1) : '—'}</td><td>${m.visivel ? `<span class="fi-badge fi-badge--success">${t('Liberado')}</span>` : `<span class="fi-badge">${t('Oculto')}</span>`}</td>
      <td class="mt-num"><button class="fi-btn" data-abrir-bt="${m.id}">${t('Abrir')}</button></td></tr>`; }).join('') ||
      `<tr><td colspan="11"><div class="fi-empty">${t('Nenhum módulo criado.')}</div></td></tr>`}
    </tbody></table></div></section>`;
  $('#bt-novo').onclick = () => formModulo();
  $$('[data-abrir]').forEach(tr => tr.onclick = () => { location.hash = '#/adm/modulos/' + tr.dataset.abrir; });
}

const COLS = [1, 2, 3, 'T1', 4, 5, 6, 'T2', 7, 8, 9, 'T3', 10, 11, 12, 'T4', 'A'];
function aModuloEditor(m) {
  const tb = byId(S.tabelas, m.tabela_id), fech = fechadosDe(m.id), vinc = vincDe(m.id), sup = ehSup(m), campo = S.metaCampo;
  const base = sup ? byId(S.modulos, m.base_modulo_id) : null, uf = ultimoFechado(m.id);
  setHead(t('Módulos de metas'), m.nome, (sup ? t('Meta de supervisão') : t('Meta de vendedor')) + ' · ' + m.ano + (tb ? ' · ' + tb.nome : ''));
  const jaDentro = new Set(vinc.map(x => x.vendedor_id));
  const funcaoAlvo = sup ? 'supervisor' : 'vendedor';
  const candidatos = S.vendedores.filter(v => v.ativo && !jaDentro.has(v.id) && (v.funcao || 'vendedor') === funcaoAlvo && (sup || !m.regiao_id || v.regiao_id === m.regiao_id));
  const outros = S.vendedores.filter(v => v.ativo && !jaDentro.has(v.id) && !candidatos.includes(v));
  const editavel = !(sup && campo === 'metas');
  const head = COLS.map(c => typeof c === 'number' ? `<th class="mt-num">${MES(c - 1)}${fech.has(c) ? ' 🔒' : ''}</th>`
    : `<th class="mt-num mt-qcol">${c === 'A' ? t('Ano') : t('{q}º tri', { q: c.slice(1) })}</th>`).join('');
  let linhas = '';
  vinc.forEach(x => {
    const arr = campo === 'metas' ? x.metas : x.premios.map(Number);
    linhas += `<tr><td class="mt-strong"><a href="#" data-det="${x.vendedor_id}" title="${t('Detalhes e comissão equivalente')}">${esc(x.v.nome)}</a>
        ${sup ? `<div class="mt-small mt-muted">${t((x.equipe || []).length === 1 ? '{n} vendedor' : '{n} vendedores', { n: (x.equipe || []).length })}</div>` : ''}</td>
      ${COLS.map(c => typeof c === 'number'
        ? (editavel ? `<td class="mt-tight"><input class="mt-in" data-v="${x.vendedor_id}" data-m="${c}" value="${arr[c - 1] == null ? '' : num(arr[c - 1])}" data-orig="${arr[c - 1] == null ? '' : arr[c - 1]}" ${fech.has(c) ? 'disabled' : ''}></td>`
                    : `<td class="mt-num" data-ro="${x.vendedor_id}|${c}">${brlOuWait(arr[c - 1])}</td>`)
        : `<td class="mt-num mt-qcol" data-calc="${x.vendedor_id}|${c}"></td>`).join('')}
      <td class="mt-num" style="white-space:nowrap">${sup ? `<button class="fi-btn" data-eqp="${x.vendedor_id}">${t('Equipe')}</button> ` : ''}<button class="fi-icon-btn" data-rmv="${x.vendedor_id}" title="${t('Remover do módulo')}">✕</button></td></tr>`;
  });
  $('#adm-body').innerHTML = `
  <div class="mt-row mt-noprint" style="margin-bottom:12px"><a class="fi-btn" href="#/adm/modulos">${t('← Todos os módulos')}</a><span class="mt-sp"></span>
    <button class="fi-btn" id="me-dados">${t('Editar dados do módulo')}</button>
    <button class="fi-btn fi-btn--primary" id="me-fech">${t('Lançamentos e fechamento')}</button></div>
  <section class="fi-card"><div class="fi-card__body"><div class="mt-kv" style="grid-template-columns:repeat(5,minmax(0,1fr))">
    <div><span>${t('Tipo')}</span><b>${tipoBadge(m)}</b></div>
    <div><span>${t('Tabela de premiação')}</span><b title="${esc(tb ? tb.nome : '')}">${esc(tb ? tb.nome : '—')}</b><div class="mt-small">${faixasOrd(tb).map(f => `<span class="mt-pill ${classeMult(f.mult)}">≥${num(f.min, 0)}% → ${multTxt(f.mult)}</span>`).join(' ')}</div></div>
    <div><span>${sup ? t('Módulo base (vendedores)') : t('Região')}</span><b>${esc(sup ? (base ? base.nome + ' · ' + base.ano : '—') : ((byId(S.regioes, m.regiao_id) || {}).nome || t('Todas')))}</b></div>
    <div><span>${t('Fechado até')}</span><b>${uf ? MESL(uf - 1) : '—'}</b></div>
    <div><span>${t('Visualização')}</span><label class="mt-check"><input type="checkbox" id="me-vis" ${m.visivel ? 'checked' : ''}> ${m.visivel ? t('Liberado') : t('Oculto')}</label></div>
  </div>
  ${sup ? `<div class="fi-alert fi-alert--info mt-mt">${esc(t('Meta e realizado de cada supervisor = soma da equipe no módulo “{b}”. Aqui você define a equipe e o prêmio-base da supervisão.', { b: base ? base.nome : '—' }))}</div>` : ''}
  ${sup && !base ? `<div class="fi-alert fi-alert--warning mt-mt">${t('Escolha o módulo base (vendedores) em “Editar dados do módulo”.')}</div>` : ''}
  </div></section>

  <section class="fi-card mt-mt2"><div class="fi-card__head"><div><div class="fi-card__title">${t('Participantes e metas mensais')}</div>
      <div class="fi-card__note">${sup ? (campo === 'metas' ? t('Metas calculadas a partir da equipe — somente leitura. Para mudar, ajuste as metas dos vendedores no módulo base.') : t('Prêmio-base mensal da supervisão.'))
        : t('Lance a meta de cada mês por vendedor. Trimestres e ano são calculados sozinhos com os meses já lançados; enquanto faltar algum mês, aparece “Aguardando dados”.')}</div></div>
      <div class="mt-row">
        <div class="mt-tabs" style="margin:0"><button class="mt-tab" data-campo="metas" aria-selected="${campo === 'metas'}">${t('Meta')}</button><button class="mt-tab" data-campo="premios" aria-selected="${campo === 'premios'}">${t('Prêmio-base')}</button></div>
        <button class="fi-btn fi-btn--primary" id="mm-salvar" disabled>${t('Salvar alterações')}</button></div></div>
    <div class="fi-card__body mt-row" style="border-bottom:1px solid var(--fi-line)">
      <select class="fi-select" id="vv-add" style="max-width:320px"><option value="">${sup ? t('Atrelar supervisor…') : t('Atrelar vendedor…')}</option>
        ${candidatos.map(v => `<option value="${v.id}">${esc(v.nome)}</option>`).join('')}
        ${outros.length ? `<optgroup label="${t('Outros')}">${outros.map(v => `<option value="${v.id}">${esc(v.nome)} (${t(v.funcao === 'supervisor' ? 'Supervisor' : 'Vendedor')})</option>`).join('')}</optgroup>` : ''}</select>
      <button class="fi-btn" id="vv-bt">${t('Atrelar')}</button>
      ${candidatos.length > 1 ? `<button class="fi-btn" id="vv-todos">${t('Atrelar todos ({n})', { n: candidatos.length })}</button>` : ''}
      <span class="mt-sp"></span><span class="mt-small mt-muted">${t('Clique no nome para ver detalhes e a comissão equivalente.')}</span></div>
    <div class="fi-table-wrap" style="border:0"><table class="fi-table" id="tb-metas"><thead><tr><th>${sup ? t('Supervisor') : t('Vendedor')}</th>${head}<th></th></tr></thead><tbody>
      ${linhas || `<tr><td colspan="${COLS.length + 2}"><div class="fi-empty">${sup ? t('Nenhum supervisor atrelado.') : t('Nenhum vendedor atrelado a este módulo.')}</div></td></tr>`}</tbody>
      ${vinc.length ? `<tfoot><tr><td>${t('Total')}</td>${COLS.map(c => `<td class="mt-num ${typeof c === 'number' ? '' : 'mt-qcol'}" data-tot="${c}"></td>`).join('')}<td></td></tr></tfoot>` : ''}</table></div>
    <div class="fi-card__foot">${t('Meta em branco = ainda não lançada. Trimestre e ano são somados automaticamente quando todos os meses do período têm meta.')}</div></section>
  ${regraHtml(tb)}`;

  // grade
  const sujos = new Map(), btS = $('#mm-salvar');
  const valoresDe = x => Array.from({ length: 12 }, (_, i) => {
    if (!editavel) return (campo === 'metas' ? x.metas : x.premios)[i];
    return parseNum($(`#tb-metas .mt-in[data-v="${x.vendedor_id}"][data-m="${i + 1}"]`).value);
  });
  const somaPer = (arr, de, ate) => campo === 'metas' ? somaMetas(arr, de, ate) : sum(arr.slice(de - 1, ate));
  const per = c => c === 'A' ? [1, 12] : [Number(c.slice(1)) * 3 - 2, Number(c.slice(1)) * 3];
  const recalc = () => {
    const todos = vinc.map(valoresDe);
    vinc.forEach((x, k) => COLS.filter(c => typeof c !== 'number').forEach(c => {
      const [a, b] = per(c); $(`[data-calc="${x.vendedor_id}|${c}"]`).innerHTML = brlOuWait(somaPer(todos[k], a, b));
    }));
    COLS.forEach(c => {
      const cel = $(`[data-tot="${c}"]`); if (!cel) return;
      const [a, b] = typeof c === 'number' ? [c, c] : per(c);
      const vals = todos.map(arr => somaPer(arr, a, b));
      cel.innerHTML = brlOuWait(vals.some(v => v == null) ? null : sum(vals));
    });
  };
  $$('#tb-metas .mt-in').forEach(i => {
    i.addEventListener('input', () => {
      const v = i.value.trim() === '' ? null : parseNum(i.value);
      const k = i.dataset.v + '|' + i.dataset.m, o = i.dataset.orig === '' ? null : Number(i.dataset.orig);
      if (v === o) { sujos.delete(k); i.classList.remove('mt-dirty'); } else { sujos.set(k, v); i.classList.add('mt-dirty'); }
      btS.disabled = !sujos.size; btS.textContent = sujos.size ? t('Salvar alterações ({n})', { n: sujos.size }) : t('Salvar alterações');
      recalc();
    });
    i.addEventListener('blur', () => { const v = parseNum(i.value); if (v != null) i.value = num(v); });
    i.addEventListener('keydown', e => { if (e.key === 'Enter') { const all = $$('#tb-metas .mt-in:not(:disabled)'); const n = all[all.indexOf(i) + 1]; if (n) n.focus(); } });
  });
  const descartaOk = () => !sujos.size || window.confirm(t('Há alterações não salvas. Descartar?'));
  $$('[data-campo]').forEach(b => b.onclick = () => { if (b.dataset.campo === campo || !descartaOk()) return; S.metaCampo = b.dataset.campo; aModuloEditor(m); });
  btS.onclick = async () => {
    btS.disabled = true;
    try {
      const ids = new Set([...sujos.keys()].map(k => k.split('|')[0]));
      for (const vid of ids) {
        let arr = valoresDe(vinc.find(z => z.vendedor_id === vid));
        if (campo === 'premios') arr = arr.map(v => v || 0);
        await q(S.sb.from('met_modulo_vendedores').update({ [campo]: arr }).eq('modulo_id', m.id).eq('vendedor_id', vid));
      }
      await recarregar(t('Metas salvas'));
    } catch (e) { notify(erroMsg(e), 'danger'); btS.disabled = false; }
  };
  recalc();

  // participantes
  const vincular = async ids => {
    if (!descartaOk()) return;
    try {
      await q(S.sb.from('met_modulo_vendedores').insert(ids.map(id => ({ modulo_id: m.id, vendedor_id: id }))));
      await recarregar(ids.length > 1 ? t('{n} participantes atrelados', { n: ids.length }) : t('Participante atrelado'));
      if (sup && ids.length === 1) { const x = vincDe(m.id).find(z => z.vendedor_id === ids[0]); if (x) editorEquipe(m, x); }
    } catch (e) { notify(erroMsg(e), 'danger'); }
  };
  $('#vv-bt').onclick = () => { const id = $('#vv-add').value; if (id) vincular([id]); };
  const bt = $('#vv-todos'); if (bt) bt.onclick = () => vincular(candidatos.map(v => v.id));
  $$('[data-rmv]').forEach(b => b.onclick = async () => {
    const x = vinc.find(z => z.vendedor_id === b.dataset.rmv);
    if (!await confirmar({ title: t('Remover do módulo'), message: t('Remove {n} deste módulo, com as metas dele. Lançamentos e fechamentos já gravados permanecem no banco.', { n: x.v.nome }), confirmText: t('Remover'), danger: true })) return;
    try { await q(S.sb.from('met_modulo_vendedores').delete().eq('modulo_id', m.id).eq('vendedor_id', x.vendedor_id)); await recarregar(); }
    catch (e) { notify(erroMsg(e), 'danger'); }
  });
  $$('[data-det]').forEach(a => a.onclick = e => { e.preventDefault(); editorMetas(m, vinc.find(z => z.vendedor_id === a.dataset.det)); });
  $$('[data-eqp]').forEach(b => b.onclick = () => editorEquipe(m, vinc.find(z => z.vendedor_id === b.dataset.eqp)));
  $('#me-dados').onclick = () => formModulo(m);
  $('#me-fech').onclick = () => { S.fechModulo = m.id; S.fechMes = null; location.hash = '#/adm/fechamento'; };
  $('#me-vis').onchange = async e => {
    try { await q(S.sb.from('met_modulos').update({ visivel: e.target.checked }).eq('id', m.id)); await recarregar(e.target.checked ? t('Visualização liberada aos vendedores') : t('Módulo ocultado dos vendedores')); }
    catch (er) { notify(erroMsg(er), 'danger'); e.target.checked = !e.target.checked; }
  };
}

/* Equipe do supervisor (vendedores do módulo base) */
function editorEquipe(m, x) {
  const base = byId(S.modulos, m.base_modulo_id);
  if (!base) { notify(t('Escolha o módulo base (vendedores) em “Editar dados do módulo”.'), 'warning'); return; }
  const doBase = vincDe(base.id), atual = new Set(x.equipe || []);
  const deOutro = {};
  vincDe(m.id).forEach(o => { if (o.vendedor_id !== x.vendedor_id) (o.equipe || []).forEach(id => { deOutro[id] = o.v.nome; }); });
  const regs = [...new Set(doBase.map(z => z.v.regiao_id).filter(Boolean))];
  const el = modal({ titulo: t('Equipe de {n}', { n: x.v.nome }), largura: 640,
    corpo: `<div class="mt-help">${esc(t('Vendedores do módulo “{b}” sob responsabilidade deste supervisor. A meta e o realizado da supervisão são a soma deles.', { b: base.nome }))}</div>
      ${regs.length ? `<div class="mt-row">${regs.map(r => `<button class="fi-btn" data-reg="${r}">+ ${esc((byId(S.regioes, r) || {}).nome)}</button>`).join('')}<button class="fi-btn" data-reg="*">${t('Marcar todos')}</button><button class="fi-btn" data-reg="-">${t('Limpar')}</button></div>` : ''}
      <div style="display:grid;gap:6px">${doBase.map(z => `<label class="mt-check"><input type="checkbox" value="${z.vendedor_id}" data-r="${z.v.regiao_id || ''}" ${atual.has(z.vendedor_id) ? 'checked' : ''}>
        <b>${esc(z.v.nome)}</b> <span class="mt-muted mt-small">${esc((byId(S.regioes, z.v.regiao_id) || {}).nome || '')}${deOutro[z.vendedor_id] ? ' · ' + esc(t('também na equipe de {n}', { n: deOutro[z.vendedor_id] })) : ''}</span></label>`).join('') ||
        `<div class="fi-empty">${t('O módulo base ainda não tem vendedores.')}</div>`}</div>`,
    botoes: [{ texto: t('Cancelar') }, { texto: t('Salvar'), primario: true, acao: async () => {
      const equipe = $$('input[type=checkbox]', el).filter(c => c.checked).map(c => c.value);
      await q(S.sb.from('met_modulo_vendedores').update({ equipe }).eq('modulo_id', m.id).eq('vendedor_id', x.vendedor_id));
      await recarregar(t('Equipe salva'));
    } }] });
  $$('[data-reg]', el).forEach(b => b.onclick = () => $$('input[type=checkbox]', el).forEach(c => {
    if (b.dataset.reg === '*') c.checked = true; else if (b.dataset.reg === '-') c.checked = false; else if (c.dataset.r === b.dataset.reg) c.checked = true;
  }));
}

/* ------------------------------ Lançamentos e fechamento ------------------------------ */
function seletorModulo(atual, idSel) {
  return `<select class="fi-select" id="${idSel}" style="max-width:380px">${S.modulos.map(m => `<option value="${m.id}" ${m.id === atual ? 'selected' : ''}>${esc(m.nome)} · ${m.ano} · ${ehSup(m) ? t('Supervisão') : t('Vendedores')}</option>`).join('')}</select>`;
}
const PEND = new Map();     // `${modulo}|${mes}|${vendedor}` -> valor (null = apagar)
function aFechamento() {
  if (!S.modulos.length) { $('#adm-body').innerHTML = `<div class="fi-card"><div class="fi-empty">${t('Crie um módulo de metas primeiro.')}</div></div>`; return; }
  if (!byId(S.modulos, S.fechModulo)) S.fechModulo = S.modulos[0].id;
  const m = byId(S.modulos, S.fechModulo), tb = byId(S.tabelas, m.tabela_id), fech = fechadosDe(m.id), uf = ultimoFechado(m.id);
  if (!S.fechMes) S.fechMes = Math.min(12, uf + 1);
  const mes = S.fechMes, fechado = fech.has(mes), ehTri = mes % 3 === 0, sup = ehSup(m);
  const base = sup ? byId(S.modulos, m.base_modulo_id) : null;
  const baseOk = !sup || (base && fechadosDe(base.id).has(mes));
  const vinc = vincDe(m.id);
  const chave = vid => m.id + '|' + mes + '|' + vid;
  const pendDoModulo = () => [...PEND.keys()].filter(k => k.startsWith(m.id + '|'));
  const calcLinhas = () => vinc.map(x => {
    if (fechado) { const f = S.fechamentos.find(z => z.modulo_id === m.id && z.mes === mes && z.vendedor_id === x.vendedor_id); return { x, d: f ? f.dados : null, f }; }
    const bruto = realPart(m, x).slice();
    if (!sup && PEND.has(chave(x.vendedor_id))) bruto[mes - 1] = PEND.get(chave(x.vendedor_id));
    const semLanc = bruto[mes - 1] == null;
    const real = bruto.map((v, i) => (i + 1 <= mes && v == null ? 0 : v));
    const c = calcular(tb, x.metas, x.premios, real, mes);
    return { x, semLanc, real: bruto[mes - 1], d: snapshot(m, tb, x, c, c.meses[mes - 1]) };
  });
  let linhas = calcLinhas();
  const pctW = v => v == null ? WAIT() : pct(v);
  const cols = [
    ['ating', t('Atingido'), d => pct(d.atingimento)],
    ['faixa', t('Faixa'), d => `<span class="mt-pill ${classeMult(d.multiplicador)}">${multTxt(d.multiplicador)}</span>`],
    ['base', t('Prêmio-base'), d => brl(d.premio_base)],
    ['premio', t('Prêmio mês'), d => brl(d.premio_mes)],
    ...(ehTri ? [['tq', t('Trim. %'), d => pctW(d.trimestre_atingimento)], ['rt', t('Rec. trimestre'), d => `<span class="${d.recuperacao_tri ? 'mt-pos mt-strong' : ''}">${brl(d.recuperacao_tri)}</span>`]] : []),
    ...(mes === 12 ? [['ta', t('Ano %'), d => pctW(d.ano_atingimento)], ['ra', t('Rec. ano'), d => `<span class="${d.recuperacao_ano ? 'mt-pos mt-strong' : ''}">${brl(d.recuperacao_ano)}</span>`]] : []),
    ['total', t('Total a pagar'), d => `<b>${brl(d.total)}</b>`],
    ['ce', t('Comissão efetiva'), d => pct(d.realizado ? d.total / d.realizado : null, 2)]
  ];
  const fe = linhas.find(l => l.f);
  const quando = fe ? { d: new Date(fe.f.fechado_em).toLocaleString(LOC()), p: esc(fe.f.fechado_por || '') } : null;
  const podeFechar = !fechado && mes === uf + 1 && vinc.length && baseOk;
  const nPend = pendDoModulo().length;

  $('#adm-body').innerHTML = `
    <div class="mt-printhead"><img data-fi-logo style="width:120px"><h2 style="margin:6px 0 0">${esc(t('Fechamento {m}/{a} — {n}', { m: MESL(mes - 1), a: m.ano, n: m.nome }))}</h2>
      <div class="mt-small">${esc(t('Tabela: {n}', { n: tb ? tb.nome : '' }))} · ${fechado && quando ? t('Fechado em {d} por {p}', quando) : t('PRÉVIA — mês não fechado')}</div></div>
    <section class="fi-card mt-noprint"><div class="fi-card__body" style="display:grid;gap:10px">
      <div class="mt-row">${seletorModulo(m.id, 'f-mod')} ${tipoBadge(m)}<span class="mt-sp"></span>
        ${fechado ? `<button class="fi-btn fi-btn--primary" id="f-pdf">${t('PDF do fechamento')}</button><button class="fi-btn" id="f-xls">${t('Exportar Excel')}</button><button class="fi-btn" id="f-print">${t('Imprimir')}</button>
                     <button class="fi-btn fi-btn--danger" id="f-reabrir" ${mes !== uf ? `disabled title="${t('Reabra primeiro os meses posteriores')}"` : ''}>${t('Reabrir {m}', { m: MES(mes - 1) })}</button>`
          : `${!sup ? `<button class="fi-btn" id="l-modelo">${t('Modelo Excel')}</button><label class="fi-btn" style="cursor:pointer">${t('Importar Excel')}<input type="file" id="l-file" accept=".xlsx,.xls,.csv" hidden></label>
             <button class="fi-btn" id="l-salvar" ${nPend ? '' : 'disabled'}>${nPend ? t('Salvar lançamentos ({n})', { n: nPend }) : t('Salvar lançamentos')}</button>` : ''}
             <button class="fi-btn" id="f-xls">${t('Prévia em Excel')}</button>
             <button class="fi-btn fi-btn--primary" id="f-fechar" ${podeFechar ? '' : 'disabled'}>🔒 ${t('Fechar {m} e gerar PDF', { m: MESL(mes - 1) })}</button>`}</div>
      <div class="mt-tabs" style="margin:0">${Array.from({ length: 12 }, (_, i) => `<button class="mt-tab" data-fm="${i + 1}" aria-selected="${i + 1 === mes}">${MES(i)}${fech.has(i + 1) ? ' 🔒' : ''}</button>`).join('')}</div>
      ${!fechado && mes !== uf + 1 ? `<div class="fi-alert fi-alert--info">${t('Os meses são fechados em sequência. Próximo a fechar: {m}.', { m: '<b>' + (uf < 12 ? MESL(uf) : '—') + '</b>' })} ${!sup ? t('Você pode lançar o realizado deste mês desde já.') : ''}</div>` : ''}
      ${!fechado && sup && !baseOk ? `<div class="fi-alert fi-alert--warning">${esc(t('O realizado da supervisão vem da equipe: feche antes {m} no módulo “{b}”.', { m: MESL(mes - 1), b: base ? base.nome : '—' }))}</div>` : ''}
      <div class="fi-alert fi-alert--warning" id="f-semlanc" style="display:none"></div>
      ${ehTri ? `<div class="fi-alert fi-alert--info">${t(mes === 12 ? 'Fim do {q}º trimestre: este fechamento inclui a recuperação trimestral e a recuperação anual.' : 'Fim do {q}º trimestre: este fechamento inclui a recuperação trimestral.', { q: mes / 3 })}</div>` : ''}
    </div></section>
    <section class="fi-card mt-mt"><div class="fi-card__head"><div><div class="fi-card__title">${fechado ? t('Fechamento') : t('Lançamento e prévia')} — ${MESL(mes - 1)}/${m.ano}</div>
      <div class="fi-card__note">${fechado && quando ? t('Fechado em {d} por {p} — valores congelados.', quando) : sup ? t('Realizado consolidado da equipe (somente leitura).') : t('Digite o realizado do mês; a premiação é recalculada na hora. Salve e, quando estiver tudo certo, feche o mês.')}</div></div>
      ${fechado ? `<span class="fi-badge fi-badge--success">${t('Fechado')}</span>` : `<span class="fi-badge fi-badge--warning">${t('Aberto')}</span>`}</div>
    <div class="fi-table-wrap" style="border:0"><table class="fi-table" id="tb-fech"><thead><tr><th>${sup ? t('Supervisor') : t('Vendedor')}</th><th class="mt-num">${t('Meta')}</th><th class="mt-num">${t('Realizado')}</th>
      ${cols.map(c => `<th class="${c[0] === 'faixa' ? '' : 'mt-num'}">${c[1]}</th>`).join('')}</tr></thead><tbody>
      ${linhas.map(l => !l.d ? `<tr><td>${esc(l.x.v.nome)}</td><td colspan="${cols.length + 2}" class="mt-muted">${t('Sem registro neste fechamento (atrelado depois).')}</td></tr>` : `<tr>
        <td class="mt-strong">${esc(l.d.vendedor || l.x.v.nome)} <span data-sl="${l.x.vendedor_id}"></span></td>
        <td class="mt-num">${l.d.meta == null && !fechado ? `<a href="#/adm/modulos/${m.id}" class="mt-wait" title="${t('Definir a meta no módulo')}">${t('Definir meta')} →</a>` : brlOuWait(l.d.meta)}</td>
        <td class="mt-num ${!fechado && !sup ? 'mt-tight' : ''}">${!fechado && !sup
          ? `<input class="mt-in" data-v="${l.x.vendedor_id}" value="${l.real == null ? '' : num(l.real)}" placeholder="R$" ${PEND.has(chave(l.x.vendedor_id)) ? 'data-pend="1"' : ''}>`
          : brl(l.d.realizado)}</td>

/* prévia de fechamento a partir dos dados gravados (sem lançamento = 0) */
function calcLinhasDe(m, mes) {
  const tb = byId(S.tabelas, m.tabela_id);
  return vincDe(m.id).map(x => {
    const real = realPart(m, x).map((v, i) => (i + 1 <= mes && v == null ? 0 : v));
    const c = calcular(tb, x.metas, x.premios, real, mes);
    return { x, d: snapshot(m, tb, x, c, c.meses[mes - 1]) };
  });
}

/* ------------------------------ Realizado: gravação e Excel ------------------------------ */
async function gravarRealizado(m, itens) {
  const quem = S.nome || S.email;
  const ups = itens.filter(i => i.valor != null).map(i => ({ modulo_id: m.id, vendedor_id: i.vendedor_id, mes: i.mes, valor: i.valor, atualizado_em: new Date().toISOString(), atualizado_por: quem }));
  const dels = itens.filter(i => i.valor == null);
  if (ups.length) await q(S.sb.from('met_realizado').upsert(ups, { onConflict: 'modulo_id,vendedor_id,mes' }));
  for (const d of dels) await q(S.sb.from('met_realizado').delete().eq('modulo_id', m.id).eq('vendedor_id', d.vendedor_id).eq('mes', d.mes));
}
const nomeArq = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w]+/g, '_');
function modeloExcel(m) {
  if (!window.XLSX) { notify(t('Biblioteca de Excel ainda carregando, tente de novo.'), 'warning'); return; }
  const linhas = [];
  vincDe(m.id).forEach(x => { const r = realDe(m.id, x.vendedor_id); for (let i = 0; i < 12; i++) linhas.push({ email: x.v.email, vendedor: x.v.nome, mes: i + 1, valor: r[i] == null ? '' : r[i] }); });
  const ws = XLSX.utils.json_to_sheet(linhas.length ? linhas : [{ email: '', vendedor: '', mes: '', valor: '' }]);
  ws['!cols'] = [{ wch: 30 }, { wch: 28 }, { wch: 6 }, { wch: 14 }];
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Realizado');
  XLSX.writeFile(wb, `realizado_${nomeArq(m.nome)}_${m.ano}.xlsx`);
}
function mesDe(v) {
  if (v == null || v === '') return null;
  if (v instanceof Date) return v.getMonth() + 1;
  if (typeof v === 'number') { if (v >= 1 && v <= 12) return Math.round(v); if (v > 20000) { const d = new Date(Math.round((v - 25569) * 864e5)); return d.getUTCMonth() + 1; } return null; }
  const s = String(v).trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  if (/^\d{1,2}$/.test(s)) { const n = Number(s); return n >= 1 && n <= 12 ? n : null; }

    if (S.admin) $('#nav-adm').classList.remove('mt-hidden');
    await carregar();
    if (!meusVendedores().length && S.veTudo) $('#nav-painel').classList.add('mt-hidden');
    window.addEventListener('hashchange', () => { $('#modal-root').innerHTML = ''; rota(); });
    rota();
  } catch (e) {
    if (typeof e === 'string') return;
    console.error(e);
    $('#view').innerHTML = `<div class="fi-alert fi-alert--danger">${esc(t('Não foi possível carregar os dados: {e}', { e: erroMsg(e) }))}</div>`;
  }
}
if (window.APP && window.APP.pronto) iniciar();
else document.addEventListener('DOMContentLoaded', () => window.APP && window.APP.pronto ? iniciar() : ($('#view').innerHTML = `<div class="fi-alert fi-alert--danger">${t('Login da Central de Acesso não carregou.')}</div>`));
})();
</script>
</body>
</html>
