<!DOCTYPE html>
<html lang="pt-BR" data-theme="light" data-fi-version="off">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metas e Premiação · Fiorella</title>
<!-- Login Fiorella: supabase-js + guard da Central de Acesso (chave "metas") -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://textilegroup.github.io/wendell-users/guard.js" data-app="metas" data-tema="nao"></script>
<!-- Design system Fiorella UI -->
<script src="https://textilegroup.github.io/fiorella-ui/fiorella-ui.js?v=1.3.4" defer></script>
<!-- Excel (importação de realizado e exportação de fechamentos) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<!-- PDF de fechamento -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js" defer></script>
<style>
  .mt-hidden{display:none!important}
  .mt-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
  .mt-tab{border:1px solid var(--fi-line);background:var(--fi-surface);color:var(--fi-muted);border-radius:999px;padding:6px 13px;font-size:.78rem;font-weight:700;cursor:pointer}
  .mt-tab[aria-selected="true"]{background:var(--fi-brand);border-color:var(--fi-brand);color:#fff}
  .mt-lang{display:inline-flex;border:1px solid var(--fi-line);border-radius:7px;overflow:hidden;height:36px}
  .mt-lang button{border:0;background:var(--fi-surface);color:var(--fi-muted);font-weight:750;font-size:.74rem;padding:0 10px;cursor:pointer;letter-spacing:.04em}
  .mt-lang button[aria-pressed="true"]{background:var(--fi-brand);color:#fff}
  .mt-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .mt-sp{flex:1}
  .mt-mt{margin-top:12px}.mt-mt2,.fi-eyebrow.mt-mt2{margin-top:18px}
  .mt-num{text-align:right!important;font-variant-numeric:tabular-nums}
  .mt-muted{color:var(--fi-muted)}
  .mt-small{font-size:.72rem}
  .mt-strong{font-weight:750}
  .mt-pos{color:var(--fi-success)}.mt-neg{color:var(--fi-danger)}.mt-warn{color:var(--fi-warning)}
  .mt-wait{color:var(--fi-muted);font-style:italic;font-size:.7rem;font-weight:600;white-space:nowrap}
  .mt-modcard{cursor:pointer;transition:border-color .15s, transform .15s}
  .mt-modcard:hover{border-color:var(--fi-brand);transform:translateY(-1px)}
  .mt-modcard .fi-card__body{display:grid;gap:10px}
  .mt-kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .mt-kv div{min-width:0}
  .mt-kv span{display:block;color:var(--fi-muted);font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
  .mt-kv b{display:block;font-size:.95rem;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mt-in{width:100%;min-width:84px;min-height:30px;padding:4px 7px;border:1px solid var(--fi-line);border-radius:6px;background:var(--fi-surface);color:var(--fi-text);font-size:.76rem;text-align:right;font-variant-numeric:tabular-nums}
  .mt-in:focus{outline:2px solid color-mix(in srgb,var(--fi-brand) 35%,transparent);border-color:var(--fi-brand)}
  .mt-in.mt-dirty{background:color-mix(in srgb,var(--fi-warning) 12%,var(--fi-surface))}
  .mt-in:disabled{opacity:.6;background:var(--fi-surface-alt)}
  .fi-table td.mt-tight,.fi-table th.mt-tight{padding:6px 6px}
  .fi-table th.mt-qcol,.fi-table td.mt-qcol{background:color-mix(in srgb,var(--fi-brand) 5%,var(--fi-surface-alt));font-weight:750}
  #tb-metas th:first-child,#tb-metas td:first-child,#tb-lanc th:first-child,#tb-lanc td:first-child{position:sticky;left:0;z-index:2;background:var(--fi-surface);box-shadow:1px 0 0 var(--fi-line)}
  #tb-metas th:first-child,#tb-lanc th:first-child,#tb-metas tfoot td:first-child{background:var(--fi-surface-alt)}
  .fi-table tfoot td{font-weight:750;background:var(--fi-surface-alt);border-top:1px solid var(--fi-line-strong)}
  .fi-table tr.mt-sub td{background:color-mix(in srgb,var(--fi-brand) 9%,var(--fi-surface));font-weight:750;font-size:.75rem;border-top:2px solid color-mix(in srgb,var(--fi-brand) 45%,transparent);border-bottom:2px solid color-mix(in srgb,var(--fi-brand) 45%,transparent)}
  .fi-table tr.mt-sub td:first-child{color:var(--fi-brand);text-transform:uppercase;letter-spacing:.05em;box-shadow:inset 4px 0 0 var(--fi-brand)}
  .fi-table tr.mt-sub .mt-pos{font-weight:800}
  .mt-pill{display:inline-block;min-width:44px;text-align:center;padding:2px 7px;border-radius:999px;font-size:.68rem;font-weight:750}
  .mt-m0{background:var(--fi-surface-alt);color:var(--fi-muted)}
  .mt-m1{background:color-mix(in srgb,var(--fi-warning) 14%,transparent);color:var(--fi-warning)}
  .mt-m2{background:color-mix(in srgb,var(--fi-success) 13%,transparent);color:var(--fi-success)}
  .mt-m3{background:color-mix(in srgb,var(--fi-brand) 14%,transparent);color:var(--fi-brand)}
  .mt-bar{position:relative;height:8px;border-radius:999px;background:var(--fi-surface-alt);overflow:visible;min-width:90px}
  /* gráficos: tons de cinza a preto (acompanham o tema claro/escuro) */
  :root{--mt-c1:var(--fi-text);--mt-c2:color-mix(in srgb,var(--fi-text) 72%,var(--fi-surface));--mt-c3:color-mix(in srgb,var(--fi-text) 48%,var(--fi-surface));--mt-c4:color-mix(in srgb,var(--fi-text) 26%,var(--fi-surface))}
  .mt-g1{background:var(--mt-c1)!important;color:var(--fi-surface)!important}.mt-g2{background:var(--mt-c2)!important;color:var(--fi-surface)!important}
  .mt-g3{background:var(--mt-c3)!important;color:var(--fi-surface)!important}.mt-g4{background:var(--mt-c4)!important;color:var(--fi-text)!important}
  .mt-gsaldo{background:repeating-linear-gradient(135deg,var(--fi-surface-alt) 0 6px,var(--fi-surface) 6px 12px)!important;color:var(--fi-text)!important;border-left:1px dashed var(--fi-line-strong)}
  .mt-bar>span{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--mt-c1);max-width:100%}
  .fi-progress>span{background:var(--mt-c1)!important}
  .mt-bar>i{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fi-line-strong)}
  .mt-modal--top{z-index:400!important}
  .mt-modal{position:fixed;inset:0;z-index:210;display:grid;place-items:center;padding:18px;background:rgba(9,12,16,.55)}
  .mt-modal__panel{width:min(760px,100%);max-height:calc(100vh - 36px);display:flex;flex-direction:column;border:1px solid var(--fi-line);border-radius:9px;background:var(--fi-surface);box-shadow:0 24px 64px rgba(0,0,0,.28)}
  .mt-modal__head{padding:14px 16px;border-bottom:1px solid var(--fi-line);font-weight:750;display:flex;align-items:center;gap:10px}
  .mt-modal__body{padding:16px;overflow:auto;display:grid;gap:12px}
  .mt-modal__foot{padding:12px 16px;border-top:1px solid var(--fi-line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
  .mt-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .mt-form .mt-full{grid-column:1/-1}
  .mt-check{display:flex;gap:8px;align-items:center;font-size:.8rem}
  .mt-faixa{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;align-items:end}
  .mt-help{font-size:.74rem;color:var(--fi-muted);line-height:1.45}
  .mt-rule{display:grid;gap:6px;font-size:.78rem;padding:12px 14px;border:1px dashed var(--fi-line-strong);border-radius:8px;background:var(--fi-surface-alt)}
  .mt-rule b{color:var(--fi-text)}
  .mt-falta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .mt-falta>div{padding:10px 12px;border:1px solid var(--fi-line);border-radius:8px;background:var(--fi-surface-alt)}
  .mt-falta span{display:block;font-size:.68rem;color:var(--fi-muted);font-weight:700;text-transform:uppercase}
  .mt-falta b{font-size:1rem;font-variant-numeric:tabular-nums}
  .mt-lock{font-size:.66rem;margin-left:4px}
  .mt-loading{padding:60px 0;text-align:center;color:var(--fi-muted)}
  .mt-printhead{display:none}
  .mt-modhead{cursor:pointer;align-items:center;flex-wrap:wrap}
  .mt-modhead:hover .fi-card__title{color:var(--fi-brand)}
  .mt-modkpis{display:flex;gap:22px;flex-wrap:wrap}
  .mt-modkpis div{display:grid;gap:2px;min-width:90px}
  .mt-modkpis span{color:var(--fi-muted);font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
  .mt-modkpis b{font-size:.95rem;font-variant-numeric:tabular-nums;white-space:nowrap}
  .mt-pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
  .mt-pcard{display:grid;gap:6px;padding:10px 12px;border:1px solid var(--fi-line);border-left:3px solid var(--fi-line-strong);border-radius:8px;background:var(--fi-surface);cursor:pointer;transition:border-color .15s,transform .15s;min-width:0}
  .mt-pcard:hover,.mt-pcard:focus{border-color:var(--fi-brand);transform:translateY(-1px);outline:none}
  .mt-pcard__top{display:flex;align-items:center;gap:4px;min-width:0}
  .mt-pcard__top b{font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mt-pcard__top .fi-badge{font-size:.58rem;padding:1px 6px;min-height:0}
  .mt-pcard__pct{font-size:1.3rem;font-weight:780;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .mt-pcard__ln{display:flex;justify-content:space-between;gap:6px;color:var(--fi-muted);font-size:.68rem;font-variant-numeric:tabular-nums}
  .mt-pcard__ln b{color:var(--fi-text)}
  .mt-qgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
  .mt-qcard{display:grid;gap:6px;padding:8px 10px;border:1px solid var(--fi-line);border-radius:7px;background:var(--fi-surface-alt)}
  .mt-qcard.mt-fixo{border-color:var(--mt-c1);box-shadow:inset 0 0 0 1px var(--mt-c1)}
  .mt-qhead{display:flex;align-items:center;justify-content:space-between;gap:6px}
  .mt-qhead b{font-size:.74rem}.mt-qhead small{color:var(--fi-muted);font-size:.66rem;margin-left:4px}
  .mt-fix{display:inline-flex;align-items:center;gap:4px;min-height:24px;padding:2px 8px;border:1px solid var(--fi-line-strong);border-radius:999px;background:var(--fi-surface);color:var(--fi-text);font-size:.66rem;font-weight:750;cursor:pointer}
  .mt-fix[aria-pressed="true"]{background:var(--mt-c1);border-color:var(--mt-c1);color:var(--fi-surface)}
  .mt-cin{width:100%;min-height:32px;padding:5px 9px;border:1px solid var(--fi-line);border-radius:6px;background:var(--fi-surface);color:var(--fi-text);font-size:.86rem;font-weight:750;text-align:right;font-variant-numeric:tabular-nums}
  .mt-cin:disabled{background:var(--fi-surface-alt);color:var(--fi-text);opacity:1}
  .mt-range{width:100%;margin:0;accent-color:var(--mt-c1);height:16px}
  .mt-dtop{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
  .mt-dtop .fi-field{gap:3px}.mt-dtop .fi-label{font-size:.68rem}.mt-dtop .fi-field__help{font-size:.64rem;color:var(--fi-muted)}
  .mt-saldo{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;font-size:.74rem;color:var(--fi-muted)}
  .mt-saldo b{color:var(--fi-text);font-variant-numeric:tabular-nums}
  .mt-saldo .mt-sv{padding:3px 10px;border-radius:999px;border:1px solid var(--fi-line-strong);color:var(--fi-text);font-weight:800}
  .mt-saldo .mt-sv.mt-zero{background:var(--mt-c1);color:var(--fi-surface);border-color:var(--mt-c1)}
  .mt-dcomp .fi-card__head{padding:10px 14px}.mt-dcomp .fi-card__body{padding:12px 14px}.mt-dcomp .fi-card__title{font-size:.86rem}.mt-dcomp .fi-card__note{font-size:.68rem}
  .mt-dcomp .es-dist{height:32px;border-radius:6px}.mt-dcomp .es-dist>div{padding:0 8px;font-size:.66rem}.mt-dcomp .es-dist b{font-size:.7rem}
  .mt-dcomp .mt-qmes{grid-template-columns:28px 1fr 34px;gap:4px;font-size:.68rem}.mt-dcomp .mt-qmes .mt-in{min-height:26px;padding:2px 6px;font-size:.72rem;min-width:0}
  .mt-dcomp .mt-qmeses{gap:4px}
  .mt-distrow td{background:var(--fi-surface-alt);color:var(--fi-muted);font-size:.72rem}
  .mt-saldorow td{font-weight:750;color:var(--fi-text)}
  .mt-spos{color:var(--fi-warning)}.mt-sneg{color:var(--fi-danger)}.mt-sok{color:var(--fi-success)}
  .mt-mrow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:4px 6px;align-items:center;font-size:.68rem}
  .mt-mrow>span{font-weight:700;color:var(--fi-muted);line-height:1.1}.mt-mrow>span small{display:block;font-weight:600;font-size:.6rem}
  .mt-mrow .mt-in{min-height:26px;padding:2px 6px;font-size:.72rem;min-width:0}
  .mt-mrow .mt-range{grid-column:2/3;height:12px}
  .mt-mrow .mt-fix{min-height:22px;padding:1px 6px;font-size:.62rem}
  .mt-qsaldo{font-size:.66rem;color:var(--fi-muted);text-align:right}.mt-qsaldo b{color:var(--fi-text)}
  @media(max-width:900px){.mt-dtop{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .mt-qmeses{display:grid;gap:6px}
  .mt-qmes{display:grid;grid-template-columns:34px 1fr 40px;gap:6px;align-items:center;font-size:.74rem}
  .mt-qmes span{font-weight:700;color:var(--fi-muted)}.mt-qmes small{color:var(--fi-muted);text-align:right;font-size:.68rem}
  @media(max-width:1040px){.mt-qgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(max-width:700px){.mt-qgrid{grid-template-columns:1fr}.mt-modkpis{gap:12px}}
  .mt-docname{display:flex;flex-direction:column;justify-content:center;min-width:0;padding-left:14px;border-left:1px solid var(--fi-line);margin-left:-10px}
  .mt-docname b{font-size:.9rem;font-weight:750;letter-spacing:-.01em;white-space:nowrap}
  .mt-docname small{color:var(--fi-muted);font-size:.7rem;line-height:1.3;white-space:nowrap}
  .mt-docname b{line-height:1.3}
  .fi-ui-version{display:none!important}
  @media(max-width:700px){.mt-docname{display:none}}
  .fi-table tr.mt-lider td{background:color-mix(in srgb,var(--fi-info) 7%,var(--fi-surface))}
  .fi-table tr.mt-lider:first-of-type td,.fi-table tr:not(.mt-lider)+tr.mt-lider td{border-top:2px solid var(--fi-line-strong)}
  .mt-tip{position:relative;display:inline-grid;place-items:center;width:17px;height:17px;margin-left:5px;border-radius:50%;border:1px solid var(--fi-line-strong);color:var(--fi-muted);font-size:.66rem;font-weight:800;cursor:help;vertical-align:middle;text-transform:none;letter-spacing:0}
  .mt-tip:hover,.mt-tip:focus{border-color:var(--fi-brand);color:var(--fi-brand);outline:none}
  .mt-tip>span{position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);z-index:120;width:300px;padding:10px 12px;border-radius:7px;background:#171a1f;color:#fff;font-size:.74rem;font-weight:500;line-height:1.45;text-align:left;white-space:normal;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;visibility:hidden;transition:opacity .15s;pointer-events:none}
  .mt-tip:hover>span,.mt-tip:focus>span{opacity:1;visibility:visible}
  @media print{.mt-tip{display:none}}
  .mt-exc{display:grid;grid-template-columns:auto 110px minmax(120px,1fr);gap:6px;align-items:center}
  .mt-exc input[type=checkbox]{width:16px;height:16px;accent-color:var(--fi-brand)}
  .mt-exc .mt-obs{text-align:left}
  /* ---------- Estratégia ---------- */
  .es-hero{display:grid;grid-template-columns:1.1fr .9fr;gap:12px}
  .es-org{display:grid;gap:14px;justify-items:center;padding:18px 12px 8px}
  .es-node{border:1px solid var(--fi-line);border-radius:10px;background:var(--fi-surface);padding:12px 14px;text-align:center;box-shadow:var(--fi-shadow)}
  .es-node b{display:block;font-size:.9rem}
  .es-node small{display:block;color:var(--fi-muted);font-size:.7rem;margin-top:3px;line-height:1.35}
  .es-sup{border-color:var(--fi-brand);border-width:2px;min-width:240px}
  .es-sup b{color:var(--fi-brand)}
  .es-link{width:2px;height:18px;background:var(--fi-line-strong)}
  .es-team{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%;padding-top:18px}
  .es-team::before{content:"";position:absolute;top:0;left:16.6%;right:16.6%;height:2px;background:var(--fi-line-strong)}
  .es-team>div{position:relative;display:grid;gap:8px}
  .es-team>div::before{content:"";position:absolute;top:-18px;left:50%;width:2px;height:18px;background:var(--fi-line-strong)}
  .es-cart{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;padding:8px;border:1px dashed var(--fi-line-strong);border-radius:8px;background:var(--fi-surface-alt)}
  .es-cart i{width:16px;height:16px;border-radius:50%;background:color-mix(in srgb,var(--fi-info) 22%,var(--fi-surface));border:1px solid color-mix(in srgb,var(--fi-info) 45%,transparent)}
  .es-cart span{width:100%;text-align:center;font-size:.64rem;color:var(--fi-muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
  .es-band{margin-top:4px;width:100%;text-align:center;font-size:.72rem;font-weight:700;color:var(--fi-brand);padding:8px;border-radius:8px;background:var(--fi-brand-soft,color-mix(in srgb,var(--fi-brand) 8%,transparent))}
  .es-cmp{width:100%;border-collapse:collapse;font-size:.78rem}
  .es-cmp th,.es-cmp td{padding:10px 12px;border-bottom:1px solid var(--fi-line);text-align:left;vertical-align:top}
  .es-cmp thead th{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--fi-muted)}
  .es-cmp thead th:nth-child(3){color:var(--fi-brand)}
  .es-cmp tbody th{color:var(--fi-muted);font-weight:700;width:30%}
  .es-yes{color:var(--fi-success);font-weight:750}.es-no{color:var(--fi-danger);font-weight:750}
  .es-rules{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
  .es-rule{position:relative;padding:16px 14px 14px;border:1px solid var(--fi-line);border-radius:10px;background:var(--fi-surface);box-shadow:var(--fi-shadow);display:grid;gap:6px;align-content:start}
  .es-rule .es-n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--mt-c1);color:var(--fi-surface);font-weight:800;font-size:.8rem}
  .es-rule h3{margin:2px 0 0;font-size:.86rem}
  .es-rule p{margin:0;color:var(--fi-muted);font-size:.76rem;line-height:1.45}
  .es-tag{justify-self:start;font-size:.62rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--fi-surface-alt);color:var(--fi-muted)}
  .es-flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;align-items:stretch}
  .es-step{position:relative;padding:12px 18px 12px 14px;border:1px solid var(--fi-line);background:var(--fi-surface);font-size:.76rem;display:grid;gap:4px}
  .es-step:not(:last-child)::after{content:"";position:absolute;right:-9px;top:50%;width:16px;height:16px;transform:translateY(-50%) rotate(45deg);background:var(--fi-surface);border-top:1px solid var(--fi-line);border-right:1px solid var(--fi-line);z-index:1}
  .es-step:first-child{border-radius:8px 0 0 8px}.es-step:last-child{border-radius:0 8px 8px 0}
  .es-step b{font-size:.8rem}.es-step span{color:var(--fi-muted)}
  .es-step.es-hl{background:color-mix(in srgb,var(--fi-success) 8%,var(--fi-surface))}
  .es-step.es-hl::after{background:color-mix(in srgb,var(--fi-success) 8%,var(--fi-surface))}
  .es-tl{position:relative;display:grid;grid-template-columns:1fr 1fr;margin-top:26px}
  .es-tl>div{padding:12px 14px;font-size:.76rem}
  .es-tl>div:first-child{background:color-mix(in srgb,var(--fi-info) 10%,var(--fi-surface));border-radius:8px 0 0 8px}

   Mês com meta ou realizado faltando em algum vendedor da equipe fica nulo ("Aguardando dados"). */
function consolidar(mod, x) {
  const r = consolidarEq(equipeDe(mod, x), basesDe(mod)[0] || null);
  const ms = metaSetores(mod, x);
  if (ms) { r.metas = ms; r.metaSetores = true; }
  return r;
}
/* Supervisão por setores (equipe = todos): a meta já nasce como a soma das metas dos setores (ADM › Distribuição) */
function metaSetores(mod, x) {
  const sets = (mod && mod.setores) || [];
  if (!sets.length || (x && (x.equipe || []).length)) return null;
  const d = (S.dist || []).find(z => z.ano === mod.ano);
  if (!d) return null;
  const arrs = sets.map(k => Array.isArray(d['meses_' + k]) && d['meses_' + k].length === 12 ? d['meses_' + k].map(Number) : null);
  if (arrs.some(a => !a)) return null;
  return Array.from({ length: 12 }, (_, i) => Math.round(sum(arrs.map(a => a[i] || 0)) * 100) / 100);
}
function consolidarEq(eq, base) {
  const metas = [], real = [];
  for (let i = 0; i < 12; i++) {
    if (!eq.length) { metas.push(null); real.push(null); continue; }
    const ms = eq.map(z => valorMeta(z.metas[i])).filter(v => v != null);
    metas.push(ms.length ? sum(ms) : null);
    const rs = eq.map(z => realDe((z.baseMod || base).id, z.vendedor_id)[i]);
    real.push(rs.some(v => v == null) ? null : sum(rs));
  }
  return { metas, realSup: real, equipeV: eq, baseMod: base };
}
function realPart(m, x) { return ehSup(m) || ehLider(x) ? (x.realSup || Array(12).fill(null)) : realDe(m.id, x.vendedor_id); }
/* cada papel pode ter sua própria tabela de premiação no módulo */
function tabelaDe(m, x) {
  if (ehEsp(m)) return tabelaModulo(m);
  const fp = (x && ehLider(x) && (m.faixas_papel || {})[x.papel]) || null;
  if (fp && Array.isArray(fp.faixas) && fp.faixas.length) return regraDe(m, fp, x.papel === 'gerente' ? t('Faixas da Supervisão 1') : t('Faixas da Supervisão 2'));
  return tabelaModulo(m);
}
function calcVinc(mod, x, ate) {
  if (ehEsp(mod)) {   // fora do período da meta especial não há meta, venda nem prêmio
    const dentro = i => noPer(mod, i + 1);
    return calcular(tabelaDe(mod, x), (x.metas || []).map((v, i) => dentro(i) ? v : null), (x.premios || []).map((v, i) => dentro(i) ? v : 0), realPart(mod, x).map((v, i) => dentro(i) ? v : null), ate);
  }
  return calcular(tabelaDe(mod, x), x.metas, x.premios, realPart(mod, x), ate);
}
/* prêmio-base padrão do módulo nos meses do período (para quem entra no módulo) */
const premiosPadrao = m => Array.from({ length: 12 }, (_, i) => noPer(m, i + 1) ? Number(m.premio_base) || 0 : 0);
function meusVendedores() { return S.vendedores.filter(v => v.email === S.email); }

async function carregar() {
  const sb = S.sb;
  const [reg, ven, tab, mod, mv, rea, fec] = await Promise.all([
    Promise.resolve([]),
    q(sb.from('met_vendedores').select('*').order('nome')),
    q(sb.from('met_tabelas').select('*').order('nome')),
    q(sb.from('met_modulos').select('*').order('ano', { ascending: false }).order('nome')),
    q(sb.from('met_modulo_vendedores').select('*')),
    q(sb.from('met_realizado').select('*')),
    q(sb.from('met_fechamentos').select('*'))
  ]);
  { try { S.dist = await q(sb.from('met_distribuicao').select('*')) || []; } catch (_) { S.dist = []; } }
  const ordMod = (a, b) => ((a.ordem == null ? 1e9 : a.ordem) - (b.ordem == null ? 1e9 : b.ordem)) || (b.ano - a.ano) || String(a.nome).localeCompare(String(b.nome), 'pt-BR');
  Object.assign(S, { regioes: reg || [], vendedores: ven || [], tabelas: tab || [], modulos: (mod || []).slice().sort(ordMod),
                     mv: mv || [], realizado: rea || [], fechamentos: fec || [] });
  if (S.admin) { try { S.contas = await q(sb.rpc('met_contas_central')); } catch (_) { S.contas = null; } }
  try { S.vis = await q(sb.from('met_visibilidade').select('*')) || []; } catch (_) { S.vis = []; }
  try {
    const tx = await q(sb.from('met_textos').select('*')) || [];
    Object.keys(TXT).forEach(k => delete TXT[k]);
    tx.forEach(r => { TXT[r.lang + '|' + r.chave] = r.texto; });
    S.txtUlt = tx.reduce((a, r) => !a || r.atualizado_em > a.atualizado_em ? r : a, null);
  } catch (_) { /* tabela ainda não criada: segue com os textos padrão */ }
}

/* ------------------------------ modal ------------------------------ */
function modal({ titulo, corpo, botoes, largura, alvo, aoFechar }) {
  const el = document.createElement('div');
  el.className = alvo ? 'mt-inline' : 'mt-modal';
  el.innerHTML = `<section class="${alvo ? '' : 'mt-modal__panel'}" role="${alvo ? 'region' : 'dialog'}" ${alvo ? '' : 'aria-modal="true"'} style="${largura && !alvo ? 'width:min(' + largura + 'px,100%)' : ''}">
    <div class="mt-modal__head"><span>${esc(titulo)}</span><span class="mt-sp"></span>
      <button class="fi-icon-btn" data-x aria-label="${t('Fechar')}">✕</button></div>
    <div class="mt-modal__body">${corpo}</div>
    <div class="mt-modal__foot"></div></section>`;
  const foot = $('.mt-modal__foot', el);
  const fechar = () => { el.remove(); if (aoFechar) aoFechar(); };
  (botoes || []).forEach(b => {
    const bt = document.createElement('button');
    bt.className = 'fi-btn' + (b.primario ? ' fi-btn--primary' : '') + (b.perigo ? ' fi-btn--danger' : '');
    bt.textContent = b.texto;
    if (b.esquerda) bt.style.marginRight = 'auto';
    bt.addEventListener('click', async () => {
      if (!b.acao) return fechar();
      bt.disabled = true;
      try { const r = await b.acao(el); if (r !== false) fechar(); }
      catch (e) { notify(erroMsg(e), 'danger'); }
      finally { bt.disabled = false; }
    });
    foot.appendChild(bt);
  });
  $('[data-x]', el).addEventListener('click', fechar);
  el.addEventListener('keydown', e => { if (e.key === 'Escape') fechar(); });
  if (alvo) { alvo.innerHTML = ''; alvo.appendChild(el); } else $('#modal-root').appendChild(el);
  const f = $('input,select,textarea', el); if (f) f.focus({ preventScroll: !!alvo });
  return el;
}

/* painel da equipe de um módulo de supervisão: todos os vendedores reunidos */
function painelEquipe(m, ate) {
  const eq = equipeUniao(m);
  if (!eq.length) return '';
  const cs = eq.map(z => ({ z, c: calcVinc(z.baseMod, z, ate) }));

    <div class="mt-pgrid mt-mt">${cs.map(({ z, c }) => cardPessoa(z.baseMod, z, c, ate)).join('')}</div>`;

function ligaCards(raiz) {

/* totais da equipe (sem repetir vendedor) — evita somar a mesma equipe duas vezes com Supervisão 1 e 2 */
function totaisEquipe(m, ate) {

}
/* Início: cada card mostra meta × realizado do mês escolhido (padrão: mês atual) ou de jan. até o mês atual */
const MES_ATUAL = HOJE.getMonth() + 1;
const ateAtual = ano => ano < HOJE.getFullYear() ? 12 : ano > HOJE.getFullYear() ? 0 : MES_ATUAL;
function resumoPer(m, x, sel) {

  const mm = calcVinc(m, x, 12).meses[sel - 1];
  return { meta: mm.meta, real: mm.real };

const atDe = r => r.meta > 0 && r.real != null ? r.real / r.meta : null;
const brlC = v => new Intl.NumberFormat(LOC(), { notation: 'compact', maximumFractionDigits: 1 }).format(Number(v) || 0);

/* ========================== DETALHE DO MÓDULO ========================== */
function vModulo(id, mesSel, regSel) {
  const m = byId(S.modulos, id);
  if (!m) { location.hash = '#/inicio'; return; }
  const tb = tabelaModulo(m), fech = fechadosDe(m.id);
  const mes = mesSel || Math.max(ultimoFechado(m.id), mesPadrao(m.ano));
  let vinc = vincDe(m.id).filter(x => S.veTudo || x.v.email === S.email);
  setHead(m.ano + ' · ' + (ehSup(m) ? t('Meta de supervisão') : t('Meta de vendedor')), m.nome,
    (m.descricao || ''),
    `<button class="fi-btn" id="bt-voltar">${t('← Módulos')}</button>
     <button class="fi-btn" id="bt-xls">${t('Exportar Excel')}</button>
     ${S.admin ? `<button class="fi-btn fi-btn--primary" id="bt-fechar">${t('Fechamento')}</button>` : ''}`);

  const linhas = vinc.map(x => ({ x, c: calcVinc(m, x, mes) }));
  const tot = { meta: 0, metaOk: true, real: 0, premio: 0, rec: 0, total: 0, metaAte: 0, realAte: 0, totalAte: 0 };
  linhas.forEach(({ x, c }) => {
    const mm = c.meses[mes - 1], lid = ehLider(x) && linhas.some(l => !ehLider(l.x));
    if (!lid) { if (mm.meta == null) tot.metaOk = false; else tot.meta += mm.meta; tot.real += mm.real || 0; tot.metaAte += c.metaAte; tot.realAte += c.realAte; }
    tot.premio += mm.premio; tot.rec += mm.pagoTri + mm.pagoAno; tot.total += mm.total; tot.totalAte += c.totalAte;
  });
  if (ehSup(m) && S.veTudo && !regSel) {
    const eq = equipeUniao(m).map(z => calcVinc(z.baseMod, z, mes)), mm = eq.map(c => c.meses[mes - 1]);
    tot.metaOk = eq.length > 0 && mm.every(z => z.meta != null); tot.meta = sum(mm.map(z => z.meta || 0)); tot.real = sum(mm.map(z => z.real || 0));
    tot.metaAte = sum(eq.map(c => c.metaAte)); tot.realAte = sum(eq.map(c => c.realAte));
  }
  const metaMes = tot.metaOk && linhas.length ? tot.meta : null;
  const mesesOpt = Array.from({ length: 12 }, (_, i) => `<option value="${i + 1}" ${i + 1 === mes ? 'selected' : ''}>${MESL(i)}${fech.has(i + 1) ? ' · ' + t('fechado') : ''}</option>`).join('');

  let html = `
  <div class="fi-card mt-noprint"><div class="fi-card__body fi-filters">

    <div class="mt-sp"></div>
    <div class="mt-small mt-muted">${fech.has(mes) ? t('🔒 Mês fechado — valores congelados') : t('Mês aberto — valores ainda podem mudar')}</div>
  </div></div>

  <div class="fi-grid fi-grid--4 mt-mt">
    <div class="fi-card fi-metric fi-metric--brand"><div class="fi-metric__top"><span>${t('Meta {m}', { m: MES(mes - 1) })}</span></div><div class="fi-metric__value">${metaMes == null ? WAIT() : brl0(metaMes)}</div><div class="fi-metric__foot">${t('Realizado {v}', { v: brl0(tot.real) })}</div></div>
    <div class="fi-card fi-metric"><div class="fi-metric__top"><span>${t('Atingido no mês')}</span></div><div class="fi-metric__value">${pct(metaMes ? tot.real / metaMes : null)}</div><div class="fi-progress"><span style="width:${Math.min(100, metaMes ? tot.real / metaMes * 100 : 0)}%"></span></div></div>
    <div class="fi-card fi-metric"><div class="fi-metric__top"><span>${t('Acumulado até {m}', { m: MES(mes - 1) })}</span></div><div class="fi-metric__value">${pct(tot.metaAte ? tot.realAte / tot.metaAte : null)}</div><div class="fi-metric__foot">${t('{a} de {b}', { a: brl0(tot.realAte), b: brl0(tot.metaAte) })}</div></div>
    <div class="fi-card fi-metric"><div class="fi-metric__top"><span>${t('Premiação do mês')}</span></div><div class="fi-metric__value">${brl0(tot.total)}</div><div class="fi-metric__foot">${t('acumulado {v}', { v: brl0(tot.totalAte) })}</div></div>
  </div>`;

  html += `<section class="fi-card mt-mt2"><div class="fi-card__head"><div><div class="fi-card__title">${t('Vendedores — {m}/{a}', { m: MESL(mes - 1), a: m.ano })}</div>
    <div class="fi-card__note">${t('Prêmio = prêmio-base × % da faixa. Recuperações são pagas no fechamento de Mar/Jun/Set/Dez (trimestre) e Dez (ano).')}</div></div></div>
    <div class="fi-table-wrap" style="border:0;border-radius:0"><table class="fi-table" id="tb-mod"><thead><tr>
      <th>${ehSup(m) ? t('Supervisor') : t('Vendedor')}</th><th class="mt-num">${t('Meta')}</th><th class="mt-num">${t('Realizado')}</th><th class="mt-num">${t('Atingido')}</th><th>${t('Faixa')}</th>
      <th class="mt-num">${t('Prêmio-base')}</th><th class="mt-num">${t('Prêmio mês')}</th><th class="mt-num">${t('Recuperação')}</th><th class="mt-num">${t('Total mês')}</th>
      <th class="mt-num">${t('Acum. %')}</th><th class="mt-num">${t('Acum. prêmio')}</th><th class="mt-num">${t('Comissão equiv.')}</th></tr></thead><tbody>`;
  if (!linhas.length) html += `<tr><td colspan="13"><div class="fi-empty">${t('Nenhum vendedor atrelado.')}</div></td></tr>`;
  linhas.forEach(({ x, c }) => {
    const mm = c.meses[mes - 1];
    const eq = mm.real && mm.total ? mm.total / mm.real : null;
    html += `<tr data-vend="${x.vendedor_id}" style="cursor:pointer">
      <td class="mt-strong">${esc(x.v.nome)}${papelBadge(x)}</td>
      <td class="mt-num">${brlOuWait(mm.meta)}</td><td class="mt-num">${mm.real == null ? '<span class="mt-muted">—</span>' : brl(mm.real)}${(() => { const i = infoMes(m, x, mm.mes); return i.excluir && i.excluido ? `<div class="mt-small mt-neg" title="${esc(i.obs || '')}">${esc(t('− {v} excluídos', { v: brl0(i.excluido) }))}</div>` : ''; })()}</td>
      <td class="mt-num">${pct(mm.ating)}</td><td><span class="mt-pill ${classeMult(mm.mult)}">${mm.apurado ? multTxt(mm.mult) : '—'}</span></td>
      <td class="mt-num">${brl(mm.base)}</td><td class="mt-num">${brl(mm.premio)}</td>
      <td class="mt-num ${mm.pagoTri + mm.pagoAno ? 'mt-pos mt-strong' : ''}">${brl(mm.pagoTri + mm.pagoAno)}</td>
      <td class="mt-num mt-strong">${brl(mm.total)}</td>
      <td class="mt-num">${pct(c.atingAte)}</td><td class="mt-num">${brl(c.totalAte)}</td>
      <td class="mt-num">${pct(eq, 2)}</td></tr>`;
  });
  html += `</tbody>${linhas.length > 1 ? `<tfoot><tr><td colspan="2">${t('Total')}</td><td class="mt-num">${brlOuWait(metaMes)}</td><td class="mt-num">${brl(tot.real)}</td>
    <td class="mt-num">${pct(metaMes ? tot.real / metaMes : null)}</td><td></td><td></td><td class="mt-num">${brl(tot.premio)}</td>
    <td class="mt-num">${brl(tot.rec)}</td><td class="mt-num">${brl(tot.total)}</td><td class="mt-num">${pct(tot.metaAte ? tot.realAte / tot.metaAte : null)}</td>
    <td class="mt-num">${brl(tot.totalAte)}</td><td></td></tr></tfoot>` : ''}</table></div>
    <div class="fi-card__foot">${t('Clique num vendedor para ver os 12 meses, os trimestres e a faixa de comissão equivalente.')}</div></section>`;

  if (ehSup(m)) html += `<section class="fi-card mt-mt2"><div class="fi-card__body">${painelEquipe(m, mes) || `<div class="mt-muted">${t('Nenhum vendedor na equipe.')}</div>`}</div></section>`;
  html += regraHtml(tb);
  $('#view').innerHTML = html;
  ligaCards($('#view'));

  $('#f-mes').addEventListener('change', e => vModulo(id, Number(e.target.value), regSel));
  $('#bt-voltar').addEventListener('click', () => { location.hash = '#/inicio'; });
  $('#bt-xls').addEventListener('click', () => exportarModulo(m, mes, linhas));
  const bf = $('#bt-fechar'); if (bf) bf.addEventListener('click', () => { S.fechModulo = m.id; S.fechMes = mes; location.hash = '#/adm/fechamento'; });
  $$('#tb-mod tr[data-vend]').forEach(tr => tr.addEventListener('click', () => {
    modalVendedorAno(m, vincDe(m.id).find(v => v.vendedor_id === tr.dataset.vend), mes);
  }));
}

function multPct(x) { return multTxt(x.mult); }
function regraHtml(tb) {
  if (!tb) return '';
  if (ehComissao(tb)) {
    const cs = comissoesOrd(tb);
    return `<section class="fi-card mt-mt2"><div class="fi-card__head"><div class="fi-card__title">${esc(t('Regras de premiação'))}</div></div>

    <div><b>${t('Comissão sobre o total de vendas.')}</b> ${t('Cada mês paga o percentual sobre o realizado líquido (já sem as vendas excluídas), independentemente da meta.')}</div>
    ${cs.map(c => `<div>${c.min > 0 ? t('Vendas do mês a partir de {v} → comissão de {p} sobre o total.', { v: '<b>' + brl0(c.min) + '</b>', p: '<b>' + pctN(c.pct) + '%</b>' }) : t('Comissão de {p} sobre o total de vendas do mês.', { p: '<b>' + pctN(c.pct) + '%</b>' })}</div>`).join('')}
    <div class="mt-muted">${t('Na forma comissão não há recuperação trimestral nem anual; o prêmio-base não é usado.')}</div>
    ${tb.observacao ? `<div class="mt-muted">${esc(tb.observacao)}</div>` : ''}
    </div></div></section>`;
  }

    <div class="fi-card__body"><div class="mt-rule">
    ${f.map(x => `<div>${t('Atingiu {p} ou mais da meta do mês → recebe {m} do prêmio-base.', { p: '<b>' + num(x.min, x.min % 1 ? 1 : 0) + '%</b>', m: '<b>' + multPct(x) + '</b>' })}</div>`).join('')}
    <div>${t('Abaixo de {p} → sem premiação no mês.', { p: f.length ? num(f[0].min, 0) + '%' : '—' })}</div>
    ${tb.recup_tri ? `<div><b>${t('Recuperação trimestral:')}</b> ${t('o atingimento do trimestre (realizado ÷ meta do trimestre) é enquadrado nas mesmas faixas. Cada mês do trimestre passa a ter direito a prêmio-base × faixa do trimestre, e é paga só a diferença sobre o que o mês já recebeu (pago no fechamento do último mês do trimestre).')}</div>` : ''}
    ${tb.recup_anual ? `<div><b>${t('Recuperação anual:')}</b> ${t('mesma lógica com o atingimento do ano — cada mês recebe a diferença entre prêmio-base × faixa do ano e o que já recebeu, inclusive na recuperação trimestral (pago no fechamento de dezembro).')}</div>` : ''}
    ${tb.observacao ? `<div class="mt-muted">${esc(tb.observacao)}</div>` : ''}
    </div></div></section>`;
}

function statusTri(tq, html) {
  const sp = (cls, txt) => html ? `<span class="${cls}">${esc(txt)}</span>` : txt;
  if (tq.metaQ == null || tq.realQ == null) return html ? WAIT() : t('Aguardando dados');
  if (!tq.apurado) return sp('mt-muted', t('trimestre em andamento'));
  if (tq.recuperou) return sp('mt-pos', tq.valor ? t('Faixa do trimestre {f} — recuperou {v}', { f: multTxt(tq.multQ), v: brl(tq.valor) }) : t('Faixa do trimestre {f} (nada a recuperar)', { f: multTxt(tq.multQ) }));
  return sp('mt-muted', t('Não bateu a meta do trimestre'));
}
function tabelaAnoHtml(m, x, c) {
  const fech = fechadosDe(m.id);
  let h = `<div class="fi-table-wrap"><table class="fi-table"><thead><tr><th>${t('Mês')}</th><th class="mt-num">${t('Meta')}</th><th class="mt-num">${t('Realizado')}</th>
    <th class="mt-num">${t('Atingido')}</th><th>${t('Faixa')}</th><th class="mt-num">${t('Prêmio-base')}</th><th class="mt-num">${t('Prêmio')}</th>
    <th class="mt-num">${t('Rec. trimestre')}</th><th class="mt-num">${t('Rec. ano')}</th><th class="mt-num">${t('Total pago')}</th></tr></thead><tbody>`;
  c.meses.forEach(mm => {
    h += `<tr><td>${MES(mm.mes - 1)}${fech.has(mm.mes) ? `<span class="mt-lock" title="${t('Mês fechado')}">🔒</span>` : ''}</td>
      <td class="mt-num">${brlOuWait(mm.meta)}</td><td class="mt-num">${mm.real == null ? '<span class="mt-muted">—</span>' : brl(mm.real)}${(() => { const i = infoMes(m, x, mm.mes); return i.excluir && i.excluido ? `<div class="mt-small mt-neg" title="${esc(i.obs || '')}">${esc(t('− {v} excluídos', { v: brl0(i.excluido) }))}</div>` : ''; })()}</td>
      <td class="mt-num">${pct(mm.ating)}</td><td><span class="mt-pill ${classeMult(mm.mult)}">${mm.apurado ? multTxt(mm.mult) : '—'}</span>${mm.recTri ? ` <span class="mt-small mt-pos" title="${t('Recuperado no trimestre')}">↺T</span>` : ''}${mm.recAno ? ` <span class="mt-small mt-pos" title="${t('Recuperado no ano')}">↺A</span>` : ''}</td>
      <td class="mt-num">${brl(mm.base)}</td><td class="mt-num">${brl(mm.premio)}</td>
      <td class="mt-num">${mm.pagoTri ? brl(mm.pagoTri) : ''}</td><td class="mt-num">${mm.pagoAno ? brl(mm.pagoAno) : ''}</td>
      <td class="mt-num mt-strong">${brl(mm.total)}</td></tr>`;
    if (mm.mes % 3 === 0) {
      const tq = c.tri[mm.mes / 3 - 1];
      const totQ = sum(c.meses.slice(mm.mes - 3, mm.mes).map(z => z.total));
      h += `<tr class="mt-sub"><td>${t('{q}º trimestre', { q: tq.q })}</td><td class="mt-num">${brlOuWait(tq.metaQ)}</td><td class="mt-num">${brlOuWait(tq.realQ)}</td>
        <td class="mt-num">${tq.atingQ == null ? WAIT() : pct(tq.atingQ)}</td>
        <td>${tq.recuperou ? `<span class="mt-pill ${classeMult(tq.multQ)}">${multTxt(tq.multQ)}</span>` : ''}</td>
        <td colspan="2">${statusTri(tq, true)}</td>
        <td class="mt-num ${tq.valor ? 'mt-pos' : ''}">${tq.valor ? brl(tq.valor) : ''}</td><td></td><td class="mt-num">${brl(totQ)}</td></tr>`;
    }
  });
  h += `</tbody><tfoot><tr><td>${t('Ano')}</td><td class="mt-num">${brlOuWait(c.ano.metaA)}</td><td class="mt-num">${brlOuWait(c.ano.realA)}</td><td class="mt-num">${c.ano.atingA == null ? WAIT() : pct(c.ano.atingA)}</td>
    <td colspan="2">${c.ano.metaA == null || c.ano.realA == null ? WAIT() : c.ano.apurado ? (c.ano.recuperou ? `<span class="mt-pos">${t('Faixa do ano {f}', { f: multTxt(c.ano.multA) })}</span>` : t('Não bateu o ano')) : `<span class="mt-muted">${t('ano em andamento')}</span>`}</td>
    <td class="mt-num">${brl(sum(c.meses.map(z => z.premio)))}</td><td class="mt-num">${brl(sum(c.tri.map(z => z.valor)))}</td>
    <td class="mt-num">${brl(c.ano.valor)}</td><td class="mt-num">${brl(sum(c.meses.map(z => z.total)))}</td></tr></tfoot></table></div>`;
  return h;
}
function comissaoHtml(m, x, mes) {
  const tb = tabelaDe(m, x);
  const meta = x.metas[mes - 1], base = Number(x.premios[mes - 1]) || 0;
  if (meta == null) return `<div class="fi-alert fi-alert--info">${t('Meta do mês não lançada')} — ${WAIT()}</div>`;
  const r = realPart(m, x)[mes - 1] || 0;
  return `<div class="mt-falta">${comissaoEquiv(tb, meta, base).map(e => `<div><span>${t('{p} da meta · paga {m}', { p: num(e.min, 0) + '%', m: multTxt(e.mult) })}</span>
      <b>${brl0(e.venda)}</b><div class="mt-small mt-muted">${t('prêmio {v} · comissão equiv. {p}', { v: brl(e.premio), p: '<b>' + pct(e.pct, 2) + '</b>' })}</div>
      ${r < e.venda ? `<div class="mt-small mt-warn">${t('faltam {v}', { v: brl0(e.venda - r) })}</div>` : `<div class="mt-small mt-pos">${t('✓ atingido')}</div>`}</div>`).join('')}</div>`;
}
/* Supervisão: desempenho de cada vendedor da equipe no mês */
function equipeHtml(m, x, mes) {
  if (!x.equipeV || !x.baseMod) return '';
  const linhas = (x.equipeV || []).map(z => {
    const meta = z.metas[mes - 1], real = realDe((z.baseMod || x.baseMod).id, z.vendedor_id)[mes - 1];
    const acM = sum(z.metas.slice(0, mes).map(v => v || 0)), acR = sum(realDe((z.baseMod || x.baseMod).id, z.vendedor_id).slice(0, mes).map(v => v || 0));
    return `<tr><td class="mt-strong">${esc(z.v.nome)}</td><td class="mt-num">${brlOuWait(meta)}</td><td class="mt-num">${real == null ? '<span class="mt-muted">—</span>' : brl(real)}</td>
      <td class="mt-num">${meta && real != null ? pct(real / meta) : '—'}</td><td class="mt-num">${acM ? pct(acR / acM) : '—'}</td></tr>`;
  }).join('');
  return `<div class="fi-eyebrow mt-mt2">${t('Equipe em {m}', { m: MESL(mes - 1) })}</div>
    <div class="fi-table-wrap"><table class="fi-table"><thead><tr><th>${t('Vendedor')}</th><th class="mt-num">${t('Meta')}</th><th class="mt-num">${t('Realizado')}</th><th class="mt-num">${t('Atingido')}</th><th class="mt-num">${t('Acum. %')}</th></tr></thead>
    <tbody>${linhas || `<tr><td colspan="5"><div class="fi-empty">${t('Nenhum vendedor na equipe.')}</div></td></tr>`}</tbody></table></div>`;
}
function modalVendedorAno(m, x, mes) {
  const c = calcVinc(m, x, Math.max(mes, ultimoFechado(m.id)));
  modal({ titulo: x.v.nome + ' — ' + m.nome, largura: 1040,
    corpo: `<div class="mt-small mt-muted">${t('Faixas de {m}: venda necessária, prêmio e o percentual de comissão que ele representa.', { m: MESL(mes - 1) })}</div>
      ${comissaoHtml(m, x, mes)}${tabelaAnoHtml(m, x, c)}${equipeHtml(m, x, mes)}`,
    botoes: [{ texto: t('Baixar PDF'), esquerda: true, acao: () => { pdfVendedor(m, x, Math.max(mes, ultimoFechado(m.id))); return false; } }, { texto: t('Fechar'), primario: true }] });
}

/* ============================== MEU PAINEL ============================== */
function vPainel() {
  const meus = meusVendedores();
  setHead(t('Meu painel'), S.nome || t('Meu painel'), t('Suas metas, atingimento e premiação. Você vê apenas os seus dados.'));
  if (!meus.length) {
    $('#view').innerHTML = `<div class="fi-card"><div class="fi-empty"><div><strong>${t('Seu e-mail não está cadastrado como vendedor.')}</strong>
      <p class="mt-small">${esc(t('Conta: {e}.', { e: S.email }))} ${S.admin ? t('Cadastre-se em ADM › Vendedores se também tiver metas.') : t('Peça à gestão comercial para cadastrá-lo com este e-mail.')}</p></div></div></div>`;
    return;
  }
  const ids = new Set(meus.map(v => v.id));
  const mods = S.modulos.filter(m => (m.visivel && m.ativo) || S.veTudo).filter(m => S.mv.some(x => x.modulo_id === m.id && ids.has(x.vendedor_id)));
  if (!mods.length) { $('#view').innerHTML = `<div class="fi-card"><div class="fi-empty"><div><strong>${t('Nenhum módulo de metas liberado para você ainda.')}</strong></div></div></div>`; return; }
  let html = '';
  mods.forEach(m => {
    const x = vincDe(m.id).find(z => ids.has(z.vendedor_id));
    const mes = Math.max(ultimoFechado(m.id), mesPadrao(m.ano));
    const c = calcVinc(m, x, mes), mm = c.meses[mes - 1];
    html += `<section class="fi-card mt-mt2"><div class="fi-card__head"><div><div class="fi-card__title">${esc(m.nome)}${String(m.nome).includes(String(m.ano)) ? '' : ' · ' + m.ano}</div>
      <div class="fi-card__note">${esc((tabelaModulo(m) || {}).nome || '')}</div></div>
      <button class="fi-btn mt-noprint" data-pdfv="${m.id}|${x.vendedor_id}|${mes}">${t('Baixar PDF')}</button></div>
      <div class="fi-card__body">
      <div class="fi-grid fi-grid--4">
        <div class="fi-card fi-metric fi-metric--brand"><div class="fi-metric__top"><span>${MESL(mes - 1)}</span><span class="mt-pill ${classeMult(mm.mult)}">${mm.apurado ? multTxt(mm.mult) : '—'}</span></div>
          <div class="fi-metric__value">${mm.meta == null ? WAIT() : pct(mm.ating)}</div><div class="fi-metric__foot">${mm.meta == null ? '' : t('{a} de {b}', { a: brl0(mm.real || 0), b: brl0(mm.meta) })}</div></div>
        <div class="fi-card fi-metric"><div class="fi-metric__top"><span>${t('Prêmio do mês')}</span></div><div class="fi-metric__value">${brl(mm.total)}</div><div class="fi-metric__foot">${t('base {v}', { v: brl(mm.base) })}</div></div>
        <div class="fi-card fi-metric"><div class="fi-metric__top"><span>${t('Acumulado no ano')}</span></div><div class="fi-metric__value">${pct(c.atingAte)}</div><div class="fi-metric__foot">${t('{a} de {b}', { a: brl0(c.realAte), b: brl0(c.metaAte) })}</div></div>
        <div class="fi-card fi-metric"><div class="fi-metric__top"><span>${t('Premiação acumulada')}</span></div><div class="fi-metric__value">${brl(c.totalAte)}</div><div class="fi-metric__foot">${t('potencial do ano (100%) {v}', { v: brl0(c.premioBaseAno) })}</div></div>
      </div>
      <div class="fi-eyebrow mt-mt2">${t('Quanto falta em {m}', { m: MESL(mes - 1) })}</div>
      ${comissaoHtml(m, x, mes)}
      <div class="mt-mt2">${tabelaAnoHtml(m, x, c)}</div>${equipeHtml(m, x, mes)}
      </div></section>`;
    html += regraHtml(tabelaModulo(m));
  });
  $('#view').innerHTML = html;
  $$('[data-pdfv]').forEach(b => b.onclick = () => {
    const [mid, vid, mes] = b.dataset.pdfv.split('|'), m = byId(S.modulos, mid);
    const v = byId(S.vendedores, vid); if (v) pdfPessoas([v], m.ano, Number(mes));
  });
}

/* ---------------------------- Distribuição do planejamento anual ---------------------------- */
/* Planejamento = Bordados + Industrial + Subsídio (vendas da diretoria).
   Bordados e Industrial dividem o que sobra do planejamento depois do subsídio:
   mexeu em um, o outro se ajusta para a soma continuar fechando. */
const SETORES = [['bordados', 'Bordados'], ['industrial', 'Industrial']];
function aDistribuicao() {
  const anos = [...new Set([HOJE.getFullYear(), HOJE.getFullYear() + 1, ...S.modulos.map(m => m.ano), ...S.dist.map(d => d.ano)])].sort((a, b) => b - a);
  if (!S.distAno) S.distAno = HOJE.getFullYear() + (HOJE.getMonth() >= 9 ? 1 : 0);
  if (!S.distSetor) S.distSetor = 'bordados';
  const ano = S.distAno;
  const salvo = S.dist.find(d => d.ano === ano);
  const st = salvo ? { planejamento: +salvo.planejamento, bordados: +salvo.bordados, industrial: +salvo.industrial, subsidio: +salvo.subsidio, observacao: salvo.observacao || '' }
                   : { planejamento: 0, bordados: 0, industrial: 0, subsidio: 0, observacao: '' };
  /* valores mensais em centavos (inteiros) para as somas fecharem exatas */
  const C = v => Math.round((Number(v) || 0) * 100);
  /* qt = valor de cada trimestre; mes = valor de cada mês. fix = trimestres travados; fixM = meses travados */
  const mes = {}, fix = {}, fixM = {}, qt = {};
  const qv = (k, q) => qt[k][q];
  const somaMes = (k, q) => mes[k][q * 3] + mes[k][q * 3 + 1] + mes[k][q * 3 + 2];
  const fixos = (k) => [0, 1, 2, 3].filter(q => fix[k][q]);
  const livres = (k) => [0, 1, 2, 3].filter(q => !fix[k][q]);
  const saldoDe = k => C(st[k]) - sum(qt[k]);
  const saldoQ = (k, q) => qt[k][q] - somaMes(k, q);
  /* meses soltos do trimestre recebem a diferença para completar o valor do trimestre */
  const completaMes = (k, q) => {
    const ids = [0, 1, 2].map(j => q * 3 + j), lv = ids.filter(i => !fixM[k][i]); if (!lv.length) return;
    const resto = qt[k][q] - sum(ids.filter(i => fixM[k][i]).map(i => mes[k][i]));
    const pesos = lv.map(i => mes[k][i]), rep = reparteCents(Math.max(0, resto), sum(pesos) > 0 ? pesos : lv.map(() => 1));
    lv.forEach((i, j) => { mes[k][i] = rep[j]; });
  };
  const poeTri = (k, q, cents) => { qt[k][q] = Math.max(0, cents); completaMes(k, q); };
  const saldoMesesDe = k => [0, 1, 2, 3].reduce((a, q) => a + Math.abs(saldoQ(k, q)), 0);
  /* os trimestres não fixados recebem a diferença para completar a meta do setor */

  I('d-industrial').addEventListener('input', () => { st.industrial = Math.min(ler(I('d-industrial')), resto()); st.bordados = Math.round((resto() - st.industrial) * 100) / 100; mudouSetores(); marca(); render(); });
  I('d-slider').addEventListener('input', () => { reparte(Number(I('d-slider').value) / 1000); mudouSetores(); marca(); render(); });
  // trimestre: valor independente (campo ou barra) — a diferença aparece no saldo
  $$('[data-q]').forEach(el => el.addEventListener('input', () => { const k = S.distSetor, q = Number(el.dataset.q); if (fix[k][q]) return; poeTri(k, q, C(ler(el))); marca(); render(); }));
  $$('[data-qr]').forEach(el => el.addEventListener('input', () => {

  $$('[data-mi]').forEach(el => el.addEventListener('input', () => { const k = S.distSetor, i = Number(el.dataset.mi); if (fixM[k][i]) return; mes[k][i] = C(ler(el)); marca(); render(); }));
  $$('[data-mr]').forEach(el => el.addEventListener('input', () => {

  $$('[data-setor]').forEach(b => b.onclick = () => { S.distSetor = b.dataset.setor; $$('[data-setor]').forEach(z => z.setAttribute('aria-selected', String(z === b))); render(); });
  I('d-igual').onclick = () => {
    const k = S.distSetor, lv = livres(k); if (!lv.length) { notify(t('Todos os trimestres estão fixados. Solte um para redistribuir.'), 'warning'); return; }
    const rep = reparteCents(Math.max(0, C(st[k]) - sum(fixos(k).map(q => qv(k, q)))), lv.map(() => 1));
    lv.forEach((q, j) => { qt[k][q] = rep[j]; const ids = [0, 1, 2].map(z => q * 3 + z), lm = ids.filter(i => !fixM[k][i]);

      meses_bordados: mes.bordados.map(v => v / 100), meses_industrial: mes.industrial.map(v => v / 100),

  };
  render();

/* divide totalC (centavos) proporcionalmente aos pesos; soma exata (sobras vão para as maiores frações) */
function reparteCents(totalC, pesos) {
  const n = pesos.length, s = sum(pesos.map(p => Math.max(0, p)));
  const base = s > 0 ? pesos.map(p => Math.max(0, p) / s) : Array(n).fill(1 / n);
  const out = base.map(b => Math.floor(totalC * b));
  let resto = totalC - sum(out);
  const ordem = base.map((b, i) => [totalC * b - out[i], i]).sort((a, b) => b[0] - a[0]);
  for (let k = 0; resto > 0; k = (k + 1) % n) { out[ordem[k][1]]++; resto--; }
  return out;
}

function faixasEditorHtml(pref, cfg) {
  const fx = (cfg && Array.isArray(cfg.faixas) && cfg.faixas.length ? cfg.faixas : FAIXAS_PADRAO).map(f => ({ min: Number(f.min), mult: Number(f.mult) })).sort((a, b) => a.min - b.min);
  const linha = f => `<div class="mt-faixa" data-fx="${pref}">
      <label class="fi-field"><span class="fi-label">${t('Atingimento mínimo (%)')}</span><input class="fi-input" data-min value="${num(f.min, f.min % 1 ? 1 : 0)}"></label>
      <label class="fi-field"><span class="fi-label">${t('Paga do prêmio-base (%)')}</span><input class="fi-input" data-mult value="${num(f.mult * 100, 0)}"></label>
      <div class="fi-field"><span class="fi-label">${t('Equivale a')}</span><div class="mt-small mt-muted" data-eq style="min-height:38px;display:flex;align-items:center"></div></div>
      <button type="button" class="fi-icon-btn" data-rmfx title="${t('Remover faixa')}">✕</button></div>`;
  return `<div id="${pref}-lista" style="display:grid;gap:8px">${fx.map(linha).join('')}</div>
    <div style="margin-top:8px"><button type="button" class="fi-btn" id="${pref}-add">${t('+ Faixa')}</button></div>
    <label class="mt-check" style="margin-top:8px"><input type="checkbox" id="${pref}-tri" ${!cfg || cfg.recup_tri !== false ? 'checked' : ''}> ${t('Recuperação trimestral — a faixa atingida no trimestre vale para os 3 meses, descontando o que cada mês já recebeu')}</label>
    <label class="mt-check"><input type="checkbox" id="${pref}-ano" ${!cfg || cfg.recup_anual !== false ? 'checked' : ''}> ${t('Recuperação anual — a faixa atingida no ano vale para os 12 meses, descontando o que cada mês já recebeu')}</label>`;
}
function faixasEditorLiga(el, pref) {
  const atual = () => $$(`[data-fx="${pref}"]`, el).forEach(r => {
    const mi = parseNum($('[data-min]', r).value), mu = (parseNum($('[data-mult]', r).value) || 0) / 100;
    $('[data-eq]', r).textContent = mi ? t('paga {m} do prêmio-base', { m: multTxt(mu) }) : '';
  });
  const liga = () => { $$(`[data-fx="${pref}"] [data-rmfx]`, el).forEach(b => b.onclick = () => { b.closest('[data-fx]').remove(); }); $$(`#${pref}-lista input`, el).forEach(i => i.oninput = atual); atual(); };
  $(`#${pref}-add`, el).onclick = () => {
    const mins = $$(`[data-fx="${pref}"] [data-min]`, el).map(i => parseNum(i.value) || 0);
    const tmp = document.createElement('div'); tmp.innerHTML = faixasEditorHtml(pref, { faixas: [{ min: (mins.length ? Math.max(...mins) : 100) + 5, mult: 2 }] });
    $(`#${pref}-lista`, el).appendChild($('[data-fx]', tmp)); liga();
  };
  liga();
}
function faixasEditorLe(el, pref) {
  const faixas = $$(`[data-fx="${pref}"]`, el).map(r => ({ min: parseNum($('[data-min]', r).value), mult: (parseNum($('[data-mult]', r).value) || 0) / 100 }))

          <tr class="mt-distrow mt-saldorow"><td>${t('Saldo a distribuir')}</td>${COLS.map(c => `<td class="mt-num ${typeof c === 'number' ? '' : 'mt-qcol'}" data-sld="${c}"></td>`).join('')}<td></td></tr>` : ''}</tfoot>` : ''}</table></div>
    ${!sup && campo === 'metas' ? (distSetor ? `<div class="fi-card__body mt-row" style="border-top:1px solid var(--fi-line)"><button class="fi-btn" id="mm-dist" ${vinc.filter(x => !ehLider(x)).length ? '' : 'disabled'}>${t('Preencher pela distribuição')}</button>
        <span class="mt-small mt-muted">${t('Divide o valor de cada mês aberto da distribuição entre os vendedores, na proporção das metas atuais (ou em partes iguais). Depois é só ajustar e salvar.')}</span></div>`
      : `<div class="fi-card__body"><div class="fi-alert fi-alert--warning">${!m.setor ? t('Defina o setor em “Editar dados do módulo” para atrelar as metas à distribuição.') : esc(t('Ainda não há distribuição salva para {a} em ADM › Distribuição.', { a: m.ano }))}</div></div>`) : ''}
    <div class="fi-card__foot">${t('Meta em branco = ainda não lançada. Trimestre e ano são somados automaticamente quando todos os meses do período têm meta.')}</div></section>
  ${regraHtml(tb)}`;

  // grade
  const sujos = new Map(), btS = $('#mm-salvar');
  const valoresDe = x => Array.from({ length: 12 }, (_, i) => {
    if (!editavelX(x)) return (campo === 'metas' ? x.metas : x.premios)[i];
    return parseNum($(`#tb-metas .mt-in[data-v="${x.vendedor_id}"][data-m="${i + 1}"]`).value);
  });
  const somaPer = (arr, de, ate) => campo === 'metas' ? somaMetas(arr, de, ate) : sum(arr.slice(de - 1, ate));
  const per = c => c === 'A' ? [1, 12] : [Number(c.slice(1)) * 3 - 2, Number(c.slice(1)) * 3];
  const recalc = () => {
    const todos = vinc.map(valoresDe);
    if (!sup && campo === 'metas') {          // liderança acompanha ao vivo a soma dos vendedores
      const iv = vinc.map((x, k) => ehLider(x) ? null : k).filter(k => k != null);
      const somaV = Array.from({ length: 12 }, (_, i) => !iv.length || iv.some(k => todos[k][i] == null) ? null : sum(iv.map(k => todos[k][i])));
      vinc.forEach((x, k) => { if (!ehLider(x)) return; todos[k] = somaV; somaV.forEach((v, i) => { const c = $(`[data-ro="${x.vendedor_id}|${i + 1}"]`); if (c) c.innerHTML = brlOuWait(v); }); });
    }
    const paraTotal = (sup && campo === 'metas' && metaSetores(m, null)) ? [metaSetores(m, null)]
      : (sup && campo === 'metas') ? equipeUniao(m).map(z => Array.from({ length: 12 }, (_, i) => valorMeta((z.metas || [])[i])))  // supervisão: soma da equipe toda, sem duplicar
      : vinc.map((x, k) => (campo === 'metas' && ehLider(x) && vinc.some(z => !ehLider(z))) ? null : todos[k]).filter(Boolean);
    vinc.forEach((x, k) => COLS.filter(c => typeof c !== 'number').forEach(c => {
      const [a, b] = per(c); $(`[data-calc="${x.vendedor_id}|${c}"]`).innerHTML = brlOuWait(somaPer(todos[k], a, b));
    }));
    COLS.forEach(c => {
      const cel = $(`[data-tot="${c}"]`); if (!cel) return;

    if (distSetor) COLS.forEach(c => {
      const [a, b] = typeof c === 'number' ? [c, c] : per(c), idx = Array.from({ length: b - a + 1 }, (_, z) => a - 1 + z);
      const dv = sum(idx.map(i => distSetor[i])), ov = sum(idx.map(i => outrosMes[i]));
      const mv = sum(paraTotal.map(arr => sum(idx.map(i => valorMeta(arr[i]) || 0))));
      const sd = Math.round((dv - ov - mv) * 100) / 100;
      const set = (sel, v) => { const e = $(`[${sel}="${c}"]`); if (e) e.innerHTML = v; };
      set('data-dist', brl(dv)); set('data-out', brl(ov));
      set('data-sld', Math.abs(sd) < 0.01 ? '<span class="mt-sok">✓</span>' : `<span class="${sd > 0 ? 'mt-spos' : 'mt-sneg'}">${sd > 0 ? '+' : '−'}${brl(Math.abs(sd))}</span>`);
    });
  };
  $$('#tb-metas .mt-in').forEach(i => {
    i.addEventListener('input', () => {
      const v = i.value.trim() === '' ? null : parseNum(i.value);
      const k = i.dataset.v + '|' + i.dataset.m, o = i.dataset.orig === '' ? null : Number(i.dataset.orig);
      if (v === o) { sujos.delete(k); i.classList.remove('mt-dirty'); } else { sujos.set(k, v); i.classList.add('mt-dirty'); }
      btS.disabled = !sujos.size; btS.textContent = sujos.size ? t('Salvar alterações ({n})', { n: sujos.size }) : t('Salvar alterações');
      recalc();
    });
    i.addEventListener('blur', () => { const v = parseNum(i.value); if (v != null) i.value = num(v); });
    i.addEventListener('keydown', e => { if (e.key === 'Enter') { const all = $$('#tb-metas .mt-in:not(:disabled)'); const n = all[all.indexOf(i) + 1]; if (n) n.focus(); } });
  });
  const descartaOk = () => !sujos.size || window.confirm(t('Há alterações não salvas. Descartar?'));
  $$('[data-campo]').forEach(b => b.onclick = () => { if (b.dataset.campo === campo || !descartaOk()) return; S.metaCampo = b.dataset.campo; aModuloEditor(m); });
  btS.onclick = async () => {
    btS.disabled = true;
    try {
      const ids = new Set([...sujos.keys()].map(k => k.split('|')[0]));
      for (const vid of ids) {
        let arr = valoresDe(vinc.find(z => z.vendedor_id === vid));
        if (campo === 'premios') arr = arr.map(v => v || 0);
        await q(S.sb.from('met_modulo_vendedores').update({ [campo]: arr }).eq('modulo_id', m.id).eq('vendedor_id', vid));
      }
      await recarregar(t('Metas salvas'));
    } catch (e) { notify(erroMsg(e), 'danger'); btS.disabled = false; }
  };
  recalc();
  const btPB = $('#mm-pb');
  if (btPB) btPB.onclick = () => { $$('#tb-metas .mt-in:not(:disabled)').forEach(i => { i.value = num(Number(m.premio_base) || 0); i.dispatchEvent(new Event('input')); }); };
  const btD = $('#mm-dist');
  if (btD) btD.onclick = () => {
    const vend = vinc.filter(x => !ehLider(x)); let n = 0;
    for (let i = 0; i < 12; i++) {
      if (fech.has(i + 1)) continue;
      const alvo = Math.max(0, Math.round((distSetor[i] - outrosMes[i]) * 100));
      const atuais = vend.map(x => valorMeta(parseNum($(`#tb-metas .mt-in[data-v="${x.vendedor_id}"][data-m="${i + 1}"]`).value)) || 0);
      const rep = reparteCents(alvo, sum(atuais) > 0 ? atuais.map(v => Math.round(v * 100)) : vend.map(() => 1));
      vend.forEach((x, j) => { const inp = $(`#tb-metas .mt-in[data-v="${x.vendedor_id}"][data-m="${i + 1}"]`); if (!inp) return; inp.value = num(rep[j] / 100); inp.dispatchEvent(new Event('input')); n++; });
    }
    notify(t('Metas preenchidas pela distribuição — confira e salve.'), 'success');
  };

  // participantes
  const vincular = async ids => {
    if (!descartaOk()) return;
    try {
      await q(S.sb.from('met_modulo_vendedores').insert(ids.map(id => ({ modulo_id: m.id, vendedor_id: id,
        papel: sup ? ((byId(S.vendedores, id) || {}).funcao === 'gerente' ? 'gerente' : 'supervisor') : 'vendedor', equipe: [], premios: premiosPadrao(m) }))));
      await recarregar(ids.length > 1 ? t('{n} participantes atrelados', { n: ids.length }) : t('Participante atrelado'));
    } catch (e) { notify(erroMsg(e), 'danger'); }
  };
  $('#vv-bt').onclick = () => { const id = $('#vv-add').value; if (id) vincular([id]); };
  const bt = $('#vv-todos'); if (bt) bt.onclick = () => vincular(candidatos.map(v => v.id));
  $$('[data-rmv]').forEach(b => b.onclick = async () => {
    const x = vinc.find(z => z.vendedor_id === b.dataset.rmv);
    if (!await confirmar({ title: t('Remover do módulo'), message: t('Remove {n} deste módulo, com as metas dele. Lançamentos e fechamentos já gravados permanecem no banco.', { n: x.v.nome }), confirmText: t('Remover'), danger: true })) return;
    try { await q(S.sb.from('met_modulo_vendedores').delete().eq('modulo_id', m.id).eq('vendedor_id', x.vendedor_id)); await recarregar(); }
    catch (e) { notify(erroMsg(e), 'danger'); }
  });
  $$('[data-det]').forEach(a => a.onclick = e => { e.preventDefault(); editorMetas(m, vinc.find(z => z.vendedor_id === a.dataset.det)); });
  $$('[data-eqp]').forEach(b => b.onclick = () => editorEquipe(m, vinc.find(z => z.vendedor_id === b.dataset.eqp)));
  $('#me-dados').onclick = () => formModulo(m);
  $('#me-dup').onclick = () => duplicarModulo(m);
  $$('[data-fxp]').forEach(b => b.onclick = () => {
    const papel = b.dataset.fxp, fp = (m.faixas_papel || {})[papel] || { faixas: tabelaModulo(m).faixas, recup_tri: tabelaModulo(m).recup_tri, recup_anual: tabelaModulo(m).recup_anual };
    const el = modal({ titulo: papel === 'gerente' ? t('Faixas da Supervisão 1') : t('Faixas da Supervisão 2'), largura: 720, corpo: faixasEditorHtml('fxp', fp),
      botoes: [{ texto: t('Cancelar') }, { texto: t('Salvar'), primario: true, acao: async () => {
        const v = faixasEditorLe(el, 'fxp'); if (!v.faixas.length) { notify(t('Inclua ao menos uma faixa.'), 'warning'); return false; }
        await q(S.sb.from('met_modulos').update({ faixas_papel: Object.assign({}, m.faixas_papel || {}, { [papel]: v }) }).eq('id', m.id)); await recarregar(t('Faixas salvas')); } }] });
    faixasEditorLiga(el, 'fxp');
  });
  $$('[data-fxpx]').forEach(b => b.onclick = async () => {
    const fp = Object.assign({}, m.faixas_papel || {}); delete fp[b.dataset.fxpx];
    try { await q(S.sb.from('met_modulos').update({ faixas_papel: fp }).eq('id', m.id)); await recarregar(t('Faixas salvas')); } catch (e) { notify(erroMsg(e), 'danger'); }
  });
  ['supervisor', 'gerente'].forEach(papel => {
    const sel = $('#ld-' + papel); if (!sel) return;
    sel.onchange = async () => {

      const atual = vinc.find(x => x.papel === papel), novo = sel.value || null;
      if (novo && vinc.some(x => x.vendedor_id === novo && x.papel !== papel)) { notify(t('Esta pessoa já participa do módulo com outro papel.'), 'warning'); sel.value = atual ? atual.vendedor_id : ''; return; }
      try {
        if (atual) await q(S.sb.from('met_modulo_vendedores').delete().eq('modulo_id', m.id).eq('vendedor_id', atual.vendedor_id));
        if (novo) await q(S.sb.from('met_modulo_vendedores').insert({ modulo_id: m.id, vendedor_id: novo, papel, premios: atual ? atual.premios : Array(12).fill(0) }));
        await recarregar(novo ? t('{p} definida', { p: t(papel === 'supervisor' ? 'Supervisão 2' : 'Supervisão 1') }) : t('{p} removida', { p: t(papel === 'supervisor' ? 'Supervisão 2' : 'Supervisão 1') }));
      } catch (e) { notify(erroMsg(e), 'danger'); await recarregar(); }
    };
  });
  $('#me-fech').onclick = () => { S.fechModulo = m.id; S.fechMes = null; location.hash = '#/adm/fechamento'; };
  $('#me-vis').onchange = async e => {
    try { await q(S.sb.from('met_modulos').update({ visivel: e.target.checked }).eq('id', m.id)); await recarregar(e.target.checked ? t('Visualização liberada aos vendedores') : t('Módulo ocultado dos vendedores')); }
    catch (er) { notify(erroMsg(er), 'danger'); e.target.checked = !e.target.checked; }
  };
}

/* Duplicar meta: cria um espelho do módulo (dados, participantes, metas e prêmios) para depois alterar.
   Lançamentos e fechamentos não são copiados; a cópia nasce oculta para os vendedores. */
function duplicarModulo(m) {
  const n = vincDe(m.id).length;
  modal({ titulo: t('Duplicar meta — {n}', { n: m.nome }),
    corpo: `<div class="mt-help">${t('Gera um espelho deste módulo para você alterar depois. Lançamentos e fechamentos não são copiados, e a cópia começa oculta para os vendedores.')}</div>
      <div class="mt-form">
        <label class="fi-field mt-full"><span class="fi-label">${t('Nome *')}</span><input class="fi-input" id="dp-nome" value="${esc(m.nome + ' ' + t('(cópia)'))}"></label>
        <label class="fi-field"><span class="fi-label">${t('Ano *')}</span><input class="fi-input" id="dp-ano" type="number" min="2020" max="2100" value="${m.ano}"></label>
        <div style="display:grid;gap:8px;align-content:end">
          <label class="mt-check"><input type="checkbox" id="dp-metas" checked> ${t('Copiar metas mensais')}</label>
          <label class="mt-check"><input type="checkbox" id="dp-premios" checked> ${t('Copiar prêmios-base')}</label></div></div>
      <div class="mt-small mt-muted">${t('{n} participante(s) serão copiados, com o mesmo papel e equipe.', { n })}</div>`,
    botoes: [{ texto: t('Cancelar') }, { texto: t('Duplicar'), primario: true, acao: async () => {
      const nome = $('#dp-nome').value.trim(), ano = Number($('#dp-ano').value), cm = $('#dp-metas').checked, cp = $('#dp-premios').checked;
      if (!nome) { notify(t('Informe o nome do módulo.'), 'warning'); return false; }
      if (!(ano >= 2020 && ano <= 2100)) { notify(t('Ano inválido.'), 'warning'); return false; }
      const novo = await q(S.sb.from('met_modulos').insert({ nome, ano, tipo: m.tipo || 'vendedor', base_modulo_id: m.base_modulo_id || null, base_modulos: m.base_modulos || [], tabela_id: m.tabela_id,
        tabela_supervisor_id: m.tabela_supervisor_id || null, tabela_gerente_id: m.tabela_gerente_id || null, regiao_id: m.regiao_id || null, setor: m.setor || null,
        faixas: m.faixas || [], recup_tri: m.recup_tri !== false, recup_anual: m.recup_anual !== false, faixas_papel: m.faixas_papel || {}, forma: m.forma || 'tabela', comissoes: m.comissoes || [], mes_ini: m.mes_ini || 1, mes_fim: m.mes_fim || 12, premio_base: m.premio_base == null ? null : m.premio_base,
        descricao: m.descricao || null, visivel: false, ativo: true }).select());
      const nid = novo && novo[0] && novo[0].id;
      const parts = S.mv.filter(x => x.modulo_id === m.id).map(x => ({ modulo_id: nid, vendedor_id: x.vendedor_id, papel: x.papel || 'vendedor', equipe: x.equipe || [],
        metas: cm ? x.metas : Array(12).fill(null), premios: cp ? x.premios : Array(12).fill(0) }));
      if (nid && parts.length) await q(S.sb.from('met_modulo_vendedores').insert(parts));
      await carregar(); notify(t('Meta duplicada — ajuste o que precisar'), 'success');
      location.hash = '#/adm/modulos/' + nid;
    } }] });
}

/* ------------------------------ Lançamentos e fechamento ------------------------------ */
function seletorModulo(atual, idSel) {
  return `<select class="fi-select" id="${idSel}" style="max-width:420px;font-weight:800">${S.modulos.map(m => `<option value="${m.id}" ${m.id === atual ? 'selected' : ''}>${esc(m.nome)} · ${m.ano} · ${ehSup(m) ? t('Supervisão') : ehEsp(m) ? t('Meta especial') : t('Vendedores')}</option>`).join('')}</select>`;
}
const PEND = new Map();     // `${modulo}|${mes}|${vendedor}` -> valor (null = apagar)
function aFechamento() {
  if (!S.modulos.length) { $('#adm-body').innerHTML = `<div class="fi-card"><div class="fi-empty">${t('Crie um módulo de metas primeiro.')}</div></div>`; return; }
  if (!byId(S.modulos, S.fechModulo)) S.fechModulo = S.modulos[0].id;
  const m = byId(S.modulos, S.fechModulo), tb = tabelaModulo(m), fech = fechadosDe(m.id), uf = Math.max(ultimoFechado(m.id), perMod(m)[0] - 1);
  if (!S.fechMes) S.fechMes = Math.min(12, uf + 1);
  const mes = S.fechMes, fechado = fech.has(mes), ehTri = mes % 3 === 0, sup = ehSup(m);
  const bases = sup ? basesDe(m) : [], base = bases[0] || null;
  const basesAbertas = bases.filter(b => !fechadosDe(b.id).has(mes));
  const baseOk = !sup || (bases.length && !basesAbertas.length);
  const vinc = vincDe(m.id);
  const chave = vid => m.id + '|' + mes + '|' + vid;
  const pendDoModulo = () => [...PEND.keys()].filter(k => k.startsWith(m.id + '|'));
  const calcLinhas = () => {
    const linha = (x, info) => {
      const tbx = tabelaDe(m, x);
      const bruto = realPart(m, x).slice();
      if (!sup) bruto[mes - 1] = liquido(info);
      const semLanc = bruto[mes - 1] == null;
      const real = bruto.map((v, i) => (i + 1 <= mes && v == null ? 0 : v));
      const c = calcular(tbx, x.metas, x.premios, real, mes);
      return { x, semLanc: semLanc && !ehLider(x), info, d: comExclusao(snapshot(m, tbx, x, c, c.meses[mes - 1]), info) };
    };
    if (fechado) return vinc.map(x => { const f = S.fechamentos.find(z => z.modulo_id === m.id && z.mes === mes && z.vendedor_id === x.vendedor_id); return { x, d: f ? f.dados : null, f }; });
    const vend = vinc.filter(x => !ehLider(x)).map(x => linha(x, infoMes(m, x, mes, sup ? null : PEND.get(chave(x.vendedor_id)))));
    const lids = vinc.filter(ehLider).map(x => {
      const infos = vend.map(l => l.info);
      const completo = infos.length && infos.every(i => i && i.valor != null);
      const exc = sum(infos.map(i => i && i.excluir ? i.excluido : 0));
      return linha(x, completo ? { valor: sum(infos.map(i => i.valor)), excluido: exc, excluir: exc > 0, obs: '' } : { valor: null, excluido: 0, excluir: false, obs: '' });
    });
    return [...vend, ...lids];
  };
  let linhas = calcLinhas();
  const pctW = v => v == null ? WAIT() : pct(v);
  const cols = [
    ['liq', t('Realizado p/ meta') + dica(t('Realizado p/ meta = realizado bruto − vendas excluídas (quando a caixa estiver marcada). Comissão efetiva = total a pagar ÷ realizado p/ meta.')), d => `<b>${brl(d.realizado)}</b>`],
    ['ating', t('Atingido'), d => pct(d.atingimento)],
    ['faixa', t('Faixa'), d => `<span class="mt-pill ${classeMult(d.multiplicador)}">${multTxt(d.multiplicador)}</span>`],
    ['base', t('Prêmio-base'), d => brl(d.premio_base)],

/* cálculo de prévia até o mês (sem lançamento = 0); meta especial respeita o período */
function calcPrevia(m, x, mes) {
  const dentro = i => noPer(m, i + 1);
  const real = realPart(m, x).map((v, i) => (!dentro(i) || i + 1 > mes ? null : v == null ? 0 : v));   // posição na data: meses seguintes ainda não existem
  return calcular(tabelaDe(m, x), (x.metas || []).map((v, i) => dentro(i) ? v : null), (x.premios || []).map((v, i) => dentro(i) ? v : 0), real, mes);
}
/* prévia de fechamento a partir dos dados gravados */
function calcLinhasDe(m, mes) {
  return vincDe(m.id).map(x => {
    const tb = tabelaDe(m, x), c = calcPrevia(m, x, mes);
    return { x, d: comExclusao(snapshot(m, tb, x, c, c.meses[mes - 1]), infoMes(m, x, mes)) };
  });
}
/* dados de uma pessoa num mês: fechado = valores congelados; aberto = prévia */
function dadosMes(m, x, mes) {
  const f = S.fechamentos.find(z => z.modulo_id === m.id && z.mes === mes && z.vendedor_id === x.vendedor_id);
  if (f && f.dados) return { x, d: f.dados, f, fechado: true };
  const tb = tabelaDe(m, x), c = calcPrevia(m, x, mes);
  return { x, d: comExclusao(snapshot(m, tb, x, c, c.meses[mes - 1]), infoMes(m, x, mes)), f: null, fechado: false };
}
const quandoDe = l => l && l.f ? { d: new Date(l.f.fechado_em).toLocaleString(LOC()), p: l.f.fechado_por || '' } : null;
/* bruto e exclusões do mês (supervisão = soma da equipe); pend = alterações ainda não salvas */
function infoMes(m, x, mes, pend) {
  const vazio = { valor: null, excluido: 0, excluir: false, obs: '' };
  if (ehSup(m) || ehLider(x)) {
    const rs = (x.equipeV || []).map(z => rawDe((z.baseMod || x.baseMod).id, z.vendedor_id)[mes - 1]);
    if (!rs.length || rs.some(r => !r)) return vazio;
    const exc = sum(rs.map(r => r.excluir ? r.excluido : 0));
    return { valor: sum(rs.map(r => r.valor)), excluido: exc, excluir: exc > 0, obs: '' };
  }
  const base = rawDe(m.id, x.vendedor_id)[mes - 1] || vazio;
  return pend ? Object.assign({}, base, pend) : base;
}
function comExclusao(d, info) {
  d.realizado_bruto = info && info.valor != null ? info.valor : (d.realizado || 0);
  d.vendas_excluidas = info && info.excluir ? (info.excluido || 0) : 0;
  d.exclusao_obs = info && info.excluir ? (info.obs || '') : '';
  return d;
}

function mesDe(v) {
  if (v == null || v === '') return null;
  if (v instanceof Date) return v.getMonth() + 1;
  if (typeof v === 'number') { if (v >= 1 && v <= 12) return Math.round(v); if (v > 20000) { const d = new Date(Math.round((v - 25569) * 864e5)); return d.getUTCMonth() + 1; } return null; }
  const s = String(v).trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  if (/^\d{1,2}$/.test(s)) { const n = Number(s); return n >= 1 && n <= 12 ? n : null; }
  let mm = s.match(/^(\d{4})[-/](\d{1,2})/); if (mm) return Number(mm[2]);
  mm = s.match(/^(\d{1,2})[-/](\d{4})$/); if (mm) return Number(mm[1]);
  mm = s.match(/^\d{1,2}\/(\d{1,2})\/\d{2,4}$/); if (mm) return Number(mm[1]);
  const pt = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'], en = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
  let i = pt.findIndex(p => s.startsWith(p)); if (i < 0) i = en.findIndex(p => s.startsWith(p));
  return i >= 0 ? i + 1 : null;
}
