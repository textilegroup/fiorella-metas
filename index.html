<script>
/* =====================================================================
   Metas e Premiação — Fiorella
   Chave na Central de Acesso: "metas"  ·  Supabase: tabelas met_*
   Permissões (definidas na Central):
     admin  -> Administração completa (cadastros, lançamentos, fechamentos)
     editar -> vê todos os vendedores e módulos (somente leitura)
     ver    -> vê apenas o próprio painel (vendedor ligado pelo e-mail)
   ===================================================================== */
(function () {
'use strict';

const MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const MESES_LONGO = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const HOJE = new Date();

const S = {           // estado
  sb: null, perm: null, admin: false, veTudo: false, email: '', nome: '',
  regioes: [], vendedores: [], tabelas: [], modulos: [], mv: [], realizado: [], fechamentos: [],
  contas: null, admTab: 'modulos', lancModulo: null, fechModulo: null, fechMes: null
};

/* ------------------------------ util ------------------------------ */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const UI = () => window.FiorellaUI;
const brl = v => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(Number(v) || 0);
const brl0 = v => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 }).format(Number(v) || 0);
const num = (v, d) => new Intl.NumberFormat('pt-BR', { minimumFractionDigits: d == null ? 2 : d, maximumFractionDigits: d == null ? 2 : d }).format(Number(v) || 0);
const pct = (v, d) => v == null || !isFinite(v) ? '—' : new Intl.NumberFormat('pt-BR', { style: 'percent', minimumFractionDigits: d == null ? 1 : d, maximumFractionDigits: d == null ? 1 : d }).format(v);
const multTxt = m => (Number.isInteger(m) ? m : num(m, String(m).split('.')[1]?.length > 1 ? 2 : 1)) + '×';
function parseBR(s) {
  if (typeof s === 'number') return s;
  s = String(s == null ? '' : s).trim().replace(/R\$\s?/i, '').replace(/\s/g, '');
  if (!s) return null;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  const n = Number(s);
  return isFinite(n) ? n : null;
}
function notify(msg, type) { UI() ? UI().notify(msg, { type: type || 'brand', duration: type === 'danger' ? 5000 : 2600 }) : alert(msg); }
async function confirmar(o) { return UI() ? UI().confirm(o) : window.confirm(o.message); }
function erroMsg(e) {
  const m = (e && (e.message || e.details || e.hint)) || String(e);
  if (/row-level security|permission denied/i.test(m)) return 'Sem permissão para esta operação (ou o mês já está fechado).';
  if (/duplicate key.*email/i.test(m)) return 'Já existe um vendedor com este e-mail.';
  if (/duplicate key/i.test(m)) return 'Registro duplicado.';
  if (/foreign key/i.test(m)) return 'Registro em uso por outro cadastro — não pode ser excluído.';
  return m;
}
async function q(p) { const r = await p; if (r.error) throw r.error; return r.data; }
const byId = (arr, id) => arr.find(x => x.id === id);
const sum = a => a.reduce((s, v) => s + (Number(v) || 0), 0);
const mesPadrao = ano => ano === HOJE.getFullYear() ? HOJE.getMonth() + 1 : (ano < HOJE.getFullYear() ? 12 : 1);

/* ======================= MOTOR DE CÁLCULO ======================= */
/* Regras:
   - Atingimento do mês = realizado ÷ meta. Prêmio do mês = prêmio-base × multiplicador da faixa atingida
     (padrão: ≥90% → 0,5× · ≥100% → 1× · ≥105% → 2×).
   - Recuperação trimestral: no fechamento do último mês do trimestre (mar/jun/set/dez), se a soma do realizado
     do trimestre ≥ soma das metas do trimestre, cada mês do trimestre que ficou abaixo de 1× recebe a diferença
     até 1× do prêmio-base.
   - Recuperação anual: no fechamento de dezembro, se o realizado do ano ≥ meta do ano, os meses que ainda
     estiverem abaixo de 1× (não recuperados no trimestre) recebem a diferença até 1×.
   - O 2× (≥105%) é pago no próprio mês e não é afetado pelas recuperações. */
function faixasOrd(t) {
  return ((t && t.faixas) || []).map(f => ({ min: Number(f.min), mult: Number(f.mult) }))
    .filter(f => isFinite(f.min) && isFinite(f.mult)).sort((a, b) => a.min - b.min);
}
function multDe(t, ating) {
  if (ating == null || !isFinite(ating)) return 0;
  let m = 0;
  for (const f of faixasOrd(t)) if (ating * 100 >= f.min - 1e-9) m = f.mult;
  return m;
}
function calcular(t, metas, premios, real, ate) {
  const meses = [];
  for (let i = 0; i < 12; i++) {
    const meta = Number(metas && metas[i]) || 0, base = Number(premios && premios[i]) || 0;
    const r = real[i] == null ? null : Number(real[i]);
    const apurado = i + 1 <= ate && r != null;
    const ating = meta > 0 && r != null ? r / meta : null;
    const mult = apurado ? multDe(t, ating) : 0;
    meses.push({ mes: i + 1, meta, base, real: r, apurado, ating, mult, premio: base * mult,
                 recTri: 0, recAno: 0, pagoTri: 0, pagoAno: 0, total: 0 });
  }
  const tri = [];
  for (let qd = 0; qd < 4; qd++) {
    const ms = meses.slice(qd * 3, qd * 3 + 3), fim = qd * 3 + 3;
    const metaQ = sum(ms.map(m => m.meta)), realQ = sum(ms.map(m => m.real || 0));
    const atingQ = metaQ > 0 ? realQ / metaQ : null;
    const apurado = ate >= fim && ms.every(m => m.real != null);
    const recuperou = !!(t && t.recup_tri) && apurado && atingQ != null && atingQ >= 1 - 1e-9;
    if (recuperou) ms.forEach(m => { if (m.mult < 1) m.recTri = m.base * (1 - m.mult); });
    const valor = sum(ms.map(m => m.recTri));
    meses[fim - 1].pagoTri = valor;
    tri.push({ q: qd + 1, metaQ, realQ, atingQ, apurado, recuperou, valor, premio: sum(ms.map(m => m.premio)) });
  }
  const metaA = sum(meses.map(m => m.meta)), realA = sum(meses.map(m => m.real || 0));
  const atingA = metaA > 0 ? realA / metaA : null;
  const anoApurado = ate >= 12 && meses.every(m => m.real != null);
  const recA = !!(t && t.recup_anual) && anoApurado && atingA != null && atingA >= 1 - 1e-9;
  if (recA) meses.forEach(m => { if (m.mult < 1 && m.recTri === 0) m.recAno = m.base * (1 - m.mult); });
  meses[11].pagoAno = sum(meses.map(m => m.recAno));
  meses.forEach(m => { m.total = m.premio + m.pagoTri + m.pagoAno; });
  // acumulado: meses até o de referência; o próprio mês de referência só entra quando já tem lançamento
  const noAcum = m => m.mes < ate || (m.mes === ate && m.real != null);
  const realAte = sum(meses.filter(noAcum).map(m => m.real || 0));
  const metaAte = sum(meses.filter(noAcum).map(m => m.meta));
  return {
    meses, tri,
    ano: { metaA, realA, atingA, apurado: anoApurado, recuperou: recA, valor: meses[11].pagoAno },
    ate, metaAte, realAte, atingAte: metaAte > 0 ? realAte / metaAte : null,
    totalAte: sum(meses.filter(m => m.mes <= ate).map(m => m.total)),
    premioBaseAno: sum(meses.map(m => m.base))
  };
}
/* % de comissão equivalente: prêmio pago ÷ venda necessária para atingir a faixa */
function comissaoEquiv(t, meta, base) {
  return faixasOrd(t).map(f => ({ min: f.min, mult: f.mult,
    venda: meta * f.min / 100, premio: base * f.mult,
    pct: meta > 0 && f.min > 0 ? (base * f.mult) / (meta * f.min / 100) : null }));
}
function classeMult(m) { return m >= 2 ? 'mt-m3' : m >= 1 ? 'mt-m2' : m > 0 ? 'mt-m1' : 'mt-m0'; }
window.MetasCalc = { calcular, multDe, comissaoEquiv, parseBR };   // exposto para conferência/testes

/* ------------------------- acesso aos dados ------------------------- */
function realDe(moduloId, vendedorId) {
  const arr = Array(12).fill(null);
  S.realizado.forEach(r => { if (r.modulo_id === moduloId && r.vendedor_id === vendedorId) arr[r.mes - 1] = Number(r.valor); });
  return arr;
}
function fechadosDe(moduloId) {
  const s = new Set(); S.fechamentos.forEach(f => { if (f.modulo_id === moduloId) s.add(f.mes); }); return s;
}
function ultimoFechado(moduloId) { const s = fechadosDe(moduloId); let u = 0; s.forEach(m => { if (m > u) u = m; }); return u; }
function vincDe(moduloId) {
  return S.mv.filter(x => x.modulo_id === moduloId)
    .map(x => ({ ...x, v: byId(S.vendedores, x.vendedor_id) }))
    .filter(x => x.v)
    .sort((a, b) => a.v.nome.localeCompare(b.v.nome, 'pt-BR'));
}
function calcVinc(mod, x, ate) {
  const t = byId(S.tabelas, mod.tabela_id);
  return calcular(t, x.metas, x.premios, realDe(mod.id, x.vendedor_id), ate);
}
function meusVendedores() { return S.vendedores.filter(v => v.email === S.email); }

async function carregar() {
  const sb = S.sb;
  const [reg, ven, tab, mod, mv, rea, fec] = await Promise.all([
    q(sb.from('met_regioes').select('*').order('nome')),
    q(sb.from('met_vendedores').select('*').order('nome')),
    q(sb.from('met_tabelas').select('*').order('nome')),
    q(sb.from('met_modulos').select('*').order('ano', { ascending: false }).order('nome')),
    q(sb.from('met_modulo_vendedores').select('*')),
    q(sb.from('met_realizado').select('*')),
    q(sb.from('met_fechamentos').select('*'))
  ]);
  Object.assign(S, { regioes: reg || [], vendedores: ven || [], tabelas: tab || [], modulos: mod || [],
                     mv: mv || [], realizado: rea || [], fechamentos: fec || [] });
  if (S.admin) {
    try { S.contas = await q(sb.rpc('met_contas_central')); } catch (_) { S.contas = null; }
  }
}

/* ------------------------------ modal ------------------------------ */
function modal({ titulo, corpo, botoes, largura }) {
  const root = $('#modal-root');
  const el = document.createElement('div');
  el.className = 'mt-modal';
  el.innerHTML = `<section class="mt-modal__panel" role="dialog" aria-modal="true" style="${largura ? 'width:min(' + largura + 'px,100%)' : ''}">
    <div class="mt-modal__head"><span>${esc(titulo)}</span><span class="mt-sp"></span>
      <button class="fi-icon-btn" data-x aria-label="Fechar">✕</button></div>
    <div class="mt-modal__body">${corpo}</div>
    <div class="mt-modal__foot"></div></section>`;
  const foot = $('.mt-modal__foot', el);
  const fechar = () => el.remove();
  (botoes || []).forEach(b => {
    const bt = document.createElement('button');
    bt.className = 'fi-btn' + (b.primario ? ' fi-btn--primary' : '') + (b.perigo ? ' fi-btn--danger' : '');
    bt.textContent = b.texto;
    if (b.esquerda) bt.style.marginRight = 'auto';
    bt.addEventListener('click', async () => {
      if (!b.acao) return fechar();
      bt.disabled = true;
      try { const r = await b.acao(el); if (r !== false) fechar(); }
      catch (e) { notify(erroMsg(e), 'danger'); }
      finally { bt.disabled = false; }
    });
    foot.appendChild(bt);
  });
  $('[data-x]', el).addEventListener('click', fechar);
  el.addEventListener('keydown', e => { if (e.key === 'Escape') fechar(); });
  root.appendChild(el);
  const f = $('input,select,textarea', el); if (f) f.focus();
  return el;
}

/* ------------------------------ rotas ------------------------------ */
function setHead(eyebrow, titulo, sub, acoesHtml) {
  $('#eyebrow').textContent = eyebrow;
  const t = $('#titulo');
  const ver = t.querySelector('.fi-ui-version');
  t.textContent = titulo; if (ver) t.appendChild(ver);
  $('#subtitulo').textContent = sub || '';
  $('#head-acoes').innerHTML = acoesHtml || '';
}
function navAtivo(r) {
  $$('#nav a').forEach(a => {
    const on = a.dataset.r === r;
    a.classList.toggle('fi-active', on);
    if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
}
function rota() {
  const h = (location.hash || '#/inicio').replace(/^#\/?/, '').split('/');
  const nome = h[0] || 'inicio';
  $('#nav').classList.remove('fi-open');
  try {
    if (nome === 'modulo' && h[1]) { navAtivo('inicio'); return vModulo(h[1]); }
    if (nome === 'painel') { navAtivo('painel'); return vPainel(); }
    if (nome === 'adm' && S.admin) { navAtivo('adm'); if (h[1]) S.admTab = h[1]; return vAdm(); }
    navAtivo('inicio'); return vInicio();
  } catch (e) { console.error(e); $('#view').innerHTML = `<div class="fi-alert fi-alert--danger">${esc(erroMsg(e))}</div>`; }
}

/* ============================== INÍCIO ============================== */
function vInicio() {
  setHead('Comercial', 'Metas e Premiação',
    S.veTudo ? 'Todos os módulos de metas. Clique para ver o detalhamento por vendedor.'
             : 'Módulos de metas liberados para você.');
  const mods = S.modulos.filter(m => S.veTudo || (m.visivel && m.ativo));
  if (!mods.length) {
    $('#view').innerHTML = `<div class="fi-card"><div class="fi-empty"><div><strong>Nenhum módulo de metas ${S.veTudo ? 'criado' : 'liberado'} ainda.</strong>
      <p class="mt-small">${S.admin ? 'Crie o primeiro em Administração › Módulos de metas.' :
        (meusVendedores().length ? 'Assim que a gestão liberar a visualização, ele aparece aqui.' :
         'Seu e-mail (' + esc(S.email) + ') ainda não está cadastrado como vendedor.')}</p></div></div></div>`;
    return;
  }
  const anos = [...new Set(mods.map(m => m.ano))].sort((a, b) => b - a);
  let html = '';
  anos.forEach(ano => {
    html += `<div class="fi-eyebrow mt-mt2">${ano}</div><div class="fi-grid fi-grid--3">`;
    mods.filter(m => m.ano === ano).forEach(m => {
      const vinc = vincDe(m.id).filter(x => S.veTudo || x.v.email === S.email);
      const ate = Math.max(ultimoFechado(m.id), mesPadrao(m.ano));
      let meta = 0, real = 0, premio = 0;
      vinc.forEach(x => { const c = calcVinc(m, x, ate); meta += c.metaAte; real += c.realAte; premio += c.totalAte; });
      const at = meta > 0 ? real / meta : null;
      const t = byId(S.tabelas, m.tabela_id), reg = byId(S.regioes, m.regiao_id);
      const fech = ultimoFechado(m.id);
      html += `<article class="fi-card mt-modcard" data-mod="${m.id}" tabindex="0">
        <div class="fi-card__head"><div><div class="fi-card__title">${esc(m.nome)}</div>
          <div class="fi-card__note">${esc(t ? t.nome : '—')}${reg ? ' · ' + esc(reg.nome) : ''}</div></div>
          <div class="mt-row">${S.veTudo ? (m.visivel ? '<span class="fi-badge fi-badge--success">Liberado</span>' : '<span class="fi-badge">Oculto</span>') : ''}
          ${!m.ativo ? '<span class="fi-badge fi-badge--warning">Inativo</span>' : ''}</div></div>
        <div class="fi-card__body">
          <div class="mt-kv">
            <div><span>Meta até ${MESES[ate - 1]}</span><b>${brl0(meta)}</b></div>
            <div><span>Realizado</span><b>${brl0(real)}</b></div>
            <div><span>Atingido</span><b>${pct(at)}</b></div>
          </div>
          <div class="mt-bar" title="Atingimento acumulado"><span style="width:${Math.min(100, (at || 0) / 1.1 * 100)}%"></span><i style="left:${90 / 1.1}%"></i><i style="left:${100 / 1.1}%"></i></div>
          <div class="mt-row mt-small mt-muted"><span>${vinc.length} vendedor${vinc.length === 1 ? '' : 'es'}</span><span class="mt-sp"></span>
            <span>Premiação acumulada <b class="mt-strong" style="color:var(--fi-text)">${brl(premio)}</b></span></div>
          <div class="mt-small mt-muted">${fech ? 'Fechado até ' + MESES_LONGO[fech - 1] : 'Nenhum mês fechado'}</div>
        </div></article>`;
    });
    html += `</div>`;
  });
  $('#view').innerHTML = html;
  $$('[data-mod]').forEach(c => {
    const go = () => { location.hash = '#/modulo/' + c.dataset.mod; };
    c.addEventListener('click', go);
    c.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  });
}

/* ========================== DETALHE DO MÓDULO ========================== */
function vModulo(id, mesSel, regSel) {
  const m = byId(S.modulos, id);
  if (!m) { location.hash = '#/inicio'; return; }
  const t = byId(S.tabelas, m.tabela_id);
  const fech = fechadosDe(m.id);
  const mes = mesSel || Math.max(ultimoFechado(m.id), mesPadrao(m.ano));
  let vinc = vincDe(m.id).filter(x => S.veTudo || x.v.email === S.email);
  if (regSel) vinc = vinc.filter(x => x.v.regiao_id === regSel);
  setHead(m.ano + (byId(S.regioes, m.regiao_id) ? ' · ' + byId(S.regioes, m.regiao_id).nome : ''), m.nome,
    (t ? t.nome : '') + (m.descricao ? ' — ' + m.descricao : ''),
    `<button class="fi-btn" id="bt-voltar">← Módulos</button>
     <button class="fi-btn" id="bt-xls">Exportar Excel</button>
     ${S.admin ? `<button class="fi-btn fi-btn--primary" id="bt-fechar">Fechamento</button>` : ''}`);

  const linhas = vinc.map(x => ({ x, c: calcVinc(m, x, mes) }));
  const tot = { meta: 0, real: 0, premio: 0, rec: 0, total: 0, metaAte: 0, realAte: 0, totalAte: 0 };
  linhas.forEach(({ c }) => {
    const mm = c.meses[mes - 1];
    tot.meta += mm.meta; tot.real += mm.real || 0; tot.premio += mm.premio; tot.rec += mm.pagoTri + mm.pagoAno; tot.total += mm.total;
    tot.metaAte += c.metaAte; tot.realAte += c.realAte; tot.totalAte += c.totalAte;
  });
  const regsDoMod = [...new Set(vincDe(m.id).map(x => x.v.regiao_id).filter(Boolean))];
  const mesesOpt = MESES_LONGO.map((n, i) => `<option value="${i + 1}" ${i + 1 === mes ? 'selected' : ''}>${n}${fech.has(i + 1) ? ' · fechado' : ''}</option>`).join('');

  let html = `
  <div class="fi-card mt-noprint"><div class="fi-card__body fi-filters">
    <label class="fi-field"><span class="fi-label">Mês de referência</span><select class="fi-select" id="f-mes">${mesesOpt}</select></label>
    ${S.veTudo && regsDoMod.length > 1 ? `<label class="fi-field"><span class="fi-label">Região</span><select class="fi-select" id="f-reg">
      <option value="">Todas</option>${regsDoMod.map(r => `<option value="${r}" ${r === regSel ? 'selected' : ''}>${esc((byId(S.regioes, r) || {}).nome)}</option>`).join('')}</select></label>` : ''}
    <div class="mt-sp"></div>
    <div class="mt-small mt-muted">${fech.has(mes) ? '🔒 Mês fechado — valores congelados' : 'Mês aberto — valores ainda podem mudar'}</div>
  </div></div>

  <div class="fi-grid fi-grid--4 mt-mt">
    <div class="fi-card fi-metric fi-metric--brand"><div class="fi-metric__top"><span>Meta ${MESES[mes - 1]}</span></div><div class="fi-metric__value">${brl0(tot.meta)}</div><div class="fi-metric__foot">Realizado ${brl0(tot.real)}</div></div>
    <div class="fi-card fi-metric"><div class="fi-metric__top"><span>Atingido no mês</span></div><div class="fi-metric__value">${pct(tot.meta ? tot.real / tot.meta : null)}</div><div class="fi-progress"><span style="width:${Math.min(100, tot.meta ? tot.real / tot.meta * 100 : 0)}%"></span></div></div>
    <div class="fi-card fi-metric"><div class="fi-metric__top"><span>Acumulado até ${MESES[mes - 1]}</span></div><div class="fi-metric__value">${pct(tot.metaAte ? tot.realAte / tot.metaAte : null)}</div><div class="fi-metric__foot">${brl0(tot.realAte)} de ${brl0(tot.metaAte)}</div></div>
    <div class="fi-card fi-metric"><div class="fi-metric__top"><span>Premiação do mês</span></div><div class="fi-metric__value">${brl0(tot.total)}</div><div class="fi-metric__foot">acumulado ${brl0(tot.totalAte)}</div></div>
  </div>`;

  html += `<section class="fi-card mt-mt2"><div class="fi-card__head"><div><div class="fi-card__title">Vendedores — ${MESES_LONGO[mes - 1]}/${m.ano}</div>
    <div class="fi-card__note">Prêmio = prêmio-base × multiplicador da faixa. Recuperações são pagas no fechamento de ${MESES[2]}/${MESES[5]}/${MESES[8]}/${MESES[11]} (trimestre) e ${MESES[11]} (ano).</div></div></div>
    <div class="fi-table-wrap" style="border:0;border-radius:0"><table class="fi-table" id="tb-mod"><thead><tr>
      <th>Vendedor</th><th>Região</th><th class="mt-num">Meta</th><th class="mt-num">Realizado</th><th class="mt-num">Atingido</th><th>Faixa</th>
      <th class="mt-num">Prêmio-base</th><th class="mt-num">Prêmio mês</th><th class="mt-num">Recuperação</th><th class="mt-num">Total mês</th>
      <th class="mt-num">Acum. %</th><th class="mt-num">Acum. prêmio</th><th class="mt-num">Comissão equiv.</th></tr></thead><tbody>`;
  if (!linhas.length) html += `<tr><td colspan="13"><div class="fi-empty">Nenhum vendedor atrelado${regSel ? ' nesta região' : ''}.</div></td></tr>`;
  linhas.forEach(({ x, c }) => {
    const mm = c.meses[mes - 1];
    const eq = mm.real && mm.total ? mm.total / mm.real : null;
    html += `<tr data-vend="${x.vendedor_id}" style="cursor:pointer">
      <td class="mt-strong">${esc(x.v.nome)}</td><td>${esc((byId(S.regioes, x.v.regiao_id) || {}).nome || '—')}</td>
      <td class="mt-num">${brl(mm.meta)}</td><td class="mt-num">${mm.real == null ? '<span class="mt-muted">—</span>' : brl(mm.real)}</td>
      <td class="mt-num">${pct(mm.ating)}</td><td><span class="mt-pill ${classeMult(mm.mult)}">${mm.apurado ? multTxt(mm.mult) : '—'}</span></td>
      <td class="mt-num">${brl(mm.base)}</td><td class="mt-num">${brl(mm.premio)}</td>
      <td class="mt-num ${mm.pagoTri + mm.pagoAno ? 'mt-pos mt-strong' : ''}">${brl(mm.pagoTri + mm.pagoAno)}</td>
      <td class="mt-num mt-strong">${brl(mm.total)}</td>
      <td class="mt-num">${pct(c.atingAte)}</td><td class="mt-num">${brl(c.totalAte)}</td>
      <td class="mt-num">${pct(eq, 2)}</td></tr>`;
  });
  html += `</tbody>${linhas.length > 1 ? `<tfoot><tr><td colspan="2">Total</td><td class="mt-num">${brl(tot.meta)}</td><td class="mt-num">${brl(tot.real)}</td>
    <td class="mt-num">${pct(tot.meta ? tot.real / tot.meta : null)}</td><td></td><td></td><td class="mt-num">${brl(tot.premio)}</td>
    <td class="mt-num">${brl(tot.rec)}</td><td class="mt-num">${brl(tot.total)}</td><td class="mt-num">${pct(tot.metaAte ? tot.realAte / tot.metaAte : null)}</td>
    <td class="mt-num">${brl(tot.totalAte)}</td><td></td></tr></tfoot>` : ''}</table></div>
    <div class="fi-card__foot">Clique num vendedor para ver os 12 meses, os trimestres e a faixa de comissão equivalente.</div></section>`;

  html += regraHtml(t);
  $('#view').innerHTML = html;

  $('#f-mes').addEventListener('change', e => vModulo(id, Number(e.target.value), regSel));
  const fr = $('#f-reg'); if (fr) fr.addEventListener('change', e => vModulo(id, mes, e.target.value || null));
  $('#bt-voltar').addEventListener('click', () => { location.hash = '#/inicio'; });
  $('#bt-xls').addEventListener('click', () => exportarModulo(m, mes, linhas));
  const bf = $('#bt-fechar'); if (bf) bf.addEventListener('click', () => { S.fechModulo = m.id; S.fechMes = mes; location.hash = '#/adm/fechamentos'; });
  $$('#tb-mod tr[data-vend]').forEach(tr => tr.addEventListener('click', () => {
    const x = vincDe(m.id).find(v => v.vendedor_id === tr.dataset.vend);
    modalVendedorAno(m, x, mes);
  }));
}

function regraHtml(t) {
  if (!t) return '';
  const f = faixasOrd(t);
  return `<section class="fi-card mt-mt2"><div class="fi-card__head"><div class="fi-card__title">Regras da tabela “${esc(t.nome)}”</div></div>
    <div class="fi-card__body"><div class="mt-rule">
    ${f.map(x => `<div>Atingiu <b>${num(x.min, x.min % 1 ? 1 : 0)}%</b> ou mais da meta do mês → recebe <b>${x.mult === 1 ? '100%' : x.mult > 1 ? multTxt(x.mult) + ' (' + pct(x.mult, 0) + ')' : pct(x.mult, 0)}</b> do prêmio-base.</div>`).join('')}
    <div>Abaixo de ${f.length ? num(f[0].min, 0) + '%' : 'a primeira faixa'} → sem premiação no mês.</div>
    ${t.recup_tri ? `<div><b>Recuperação trimestral:</b> se a soma do trimestre bater a soma das metas do trimestre, os meses que ficaram abaixo de 100% recebem a diferença até 1× do prêmio-base (pago no fechamento do último mês do trimestre).</div>` : ''}
    ${t.recup_anual ? `<div><b>Recuperação anual:</b> se o ano bater a soma de todas as metas, os meses ainda não recuperados recebem a diferença até 1× (pago no fechamento de dezembro).</div>` : ''}
    ${t.observacao ? `<div class="mt-muted">${esc(t.observacao)}</div>` : ''}
    </div></div></section>`;
}

/* Detalhe anual de um vendedor num módulo (usado no detalhe do módulo e no Meu painel) */
function tabelaAnoHtml(m, x, c) {
  const fech = fechadosDe(m.id);
  let h = `<div class="fi-table-wrap"><table class="fi-table"><thead><tr><th>Mês</th><th class="mt-num">Meta</th><th class="mt-num">Realizado</th>
    <th class="mt-num">Atingido</th><th>Faixa</th><th class="mt-num">Prêmio-base</th><th class="mt-num">Prêmio</th>
    <th class="mt-num">Rec. trimestre</th><th class="mt-num">Rec. ano</th><th class="mt-num">Total pago</th></tr></thead><tbody>`;
  c.meses.forEach(mm => {
    h += `<tr><td>${MESES[mm.mes - 1]}${fech.has(mm.mes) ? '<span class="mt-lock" title="Mês fechado">🔒</span>' : ''}</td>
      <td class="mt-num">${brl(mm.meta)}</td><td class="mt-num">${mm.real == null ? '<span class="mt-muted">—</span>' : brl(mm.real)}</td>
      <td class="mt-num">${pct(mm.ating)}</td><td><span class="mt-pill ${classeMult(mm.mult)}">${mm.apurado ? multTxt(mm.mult) : '—'}</span>${mm.recTri ? ' <span class="mt-small mt-pos" title="Recuperado no trimestre">↺T</span>' : ''}${mm.recAno ? ' <span class="mt-small mt-pos" title="Recuperado no ano">↺A</span>' : ''}</td>
      <td class="mt-num">${brl(mm.base)}</td><td class="mt-num">${brl(mm.premio)}</td>
      <td class="mt-num">${mm.pagoTri ? brl(mm.pagoTri) : ''}</td><td class="mt-num">${mm.pagoAno ? brl(mm.pagoAno) : ''}</td>
      <td class="mt-num mt-strong">${brl(mm.total)}</td></tr>`;
    if (mm.mes % 3 === 0) {
      const tq = c.tri[mm.mes / 3 - 1];
      h += `<tr class="mt-sub"><td>${tq.q}º tri</td><td class="mt-num">${brl(tq.metaQ)}</td><td class="mt-num">${brl(tq.realQ)}</td>
        <td class="mt-num">${pct(tq.atingQ)}</td><td colspan="6">${!tq.apurado ? '<span class="mt-muted">trimestre em andamento</span>' :
          tq.recuperou ? (tq.valor ? `<span class="mt-pos">Bateu o trimestre — recuperou ${brl(tq.valor)}</span>` : '<span class="mt-pos">Bateu o trimestre (nada a recuperar)</span>')
          : '<span class="mt-muted">Não bateu a meta do trimestre</span>'}</td></tr>`;
    }
  });
  h += `</tbody><tfoot><tr><td>Ano</td><td class="mt-num">${brl(c.ano.metaA)}</td><td class="mt-num">${brl(c.ano.realA)}</td><td class="mt-num">${pct(c.ano.atingA)}</td>
    <td colspan="2">${c.ano.apurado ? (c.ano.recuperou ? '<span class="mt-pos">Bateu o ano</span>' : 'Não bateu o ano') : '<span class="mt-muted">ano em andamento</span>'}</td>
    <td class="mt-num">${brl(sum(c.meses.map(z => z.premio)))}</td><td class="mt-num">${brl(sum(c.tri.map(z => z.valor)))}</td>
    <td class="mt-num">${brl(c.ano.valor)}</td><td class="mt-num">${brl(sum(c.meses.map(z => z.total)))}</td></tr></tfoot></table></div>`;
  return h;
}
function comissaoHtml(m, x, mes) {
  const t = byId(S.tabelas, m.tabela_id);
  const meta = Number(x.metas[mes - 1]) || 0, base = Number(x.premios[mes - 1]) || 0;
  const eq = comissaoEquiv(t, meta, base);
  const r = realDe(m.id, x.vendedor_id)[mes - 1] || 0;
  return `<div class="mt-falta">${eq.map(e => `<div><span>${num(e.min, 0)}% da meta · ${multTxt(e.mult)}</span>
      <b>${brl0(e.venda)}</b><div class="mt-small mt-muted">prêmio ${brl(e.premio)} · comissão equiv. <b>${pct(e.pct, 2)}</b></div>
      ${r < e.venda ? `<div class="mt-small mt-warn">faltam ${brl0(e.venda - r)}</div>` : `<div class="mt-small mt-pos">✓ atingido</div>`}</div>`).join('')}</div>`;
}
function modalVendedorAno(m, x, mes) {
  const c = calcVinc(m, x, Math.max(mes, ultimoFechado(m.id)));
  modal({ titulo: x.v.nome + ' — ' + m.nome, largura: 1040,
    corpo: `<div class="mt-small mt-muted">Faixas de ${MESES_LONGO[mes - 1]}: venda necessária, prêmio e o percentual de comissão que ele representa.</div>
      ${comissaoHtml(m, x, mes)}${tabelaAnoHtml(m, x, c)}`,
    botoes: [{ texto: 'Fechar', primario: true }] });
}

/* ============================== MEU PAINEL ============================== */
function vPainel() {
  const meus = meusVendedores();
  setHead('Meu painel', S.nome || 'Meu painel', 'Suas metas, atingimento e premiação. Você vê apenas os seus dados.');
  if (!meus.length) {
    $('#view').innerHTML = `<div class="fi-card"><div class="fi-empty"><div><strong>Seu e-mail não está cadastrado como vendedor.</strong>
      <p class="mt-small">Conta: ${esc(S.email)}. ${S.admin ? 'Cadastre-se em Administração › Vendedores se também tiver metas.' : 'Peça à gestão comercial para cadastrá-lo com este e-mail.'}</p></div></div></div>`;
    return;
  }
  const ids = new Set(meus.map(v => v.id));
  const mods = S.modulos.filter(m => (m.visivel && m.ativo) || S.veTudo)
    .filter(m => S.mv.some(x => x.modulo_id === m.id && ids.has(x.vendedor_id)));
  if (!mods.length) {
    $('#view').innerHTML = `<div class="fi-card"><div class="fi-empty"><div><strong>Nenhum módulo de metas liberado para você ainda.</strong></div></div></div>`;
    return;
  }
  let html = '';
  mods.forEach(m => {
    const x = vincDe(m.id).find(z => ids.has(z.vendedor_id));
    const mes = Math.max(ultimoFechado(m.id), mesPadrao(m.ano));
    const c = calcVinc(m, x, mes), mm = c.meses[mes - 1];
    html += `<section class="fi-card mt-mt2"><div class="fi-card__head"><div><div class="fi-card__title">${esc(m.nome)}${String(m.nome).includes(String(m.ano)) ? '' : ' · ' + m.ano}</div>
      <div class="fi-card__note">${esc((byId(S.tabelas, m.tabela_id) || {}).nome || '')}</div></div></div>
      <div class="fi-card__body">
      <div class="fi-grid fi-grid--4">
        <div class="fi-card fi-metric fi-metric--brand"><div class="fi-metric__top"><span>${MESES_LONGO[mes - 1]}</span><span class="mt-pill ${classeMult(mm.mult)}">${mm.apurado ? multTxt(mm.mult) : '—'}</span></div>
          <div class="fi-metric__value">${pct(mm.ating)}</div><div class="fi-metric__foot">${brl0(mm.real || 0)} de ${brl0(mm.meta)}</div></div>
        <div class="fi-card fi-metric"><div class="fi-metric__top"><span>Prêmio do mês</span></div><div class="fi-metric__value">${brl(mm.total)}</div><div class="fi-metric__foot">base ${brl(mm.base)}</div></div>
        <div class="fi-card fi-metric"><div class="fi-metric__top"><span>Acumulado no ano</span></div><div class="fi-metric__value">${pct(c.atingAte)}</div><div class="fi-metric__foot">${brl0(c.realAte)} de ${brl0(c.metaAte)}</div></div>
        <div class="fi-card fi-metric"><div class="fi-metric__top"><span>Premiação acumulada</span></div><div class="fi-metric__value">${brl(c.totalAte)}</div><div class="fi-metric__foot">potencial do ano (1×) ${brl0(c.premioBaseAno)}</div></div>
      </div>
      <div class="fi-eyebrow mt-mt2">Quanto falta em ${MESES_LONGO[mes - 1]}</div>
      ${comissaoHtml(m, x, mes)}
      <div class="mt-mt2">${tabelaAnoHtml(m, x, c)}</div>
      </div></section>`;
    html += regraHtml(byId(S.tabelas, m.tabela_id));
  });
  $('#view').innerHTML = html;
}

/* ============================ ADMINISTRAÇÃO ============================ */

/* ------------------------------ Regiões ------------------------------ */
function aRegioes() {
  const cont = r => S.vendedores.filter(v => v.regiao_id === r.id).length;
  $('#adm-body').innerHTML = `<section class="fi-card"><div class="fi-card__head"><div class="fi-card__title">Regiões de atendimento</div>
    <button class="fi-btn fi-btn--primary" id="bt-novo">Nova região</button></div>
    <div class="fi-table-wrap" style="border:0"><table class="fi-table"><thead><tr><th>Região</th><th>Descrição</th><th class="mt-num">Vendedores</th><th>Status</th><th></th></tr></thead><tbody>
    ${S.regioes.map(r => `<tr><td class="mt-strong">${esc(r.nome)}</td><td>${esc(r.descricao || '')}</td><td class="mt-num">${cont(r)}</td>

function formTabela(t) {
  t = t || { nome: '', faixas: [{ min: 90, mult: 0.5 }, { min: 100, mult: 1 }, { min: 105, mult: 2 }], recup_tri: true, recup_anual: true, observacao: '' };
  const emUso = t.id && S.modulos.some(m => m.tabela_id === t.id);
  const linhaFaixa = f => `<div class="mt-faixa" data-faixa>
      <label class="fi-field"><span class="fi-label">Atingimento mínimo (%)</span><input class="fi-input" data-min value="${num(f.min, f.min % 1 ? 1 : 0)}"></label>
      <label class="fi-field"><span class="fi-label">Paga do prêmio-base (%)</span><input class="fi-input" data-mult value="${num(f.mult * 100, 0)}"></label>
      <div class="fi-field"><span class="fi-label">Equivale a</span><div class="mt-small mt-muted" data-eq style="min-height:38px;display:flex;align-items:center"></div></div>
      <button class="fi-icon-btn" data-rm title="Remover faixa">✕</button></div>`;
  const el = modal({ titulo: t.id ? 'Editar tabela de premiação' : 'Nova tabela de premiação', largura: 720,
    corpo: `<label class="fi-field"><span class="fi-label">Nome *</span><input class="fi-input" id="t-nome" value="${esc(t.nome)}"></label>
      ${emUso ? '<div class="fi-alert fi-alert--warning">Tabela em uso: mudanças valem para os meses ainda não fechados dos módulos que a usam.</div>' : ''}
      <div id="t-faixas" style="display:grid;gap:8px">${faixasOrd(t).map(linhaFaixa).join('')}</div>
      <div><button class="fi-btn" id="t-add">+ Faixa</button></div>
      <label class="mt-check"><input type="checkbox" id="t-tri" ${t.recup_tri ? 'checked' : ''}> Recuperação trimestral — batendo a soma do trimestre, recupera os meses do trimestre que ficaram abaixo de 100%</label>
      <label class="mt-check"><input type="checkbox" id="t-ano" ${t.recup_anual ? 'checked' : ''}> Recuperação anual — batendo a soma do ano, recupera os meses ainda não recuperados</label>
      <label class="fi-field"><span class="fi-label">Observação</span><textarea class="fi-textarea" id="t-obs">${esc(t.observacao || '')}</textarea></label>
      <div class="mt-help">Exemplo de leitura: meta R$ 100.000 e prêmio-base R$ 1.000 → a faixa de 100% (1×) paga R$ 1.000 sobre R$ 100.000 vendidos = 1,00% de comissão; a de 90% (50%) paga R$ 500 sobre R$ 90.000 = 0,56%; a de 105% (2×) paga R$ 2.000 sobre R$ 105.000 = 1,90%.</div>`,
    botoes: [
      ...(t.id && !emUso ? [{ texto: 'Excluir', perigo: true, esquerda: true, acao: async () => {
        if (!await confirmar({ title: 'Excluir tabela', message: 'Excluir esta tabela de premiação?', confirmText: 'Excluir', danger: true })) return false;
        await q(S.sb.from('met_tabelas').delete().eq('id', t.id)); await recarregar('Tabela excluída'); } }] : []),
      { texto: 'Cancelar' },
      { texto: 'Salvar', primario: true, acao: async () => {
        const faixas = $$('[data-faixa]', el).map(r => ({ min: parseBR($('[data-min]', r).value), mult: (parseBR($('[data-mult]', r).value) || 0) / 100 }))
          .filter(f => f.min != null).sort((a, b) => a.min - b.min);
        const d = { nome: $('#t-nome').value.trim(), faixas, recup_tri: $('#t-tri').checked, recup_anual: $('#t-ano').checked, observacao: $('#t-obs').value.trim() || null };
        if (!d.nome) { notify('Informe o nome da tabela.', 'warning'); return false; }
        if (!faixas.length) { notify('Inclua ao menos uma faixa.', 'warning'); return false; }
        if (t.id) await q(S.sb.from('met_tabelas').update(d).eq('id', t.id));
        else await q(S.sb.from('met_tabelas').insert(d));
        await recarregar('Tabela salva');
      } }] });
  const atualizaEq = () => $$('[data-faixa]', el).forEach(r => {
    const mi = parseBR($('[data-min]', r).value), mu = (parseBR($('[data-mult]', r).value) || 0) / 100;
    $('[data-eq]', r).textContent = mi ? `${multTxt(mu)} do prêmio · ${pct(mu / (mi / 100), 2)} do prêmio-base por 1% de meta` : '';
  });
  const liga = () => { $$('[data-rm]', el).forEach(b => b.onclick = () => { b.closest('[data-faixa]').remove(); }); $$('input', $('#t-faixas', el)).forEach(i => i.oninput = atualizaEq); atualizaEq(); };
  $('#t-add', el).onclick = () => { $('#t-faixas', el).insertAdjacentHTML('beforeend', linhaFaixa({ min: 110, mult: 2 })); liga(); };
  liga();
}

/* Vendedores atrelados ao módulo: meta e prêmio-base por mês */
function editorVinculos(m) {
  const t = byId(S.tabelas, m.tabela_id);
  const fech = fechadosDe(m.id);
  const atuais = vincDe(m.id);
  const candidatos = S.vendedores.filter(v => v.ativo && !atuais.some(x => x.vendedor_id === v.id) && (!m.regiao_id || v.regiao_id === m.regiao_id));
  const outros = S.vendedores.filter(v => v.ativo && !atuais.some(x => x.vendedor_id === v.id) && m.regiao_id && v.regiao_id !== m.regiao_id);
  const linha = x => {
    const eq100 = comissaoEquiv(t, sum(x.metas), sum(x.premios)).find(e => e.mult === 1);
    return `<tr><td class="mt-strong">${esc(x.v.nome)}</td><td>${esc((byId(S.regioes, x.v.regiao_id) || {}).nome || '—')}</td>
      <td class="mt-num">${brl0(sum(x.metas))}</td><td class="mt-num">${brl0(sum(x.premios))}</td><td class="mt-num">${pct(eq100 ? eq100.pct : null, 2)}</td>
      <td class="mt-num" style="white-space:nowrap"><button class="fi-btn" data-mm="${x.vendedor_id}">Metas e prêmios</button>
      <button class="fi-icon-btn" data-rmv="${x.vendedor_id}" title="Remover do módulo">✕</button></td></tr>`;
  };
  const el = modal({ titulo: 'Vendedores e metas — ' + m.nome + ' (' + m.ano + ')', largura: 900,
    corpo: `<div class="mt-row"><select class="fi-select" id="vv-add" style="max-width:340px"><option value="">Atrelar vendedor…</option>
        ${candidatos.map(v => `<option value="${v.id}">${esc(v.nome)}</option>`).join('')}
        ${outros.length ? `<optgroup label="Outras regiões">${outros.map(v => `<option value="${v.id}">${esc(v.nome)}</option>`).join('')}</optgroup>` : ''}</select>
        <button class="fi-btn fi-btn--primary" id="vv-bt">Atrelar</button>
        ${candidatos.length > 1 ? `<button class="fi-btn" id="vv-todos">Atrelar todos${m.regiao_id ? ' da região' : ''} (${candidatos.length})</button>` : ''}</div>
      <div class="fi-table-wrap"><table class="fi-table"><thead><tr><th>Vendedor</th><th>Região</th><th class="mt-num">Meta anual</th><th class="mt-num">Prêmio-base anual</th><th class="mt-num">Comissão equiv. 100%</th><th></th></tr></thead>
      <tbody>${atuais.map(linha).join('') || '<tr><td colspan="6"><div class="fi-empty">Nenhum vendedor atrelado.</div></td></tr>'}</tbody></table></div>
      ${fech.size ? `<div class="fi-alert fi-alert--warning">Meses já fechados (${[...fech].sort((a, b) => a - b).map(i => MESES[i - 1]).join(', ')}) ficam travados na edição de metas.</div>` : ''}`,
    botoes: [{ texto: 'Concluir', primario: true }] });
  const vincular = async ids => {

async function gravarRealizado(m, itens) {
  const quem = S.nome || S.email;
  const ups = itens.filter(i => i.valor != null).map(i => ({ modulo_id: m.id, vendedor_id: i.vendedor_id, mes: i.mes, valor: i.valor, atualizado_em: new Date().toISOString(), atualizado_por: quem }));
  const dels = itens.filter(i => i.valor == null);
  if (ups.length) await q(S.sb.from('met_realizado').upsert(ups, { onConflict: 'modulo_id,vendedor_id,mes' }));
  for (const d of dels) await q(S.sb.from('met_realizado').delete().eq('modulo_id', m.id).eq('vendedor_id', d.vendedor_id).eq('mes', d.mes));
}
function modeloExcel(m) {
  if (!window.XLSX) { notify('Biblioteca de Excel ainda carregando, tente de novo.', 'warning'); return; }
  const linhas = [];
  vincDe(m.id).forEach(x => MESES.forEach((_, i) => {
    const r = realDe(m.id, x.vendedor_id)[i];
    linhas.push({ email: x.v.email, vendedor: x.v.nome, mes: i + 1, valor: r == null ? '' : r });
  }));
  const ws = XLSX.utils.json_to_sheet(linhas.length ? linhas : [{ email: '', vendedor: '', mes: '', valor: '' }]);
  ws['!cols'] = [{ wch: 30 }, { wch: 28 }, { wch: 6 }, { wch: 14 }];
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Realizado');
  XLSX.writeFile(wb, `realizado_${m.nome.replace(/[^\w]+/g, '_')}_${m.ano}.xlsx`);
}
function mesDe(v) {
  if (v == null || v === '') return null;
  if (v instanceof Date) return v.getMonth() + 1;
  if (typeof v === 'number') { if (v >= 1 && v <= 12) return Math.round(v); if (v > 20000) { const d = new Date(Math.round((v - 25569) * 864e5)); return d.getUTCMonth() + 1; } return null; }
  const s = String(v).trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  if (/^\d{1,2}$/.test(s)) { const n = Number(s); return n >= 1 && n <= 12 ? n : null; }
  let mm = s.match(/^(\d{4})[-/](\d{1,2})/); if (mm) return Number(mm[2]);
  mm = s.match(/^(\d{1,2})[-/](\d{4})$/); if (mm) return Number(mm[1]);
  mm = s.match(/^\d{1,2}\/(\d{1,2})\/\d{2,4}$/); if (mm) return Number(mm[1]);
  const i = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'].findIndex(p => s.startsWith(p));
  return i >= 0 ? i + 1 : null;
}
async function importarExcel(m, file) {
  if (!window.XLSX) { notify('Biblioteca de Excel ainda carregando, tente de novo.', 'warning'); return; }
  const fech = fechadosDe(m.id), vinc = vincDe(m.id);
  let rows;
  try { const wb = XLSX.read(await file.arrayBuffer(), { cellDates: true }); rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' }); }
  catch (e) { notify('Não consegui ler a planilha: ' + e.message, 'danger'); return; }
  const norm = o => { const r = {}; Object.keys(o).forEach(k => { r[k.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim()] = o[k]; }); return r; };
  const ok = [], erros = [], soma = new Map();
  rows.map(norm).forEach((r, idx) => {
    const lin = idx + 2;
    const em = String(r.email || r['e-mail'] || '').trim().toLowerCase(), nm = String(r.vendedor || r.nome || '').trim().toLowerCase();
    if (!em && !nm && (r.valor === '' || r.valor == null)) return;
    const x = vinc.find(z => (em && z.v.email === em)) || vinc.find(z => nm && z.v.nome.toLowerCase() === nm);
    const mes = mesDe(r.mes != null && r.mes !== '' ? r.mes : (r.data || r.periodo || r.competencia));
    const valor = r.valor === '' || r.valor == null ? null : parseBR(r.valor);
    if (!x) return erros.push(`Linha ${lin}: vendedor “${em || nm}” não está neste módulo`);
    if (!mes) return erros.push(`Linha ${lin}: mês inválido`);
    if (valor == null) return erros.push(`Linha ${lin}: valor vazio ou inválido`);
    if (fech.has(mes)) return erros.push(`Linha ${lin}: ${MESES[mes - 1]} já está fechado`);
    const k = x.vendedor_id + '|' + mes;
    soma.set(k, (soma.get(k) || 0) + valor);   // várias linhas do mesmo vendedor/mês são somadas
  });
  soma.forEach((v, k) => { const [vid, mes] = k.split('|'); ok.push({ vendedor_id: vid, mes: Number(mes), valor: v }); });
  const nomeV = id => (byId(S.vendedores, id) || {}).nome;
  modal({ titulo: 'Prévia da importação — ' + file.name, largura: 760,
    corpo: `<div class="mt-small">${ok.length} lançamento(s) válidos${erros.length ? `, <b class="mt-neg">${erros.length} linha(s) ignorada(s)</b>` : ''}. Linhas do mesmo vendedor e mês são somadas. Os valores importados <b>substituem</b> o que estiver lançado.</div>
      ${erros.length ? `<div class="fi-alert fi-alert--warning" style="display:block;max-height:120px;overflow:auto">${erros.slice(0, 50).map(esc).join('<br>')}</div>` : ''}
      <div class="fi-table-wrap" style="max-height:320px;overflow:auto"><table class="fi-table"><thead><tr><th>Vendedor</th><th>Mês</th><th class="mt-num">Atual</th><th class="mt-num">Importado</th></tr></thead><tbody>
      ${ok.sort((a, b) => nomeV(a.vendedor_id).localeCompare(nomeV(b.vendedor_id)) || a.mes - b.mes).map(o => {
        const at = realDe(m.id, o.vendedor_id)[o.mes - 1];
        return `<tr><td>${esc(nomeV(o.vendedor_id))}</td><td>${MESES[o.mes - 1]}</td><td class="mt-num mt-muted">${at == null ? '—' : brl(at)}</td><td class="mt-num mt-strong">${brl(o.valor)}</td></tr>`; }).join('')}
      </tbody></table></div>`,
    botoes: [{ texto: 'Cancelar' }, ...(ok.length ? [{ texto: `Gravar ${ok.length} lançamento(s)`, primario: true, acao: async () => { await gravarRealizado(m, ok); await recarregar('Importação gravada'); } }] : [])] });
}

      ${!fechado && semLanc ? `<div class="fi-alert fi-alert--warning">${semLanc} vendedor(es) sem lançamento em ${MESES[mes - 1]} — no fechamento serão considerados R$ 0,00.</div>` : ''}

      ${linhas.map(({ x, d, semLanc: sl }) => !d ? `<tr><td>${esc(x.v.nome)}</td><td colspan="12" class="mt-muted">Sem registro neste fechamento (atrelado depois).</td></tr>` :
        `<tr><td class="mt-strong">${esc(d.vendedor || x.v.nome)}${sl ? ' <span class="fi-badge fi-badge--warning">sem lançamento</span>' : ''}</td>
        <td class="mt-num">${brl(d.meta)}</td><td class="mt-num">${brl(d.realizado)}</td><td class="mt-num">${pct(d.atingimento)}</td>
        <td><span class="mt-pill ${classeMult(d.multiplicador)}">${multTxt(d.multiplicador)}</span></td><td class="mt-num">${brl(d.premio_base)}</td>
        <td class="mt-num">${brl(d.premio_mes)}</td>
        ${ehTri ? `<td class="mt-num">${pct(d.trimestre_atingimento)}</td><td class="mt-num ${d.recuperacao_tri ? 'mt-pos mt-strong' : ''}">${brl(d.recuperacao_tri)}</td>` : ''}
        ${mes === 12 ? `<td class="mt-num">${pct(d.ano_atingimento)}</td><td class="mt-num ${d.recuperacao_ano ? 'mt-pos mt-strong' : ''}">${brl(d.recuperacao_ano)}</td>` : ''}
        <td class="mt-num mt-strong">${brl(d.total)}</td><td class="mt-num">${pct(d.realizado ? d.total / d.realizado : null, 2)}</td></tr>`).join('') ||
        '<tr><td colspan="13"><div class="fi-empty">Nenhum vendedor atrelado.</div></td></tr>'}
      </tbody>${linhas.length ? `<tfoot><tr><td>Total</td><td class="mt-num">${brl(tot('meta'))}</td><td class="mt-num">${brl(tot('realizado'))}</td>
        <td class="mt-num">${pct(tot('meta') ? tot('realizado') / tot('meta') : null)}</td><td></td><td class="mt-num">${brl(tot('premio_base'))}</td><td class="mt-num">${brl(tot('premio_mes'))}</td>
        ${ehTri ? `<td></td><td class="mt-num">${brl(tot('recuperacao_tri'))}</td>` : ''}${mes === 12 ? `<td></td><td class="mt-num">${brl(tot('recuperacao_ano'))}</td>` : ''}
        <td class="mt-num">${brl(tot('total'))}</td><td class="mt-num">${pct(tot('realizado') ? tot('total') / tot('realizado') : null, 2)}</td></tr></tfoot>` : ''}</table></div>
    <div class="fi-card__foot">Comissão efetiva = total a pagar ÷ realizado do mês.</div></section>
    ${regraHtml(t)}`;
  $('#adm-body').innerHTML = html;
  if (UI()) UI().init($('#adm-body'));
  $('#f-mod').onchange = e => { S.fechModulo = e.target.value; S.fechMes = null; aFechamentos(); };
  $$('[data-fm]').forEach(b => b.onclick = () => { S.fechMes = Number(b.dataset.fm); aFechamentos(); });
  $('#f-print').onclick = () => window.print();
  $('#f-xls').onclick = () => exportarFechamento(m, mes, linhas, fechado, ehTri);
  const bf = $('#f-fechar');
  if (bf) bf.onclick = async () => {
    if (!await confirmar({ title: `Fechar ${MESES_LONGO[mes - 1]}/${m.ano}`, message: `Congela os valores de ${linhas.length} vendedor(es) — total a pagar ${brl(tot('total'))}. Os lançamentos deste mês ficam travados.`, confirmText: 'Fechar mês' })) return;
    bf.disabled = true;
    try {
      const quem = S.nome || S.email;
      await q(S.sb.from('met_fechamentos').insert(linhas.filter(l => l.d).map(l => ({ modulo_id: m.id, mes, vendedor_id: l.x.vendedor_id, dados: l.d, fechado_por: quem }))));
      S.fechMes = Math.min(12, mes + 1);
      await recarregar(`${MESES_LONGO[mes - 1]} fechado`);
    } catch (e) { notify(erroMsg(e), 'danger'); bf.disabled = false; }
  };
  const br = $('#f-reabrir');
  if (br) br.onclick = async () => {
    if (!await confirmar({ title: `Reabrir ${MESES_LONGO[mes - 1]}`, message: 'Apaga o fechamento congelado deste mês e libera os lançamentos para correção.', confirmText: 'Reabrir', danger: true })) return;
    try { await q(S.sb.from('met_fechamentos').delete().eq('modulo_id', m.id).eq('mes', mes)); await recarregar(`${MESES_LONGO[mes - 1]} reaberto`); }
    catch (e) { notify(erroMsg(e), 'danger'); }
  };
}
function snapshot(m, t, x, c, mm) {
  const tq = c.tri[Math.ceil(mm.mes / 3) - 1];
  return {
    vendedor: x.v.nome, email: x.v.email, regiao: (byId(S.regioes, x.v.regiao_id) || {}).nome || null,
    meta: mm.meta, realizado: mm.real || 0, atingimento: mm.ating, multiplicador: mm.mult,
    premio_base: mm.base, premio_mes: mm.premio,
    trimestre_atingimento: mm.mes % 3 === 0 ? tq.atingQ : null, recuperacao_tri: mm.pagoTri,
    meses_recuperados_tri: mm.mes % 3 === 0 ? c.meses.slice(mm.mes - 3, mm.mes).filter(z => z.recTri).map(z => z.mes) : [],
    ano_atingimento: mm.mes === 12 ? c.ano.atingA : null, recuperacao_ano: mm.pagoAno,
    meses_recuperados_ano: mm.mes === 12 ? c.meses.filter(z => z.recAno).map(z => z.mes) : [],
    total: mm.total, acumulado_ano: c.totalAte,
    tabela: t ? { nome: t.nome, faixas: faixasOrd(t), recup_tri: t.recup_tri, recup_anual: t.recup_anual } : null
  };
}
function exportarFechamento(m, mes, linhas, fechado, ehTri) {
  if (!window.XLSX) { notify('Biblioteca de Excel ainda carregando.', 'warning'); return; }
  const rows = linhas.filter(l => l.d).map(({ d }) => {
    const r = { Vendedor: d.vendedor, 'E-mail': d.email, 'Região': d.regiao || '', Meta: d.meta, Realizado: d.realizado,
      'Atingido %': d.atingimento == null ? '' : +(d.atingimento * 100).toFixed(2), Multiplicador: d.multiplicador,
      'Prêmio-base': d.premio_base, 'Prêmio mês': d.premio_mes };
    if (ehTri) { r['Trimestre %'] = d.trimestre_atingimento == null ? '' : +(d.trimestre_atingimento * 100).toFixed(2); r['Recuperação trimestre'] = d.recuperacao_tri; }
    if (mes === 12) { r['Ano %'] = d.ano_atingimento == null ? '' : +(d.ano_atingimento * 100).toFixed(2); r['Recuperação ano'] = d.recuperacao_ano; }
    r['Total a pagar'] = d.total; r['Acumulado no ano'] = d.acumulado_ano;
    return r;
  });
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, (fechado ? 'Fechamento ' : 'Previa ') + MESES[mes - 1]);
  XLSX.writeFile(wb, `fechamento_${m.nome.replace(/[^\w]+/g, '_')}_${m.ano}_${String(mes).padStart(2, '0')}${fechado ? '' : '_previa'}.xlsx`);
}
function exportarModulo(m, mes, linhas) {
  if (!window.XLSX) { notify('Biblioteca de Excel ainda carregando.', 'warning'); return; }
  const rows = [];
  linhas.forEach(({ x, c }) => c.meses.forEach(mm => rows.push({ Vendedor: x.v.nome, 'Mês': MESES[mm.mes - 1], Meta: mm.meta, Realizado: mm.real == null ? '' : mm.real,
    'Atingido %': mm.ating == null ? '' : +(mm.ating * 100).toFixed(2), Multiplicador: mm.apurado ? mm.mult : '', 'Prêmio-base': mm.base, 'Prêmio': mm.premio,
    'Rec. trimestre': mm.pagoTri, 'Rec. ano': mm.pagoAno, 'Total': mm.total })));
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), 'Metas ' + m.ano);
  XLSX.writeFile(wb, `metas_${m.nome.replace(/[^\w]+/g, '_')}_${m.ano}_ate_${MESES[mes - 1]}.xlsx`);
}

/* ------------------------------ início ------------------------------ */
async function iniciar() {
  try {
    const app = await window.APP.pronto;
    S.sb = app.sb; S.perm = app.permissao; S.admin = app.permissao === 'admin';
    S.veTudo = S.admin || app.permissao === 'editar';
    S.email = String(app.usuario.email || '').toLowerCase(); S.nome = app.usuario.nome || '';
    if (S.admin) $('#nav-adm').classList.remove('mt-hidden');
    await carregar();
    if (!meusVendedores().length && S.veTudo) $('#nav-painel').classList.add('mt-hidden');
    window.addEventListener('hashchange', rota);
    rota();
  } catch (e) {
    if (typeof e === 'string') return;      // guard já mostrou a tela adequada
    console.error(e);
    $('#view').innerHTML = `<div class="fi-alert fi-alert--danger">Não foi possível carregar os dados: ${esc(erroMsg(e))}</div>`;
  }
}
if (window.APP && window.APP.pronto) iniciar();
else document.addEventListener('DOMContentLoaded', () => window.APP && window.APP.pronto ? iniciar() : ($('#view').innerHTML = '<div class="fi-alert fi-alert--danger">Login da Central de Acesso não carregou.</div>'));
})();
</script>
